/* Spectral efficiency anchors (Mbps per MHz):
   SAT DL gen1 0.62 = UPM measurement (≈ FCC's 9-yr 600 kbps/MHz/beam DL milestone);
   SAT DL v2 2.48 = company-claimed 4× bandwidth-per-beam uplift (claim);
   SAT UL gen1 0.10 = FCC 2-yr milestone floor; v2 0.30 = 9-yr milestone / claims;
   TERR: user-set 2–6 bps/Hz small-cell efficiency. */
const SAT_EFF = { gen1: { dl: 0.62, ul: 0.10 }, v2: { dl: 2.48, ul: 0.30 } };

function calcZones(cfg, year = 2032) {
  const inSat = (a) => a === "sat" || a === "split";
  const inTerr = (a) => a === "terr" || a === "split";
  let satDL = 0, satUL = 0, terrDL = 0, terrUL = 0, leasedDL = 0, leasedUL = 0;
  const gates = [];
  for (const b of BLOCKS) {
    const a = cfg[b.id];
    if (inSat(a)) {
      // a4main in sat mode contributes UL only (n252 uplink); its DL twin is a4dl
      const hULStranded = b.id === "h" && year < 2029;
      satUL += b.id === "a4main" ? 20 : hULStranded ? 0 : b.ulMHz;
      satDL += b.id === "a4main" ? 0 : b.dlMHz;
      if (hULStranded) gates.push("H-block satellite = DL-only (5 MHz): the 1915\u20131920 uplink is stranded \u2014 no handset band covers it; needs new standards + phone RF (~2029+ at best)");
      if (b.id === "g") { leasedDL += b.dlMHz; leasedUL += b.ulMHz; }
      if (b.satGate) gates.push(`${b.label}: ${b.satGate}`);
    }
    if (inTerr(a)) {
      // a4main in terr mode contributes DL only (n70 downlink)
      terrDL += b.id === "a4main" ? 20 : b.dlMHz;
      terrUL += b.id === "a4main" ? 0 : b.ulMHz;
    }
  }
  const eff = SAT_EFF[cfg.gen];
  return {
    satDLMHz: satDL, satULMHz: satUL, terrDLMHz: terrDL, terrULMHz: terrUL,
    leasedDL, leasedUL, ownedDL: satDL - leasedDL, ownedUL: satUL - leasedUL,
    satDLMbps: satDL * eff.dl, satULMbps: satUL * eff.ul,
    terrDLMbps: terrDL * cfg.terrEff, terrULMbps: terrUL * cfg.terrEff * 0.6,
    gates,
    boundary: cfg.a4main === "split",
  };
}

function feasibility(cfg) {
  const satU = (a) => a === "sat" || a === "split";
  const terrU = (a) => a === "terr" || a === "split";
  const gates = [];
  let year = 2026;
  const need = (y, t) => { gates.push({ y, t }); if (y > year) year = y; };
  if (["aws3", "h", "a4main", "a4dl"].some((id) => cfg[id] !== "off"))
    need(2027, "EchoStar deal consummation (deadline Nov 2027)");
  if (cfg.g !== "off")
    gates.push({ y: 2026, t: "G-block MANUALLY INCLUDED: T-Mobile spectrum under a revocable SCS lease — partner-channel capacity serving T-Mobile service, NOT fourth-carrier capacity; excluded from every default scenario" });
  if (satU(cfg.a4main) || satU(cfg.a4dl))
    need(2027, "n252 from orbit: 2027 satellites + first Rel-19/X105-class handsets (handset volume ~2028\u201329)");
  if (satU(cfg.h))
    need(2027, "H-block from orbit: via SCS adapted-LTE once the D2C application grants (~2027); full NR-NTN needs a 3GPP band work item nobody has filed (~2029+ if championed)");
  if (satU(cfg.aws3))
    need(2029, "AWS-3 supplemental UL from orbit: 3GPP NTN + FCC Earth-to-space treatment — the furthest-out gate");
  if (["aws3", "h", "a4main", "a4dl"].some((id) => terrU(cfg[id])))
    need(2028, "Femtocell/terrestrial layer at meaningful scale (service from ~late 2027)");
  if (cfg.gen === "v2")
    need(2027, "Dedicated D2C satellites flying at scale (launches from mid-2027)");
  gates.sort((a, b) => a.y - b.y);
  return { year, gates };
}

function clampCfgToYear(cfg, year) {
  const c = { ...cfg };
  const changes = [];
  const chg = (id, from, to, why) => { c[id] = to; changes.push(`${id === "a4main" ? "2000\u20132020" : id === "a4dl" ? "2180\u20132200" : id.toUpperCase()}: ${from.toUpperCase()} \u2192 ${to.toUpperCase()} — ${why}`); };
  const ownedIds = ["aws3", "h", "a4main", "a4dl"];
  for (const id of ownedIds) {
    if (cfg[id] !== "off" && year < 2027) { chg(id, cfg[id], "off", "owned spectrum unusable before deal consummation (2027)"); continue; }
    const a = c[id];
    const satOK = id === "aws3" ? year >= 2029 : year >= 2027;
    const terrOK = year >= 2028;
    if (a === "sat" && !satOK) chg(id, a, terrOK && id !== "a4dl" ? "terr" : "off", id === "aws3" ? "satellite SUL opens ~2029 (3GPP + FCC)" : "satellite path opens ~2027");
    else if (a === "terr" && !terrOK) chg(id, a, "off", "femtocell layer at scale from ~2028");
    else if (a === "split") {
      if (!satOK && terrOK) chg(id, a, "terr", "satellite half not yet available");
      else if (satOK && !terrOK) chg(id, a, "sat", "terrestrial half not yet at scale (~2028)");
      else if (!satOK && !terrOK) chg(id, a, "off", "neither mode available yet");
    }
  }
  if (cfg.gen === "v2" && year < 2027) { c.gen = "gen1"; changes.push("Satellites: V2 \u2192 Gen1 — dedicated D2C satellites fly from mid-2027"); }
  return { cfg: c, changes };
}

/* ------------------------- TRAJECTORY ------------------------- */

function Trajectory({ phase, setPhase }) {
  const W = 900, H = 190;
  const pathD = `M 40 ${H - 34} C ${W * 0.3} ${H - 40}, ${W * 0.55} 66, ${W - 40} 38`;
  const pts = PHASES.map((p) => {
    const t = 0.08 + p.orbit * 0.9;
    const x0 = 40, y0 = H - 34, x1 = W * 0.3, y1 = H - 40, x2 = W * 0.55, y2 = 66, x3 = W - 40, y3 = 38;
    const mt = 1 - t;
    const x = mt*mt*mt*x0 + 3*mt*mt*t*x1 + 3*mt*t*t*x2 + t*t*t*x3;
    const y = mt*mt*mt*y0 + 3*mt*mt*t*y1 + 3*mt*t*t*y2 + t*t*t*y3;
    return { x, y };
  });
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block" }} role="img"
      aria-label="Trajectory from today's texting service to a scaled carrier">
      <line x1="0" y1={H - 18} x2={W} y2={H - 18} stroke={C.line} strokeWidth="1" />
      <text x="42" y={H - 4} fill={C.dim} fontSize="10" fontFamily="var(--mono)" letterSpacing="0.1em">GROUND · AUG 2026</text>
      <text x={W - 42} y="22" fill={C.dim} fontSize="10" fontFamily="var(--mono)" letterSpacing="0.1em" textAnchor="end">SCALED SERVICE · 2030+</text>
      <path d={pathD} fill="none" stroke={C.line} strokeWidth="1.5" strokeDasharray="1 5" />
      <path d={pathD} fill="none" stroke={C.amber} strokeWidth="2"
        strokeDasharray="1200" strokeDashoffset={1200 - (200 + PHASES[phase].orbit * 1000)}
        style={{ transition: "stroke-dashoffset 700ms cubic-bezier(.4,0,.2,1)" }} opacity="0.85" />
      {pts.map((pt, i) => (
        <g key={i} onClick={() => setPhase(i)} style={{ cursor: "pointer" }}>
          <circle cx={pt.x} cy={pt.y} r="16" fill="transparent" />
          <circle cx={pt.x} cy={pt.y} r={i === phase ? 7 : 4.5}
            fill={i === phase ? C.amber : C.panel}
            stroke={i <= phase ? C.amber : C.dim} strokeWidth="1.5"
            style={{ transition: "all 300ms" }} />
          <text x={pt.x} y={pt.y - 14} textAnchor="middle" fill={i === phase ? C.text : C.dim}
            fontSize="10" fontFamily="var(--mono)" letterSpacing="0.08em">P{i}</text>
        </g>
      ))}
    </svg>
  );
}

          the US) licenses lanes exclusively: buy a license and you're the only one allowed to transmit there, nationwide.
          That's the entire asset. The catch is that phones are built in factories years in advance to work on a fixed menu
          of lanes (the "bands" — n70, n25 and so on are just menu numbers), so a lane is only valuable if phones already
          speak it — which is exactly why SpaceX paid a premium for EchoStar's lanes, which sit inside Band 70 and are
          already supported in recent iPhones and Androids, rather than buying cheaper lanes no phone can hear. 65 MHz is

          transmits only under a lease from the terrestrial licensee, and SpaceX's authority there evaporates if the
          T-Mobile agreement ends. Nor could SpaceX build its own competing carrier on it — legally the use flows through
          T-Mobile's license, and commercially the lease exists to power T-Mobile's product (T-Satellite), not to arm a
          rival. That's the strategic logic of the $19.6B purchase in one line: it converted SpaceX from tenant to owner.
          Today's live texting service runs on the borrowed G-block as T-Mobile's partner; the fourth-carrier ambition —
          Starlink Mobile, femtocells, the 2027 satellites — is built entirely on the owned 65. When comparing against
          the Big Three's holdings, 65 is the honest number.

        phone; the FCC milestone ladder SpaceX itself negotiated benchmarks this service at <strong>5 dB SINR, 90%
        availability</strong> — a ~25 dB gap no power waiver or aperture jump closes as an operating point. Dual-stream
        MIMO from one satellite additionally requires polarization multiplexing to a randomly oriented handset (a rank-1
        line-of-sight channel otherwise). Note what SpaceX's aggressive numbers actually claim: "20×
        throughput, 100× capacity" are <em>capacity multipliers</em> (beams × MHz × efficiency summed
        per satellite), not per-Hz efficiency — and their official 7.5 bps/Hz peak is the tell that their engineers
        claimed the 64QAM ceiling, not the 256QAM one. Peak-to-average of ~3× (150 peak vs ~50 shared) matches every
        terrestrial LTE network ever deployed: 150 is the sprint, 50 is the marathon pace.
      </p>
    </div>

            +6 dB). Stack them and the ledger barely balances — which is why every single dB in this story is fought over:
            a 3 dB regulatory power waiver (2× power) was worth a year of FCC litigation, and the 5× bigger 2027 antenna

          Six-plus orders of magnitude apart in the hybrid configurations — and that's the whole strategy in one chart. The
          satellite layer buys ubiquity (every km² gets <em>something</em>); the femtocell layer buys intensity (huge Mbps/km²,
          in dots tens of meters wide). Incumbents solve the pairing with ~250k macro towers and &gt;1M small cells; SpaceX's
          bet is satellites + dish-mounted femtocells approximate it without the tower capex. The V2 150 Mbps headline is a
          peak, single-user, best-case claim.
        </p>
        <Info label="why everyone under a beam shares one pipe — and what Mbps/km² means">
          A satellite beam is one radio channel painted over a patch of ground — like one Wi-Fi router asked to serve an
          entire county. Its Mbps figure is the <em>total</em> for everyone inside: two active users each get roughly half,
          twenty get a twentieth. That's why raw per-beam speed matters less than <strong>capacity density</strong> —
          Mbps per square kilometer — which asks the question that actually decides whether a network works: how much
          traffic can this patch of map carry at once? The chart above shows why the hybrid exists: a satellite beam
          spreads its Mbps over ~2,000 km² (a big number divided by a huge area = a tiny density), while a femtocell pours
          its Mbps into a ~50-meter circle (a modest number over a tiny area = enormous density). Cities need density;
          wilderness needs presence. No single technology delivers both — which is the one-sentence justification for the
          entire two-layer architecture, and the reason "150 Mbps from space" and "satellite can't serve cities" are both

        <p className="body" style={{ fontSize: 13, marginTop: 12, marginBottom: 8 }}>
          Read it as two gaps. The <strong>spectrum gap</strong> is roughly 6–8× against the satellite downlink —
          significant, but the kind of gap auctions can narrow (the Upper C-band in 2027 being the obvious shot, with
          AT&T expected to bid the same band). The <strong>reuse-density gap</strong> is the structural one: a
          terrestrial carrier re-spends its whole stack at every one of ~80,000+ macro sites, three sectors each, plus
          small cells — while a constellation re-spends its 20 MHz only as fast as beams-per-patch allows. That's why
          the incumbents' <em>median user</em> sees 230–390 Mbps while this network's end-state is ~47 Mbps <em>shared
          per cell</em> — and why the thesis on this site is a coverage product with a terrestrial urban layer, not a
          symmetric fourth competitor.
        </p>
        <Info label="why spectrum depth isn't the real gap — the reuse-density arithmetic, worked">
          <strong>The short version:</strong> spectrum is what you own; <em>capacity</em> is what you own multiplied by
          how many times you can spend it at once. Terrestrial networks win on the multiplier, not the spectrum.
          <br /><br />
          <strong>How a carrier spends its spectrum.</strong> T-Mobile's ~320 MHz of mid-band isn't delivered once — it
          is re-transmitted at every cell site, and at each site it is split into (typically) three sectors that each
          reuse the same channels behind directional antennas. With roughly 80,000+ macro sites in a national network,
          plus small cells in dense areas, the same 320 MHz is being spent simultaneously in hundreds of thousands of
          places. In a dense city that works out to a cell site every few hundred metres — so the spectrum is
          effectively re-spent every ~0.2 km². That is the multiplier: <em>capacity per km² = spectrum × sites per
          km² × sectors</em>.
          <br /><br />
          <strong>How a constellation spends its spectrum.</strong> A satellite re-spends its 20 MHz once per beam, and
          beams are ~9 km across (~62 km²; bracket 4.4–19.9) — about 300× the area of an urban cell sector, before you account for the
          fact that one satellite has only ~700 beams to cover a service patch of thousands of cells (Panel 6's duty
          figure). Frequency reuse from orbit is limited by beam geometry and elevation, which is why the reuse regime
          only reaches "all lanes" at high elevation — and why fleet growth, not spectrum purchases, is what raises the
          per-cell number from ~8 to ~47 Mbps.
          <br /><br />
          <strong>Putting numbers on it.</strong> Compare capacity per square kilometre, which is the only fair
          comparison when one network is terrestrial and the other orbital:
          <br />
          · <em>Urban macro sector:</em> ~100 MHz × ~5 bps/Hz ≈ 500 Mbps, serving perhaps 0.2 km² → on the order of
          <strong> 2,500 Mbps per km²</strong>, and that is before small cells.
          <br />
          · <em>Satellite beam at the end-state:</em> ~47 Mbps shared across ~15 km² → about
          <strong> 3 Mbps per km²</strong>.
          <br />
          That is a difference of roughly <strong>three orders of magnitude</strong> in delivered capacity density.
          Buying more spectrum narrows the first term; it does nothing to the second.
          <br /><br />
          <strong>Why this doesn't make the satellite layer useless — it makes it different.</strong> Capacity density
          only matters where people are dense. Across most of the country's land area, demand per km² is so low that
          3 Mbps/km² is entirely adequate, and there the satellite has an advantage no carrier can match: it covers
          ground where building a tower will never pay back. The conclusion isn't "the satellite loses"; it's that the
          two networks are optimised for opposite ends of the density curve — which is precisely why the plan on this
          site pairs orbit for coverage with a terrestrial femtocell layer for cities, and why the honest framing is a
          <em> coverage product with an urban ground layer</em> rather than a symmetric fourth competitor.
          <br /><br />
          <em>Caveat on the arithmetic:</em> the terrestrial figure is a rough order-of-magnitude sketch — real
          networks vary enormously by site density, sectorisation, spectrum deployed per site, and loading. Treat it as
          a bracket, like everything else here.
        </Info>

/* Fleet scale is the capacity story: total D2C capacity ≈ per-beam ×
   beams/sat × satellites overhead. This models how fast the authorized
   15,000 can actually exist — and what it costs to keep it existing. */

const CADENCE_PRESETS = [
  { id: "f9", name: "Falcon 9 only", per: 15, pm: 4, note: "~15 next-gen D2C birds per F9 (5× arrays are heavy), 4 dedicated launches/mo" },
  { id: "ship2", name: "Starship · 2/mo", per: 55, pm: 2, note: "Starship flying, cadence lagging" },
  { id: "ship4", name: "Starship · 4/mo (target)", per: 55, pm: 4, note: "The filing math: ~1,200 sats in six months" },
  { id: "ship8", name: "Starship · 8/mo", per: 60, pm: 8, note: "The bull-case cadence" },
];

function DeployClock({ compact }) {
  const [per, setPer] = useState(55);
  const [pm, setPm] = useState(4);
  const FLEET = 15000, LIFE = 5, SERVICE = 2000;
  const monthly = per * pm;
  const yearsToFleet = FLEET / (monthly * 12);
  const monthsToService = SERVICE / monthly;
  const sustainPerMonth = FLEET / LIFE / 12 / per; // launches/mo to replace 3,000/yr
  const steadyState = Math.round(per * pm * 12 * LIFE); // fleet this cadence can sustain
  const starved = steadyState < FLEET;

    <div className="card" style={{ borderTop: `2px solid ${C.red}` }}>

          sustainable fleet. Set a launch tempo and read the consequences.

          </div>
          <div>
            <span className="zN" style={{ color: sustainPerMonth > pm ? C.red : C.green }}>{sustainPerMonth.toFixed(1)}</span><span className="zU">launches/mo</span>
            <div className="zM">forever, just to replace ~3,000 sats/yr at 5-yr life</div>
          </div>
        </div>
      </div>
      <div className="indoorNote" style={{ borderColor: starved ? C.red : C.green }}>
        {starved
          ? <>At this tempo the treadmill wins: replacement alone consumes the cadence, capping the <strong style={{ color: C.red }}>sustainable fleet at ~{steadyState.toLocaleString()} satellites</strong> — the 15,000-sat capacity endgame never fully exists.</>
          : <>This tempo sustains the full constellation: <strong style={{ color: C.green }}>steady-state capacity ~{Math.min(steadyState, 30000).toLocaleString()}-sat class</strong>, with headroom above the 15,000 authorization. Buildout and replacement can run concurrently.</>}
      </div>

        <p className="body" style={{ fontSize: 12.5, color: C.dim, marginTop: 10 }}>

          drag and deorbit-compliance rules; ~2,000 for continuous coverage is an illustrative service threshold (the
          end-2028 target needs the low thousands, not 15k). Attrition, failed launches, and mixed manifests all push these
          numbers the wrong way. This is why every capacity claim in this tool carries the same footnote: Starship cadence.
        </p>
      )}
    </div>
  );
}

/* The phone is omnidirectional and satellite-unaware; the satellite does
   everything. These panels model footprint geometry, Earth-fixed-cell
   beam hopping with frequency reuse, and the Rel-17/19 NTN handset gain. */

function footprintGeom(hKm, elevDeg) {
  const Re = 6371;
  const e = (elevDeg * Math.PI) / 180;
  const lam = Math.acos((Re / (Re + hKm)) * Math.cos(e)) - e;
  const rKm = Re * lam;
  const area = 2 * Math.PI * Re * Re * (1 - Math.cos(lam));
  const cap = (1 - Math.cos(lam)) / 2;
  const N = Math.round(3.3 / cap); // Walker-overlap factor calibrated to ~650 @ 25°/530 km
  return { rKm, area, N };
}

function mulberry(seed) {
  let a = seed + 0x6d2b79f5;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

      <Info label="walk me through elevation angle — why it decides everything">
        Stand outside and point at a satellite. If it's 25° above the horizon, your arm is nearly level — and the signal
        path between you skims across everything around you: every tree line, rooftop, hill, and even your own body when
        you're turned the wrong way. If it's 60° up, you're pointing well overhead and the path clears most obstacles.
        A phone can't do anything about blockage — so the only fix is <em>waiting for (or having) a satellite high enough
        in the sky for your surroundings</em>. That's why the "right" angle depends on where you're standing: a Kansas
        wheat field is served fine by a satellite crawling along the horizon; a Manhattan sidewalk needs one nearly
        overhead. And satellites near overhead are rare — the sky directly above you is a small target — so demanding a
        high angle everywhere multiplies the number of satellites the constellation needs. The FCC understood this, which
        is why its rules don't say "cover at 45°"; they say "deliver a usable signal ≥70% (later 90%) of the time" —
        letting statistics over the whole sky do the talking.
      </Info>
      <Info label="how the satellite-count estimate is computed">
        Each satellite covers a circular cap of Earth's surface (the amber circle). Basic geometry gives that cap's size
        from altitude and elevation angle. Dividing Earth's surface by the cap area gives a theoretical minimum satellite
        count — but real constellations can't tile the sphere perfectly: orbits bunch coverage at some latitudes and
        satellites' circles must overlap to leave no gaps. We apply a ~3.3× "overlap inefficiency" factor, chosen so the
        model reproduces reality — SpaceX's actual ~650-satellite first-generation fleet delivering continuous ~25°
        coverage from 530 km. With the model anchored to a known truth, the other slider positions become credible
        extrapolations rather than guesses. It remains an estimate: real constellation design juggles inclinations,
        planes, and phasing that no single factor captures.
      </Info>
      <Info label="reach vs share vs illumination — the three circle sizes on this site">
        This site draws circles at three very different scales, and they nest. <strong>Reach</strong> (this panel's amber
        circle): everything one satellite <em>can</em> see above the elevation mask — set purely by altitude and mask
        geometry, and completely independent of how many other satellites exist. <strong>Share</strong> (Panel 6's faint
        circles): the slice of its reach a satellite <em>actually serves</em> once neighbors claim the rest — every cell
        goes to whichever satellite sees it steepest, so shares shrink as the fleet grows (~900 km across at 650
        satellites, ~190 km at 15,000) while reach never moves. <strong>Illumination</strong> (the ~5 km beam dots): the
        ground a satellite is <em>lighting this instant</em> inside its share, hopping to cover the rest. Reach ⊇ share ⊇
        lit beams. The satellite-count ladder on this panel is derived from reach — Earth's area ÷ one footprint (× a
        constellation overlap factor) — which is why the fleet number is an <em>output</em> of this circle, never an
        input to it. One more independence worth stating: reach — and therefore the satellite count for coverage — is
        <em>frequency-independent</em>: it's pure visibility geometry (altitude + mask). Moving from the leased G-block
        (1.99 GHz) to owned n252 (2.19 GHz) shrinks the <em>beams</em> ~10% (a capacity effect, Panel 1b) and costs
        ~1.2 dB of extra path loss (a link-margin nibble), but the footprint — and the ~650 — doesn't move.
      </Info>
      <Info label="why more satellites ≠ smaller beams (how coverage becomes capacity)">
        A common misreading of the ladder: that launching more satellites shrinks the beams. It doesn't — beam size is
        frozen into each satellite's hardware at the factory by the diffraction limit (wavelength ÷ antenna size) and the
        orbital altitude. A thousand more identical satellites leave every beam exactly as big as before. Densification
        actually runs on two separate clocks. <strong>Hardware generations shrink beams:</strong> Gen1's ~25 m² arrays at
        530 km paint ~20–50 km spots; the 2027 satellites' ~5× arrays at 330 km paint ~5–10 km — and there's a floor: at
        phone frequencies, ~4–5 km is roughly the physical minimum for buildable antennas (sub-km would need a ~50 m
        panel; nobody's flying that — see the beam-size lab below). <strong>Fleet growth densifies by stacking:</strong>
        more satellites overhead means more beams available per km², higher revisit duty-cycle per cell — and, subtly,
        <em> steeper average look angles</em>: with ten satellites in view instead of two, every cell gets handed to one
        nearly overhead, pushing more of the map into the full-menu reuse-1 zone (Panel 3). That last effect means
        per-cell spectrum and efficiency improve purely from fleet count, with zero hardware change — a capacity gain
        hiding inside a coverage number. So the ladder's real meaning: ~650 saturates coverage; everything beyond
        multiplies capacity along three compounding axes — beams-per-area, duty cycle, and look-angle quality — until the
        aperture floor, regulatory power-density ceilings, and the launch treadmill become the binding constraints.
        15,000 satellites isn't more coverage; it's the same coverage served ~20× more densely at steadily steeper angles.
      </Info>
    </div>
  );
}

function BeamSizeLab() {
  const [D, setD] = useState(11.2);   // aperture side, m
  const [f, setF] = useState(2.0);    // GHz
  const [h, setH] = useState(330);    // km
  const [be, setBe] = useState(90);   // beam elevation at the ground spot, deg
  const lam = 0.2998 / f;             // wavelength, m
  const th = lam / D;                 // beamwidth, rad (λ/D convention)
  const s = Math.sin((be * Math.PI) / 180);
  const nadirKm = th * h;
  const slant = h / s;
  const across = th * slant;          // km, cross-track
  const along = across / s;           // km, along look direction
  const area = Math.PI * (across / 2) * (along / 2);
  const Dsub = lam * h;               // aperture side for 1-km nadir cells at this f & h
  const PRESETS = [
    { n: "V2-Mini · 1 panel (35 dBi filed)", D: 2.5, f: 2.0, h: 530 },
    { n: "V2-Mini · 2-panel class (38 dBi)", D: 3.5, f: 2.0, h: 530 },
    { n: "2027 · panel-scaled center", D: 5.6, f: 2.0, h: 330 },
    { n: "2027 · full-aperture floor", D: 11.2, f: 2.0, h: 330 },
    { n: "AST BB2 · 850 MHz low-band", D: 14.9, f: 0.85, h: 520 },
    { n: "AST BB2 · same panel @ 2 GHz", D: 14.9, f: 2.0, h: 520 },
  ];
  const isPre = (p) => Math.abs(D - p.D) < 0.15 && Math.abs(f - p.f) < 0.03 && Math.abs(h - p.h) < 6;
  const k = Math.min(360 / Math.max(along, 0.001), 46); // px per km, capped
  return (
    <div className="card" style={{ borderTop: `2px solid #C79BFF` }}>
      <div className="eyebrow" style={{ color: "#C79BFF" }}>Panel 1b · Beam-size lab — panel size × frequency × altitude × look angle → spot on the ground <Src k="antenna" topic="fleet" /></div>
      <p className="body" style={{ marginBottom: 10 }}>
        Four knobs fully determine a spot beam. <strong>Panel size</strong>: bigger antenna → narrower beam (diffraction:
        beamwidth ≈ wavelength ÷ panel side). <strong>Frequency</strong>: higher frequency → shorter wavelength → narrower
        beam (why low-band partner spectrum re-widens AST's beams despite its giant panel). <strong>Altitude</strong>:
        the beam is a cone — farther away, wider spot. <strong>Look angle</strong>: off-nadir, the slant is longer and the
        landing oblique → the ellipse from Panel 1. Presets are per-beam apertures of real systems, not whole physical arrays (Gen1 forms each beam on 1–2 of its four ~6.25 m² panels — see the receipts); then break physics on purpose — drag the
        panel slider and watch what sub-km cells would demand.
      </p>
      <div className="tglRow" style={{ marginBottom: 10 }}>
        {PRESETS.map((p) => (
          <button key={p.n} className={"genBtn" + (isPre(p) ? " on" : "")}
            onClick={() => { setD(p.D); setF(p.f); setH(p.h); }}>{p.n}</button>
        ))}
      </div>
      <div className="split" style={{ alignItems: "start" }}>
        <div>
          <label className="sliderL">Antenna panel side: <strong>{D.toFixed(1)} m</strong> (~{(D * D).toFixed(0)} m² aperture)
            <input type="range" min="1" max="60" step="0.1" value={D} onChange={(e) => setD(+e.target.value)} /></label>
          <label className="sliderL">Frequency: <strong>{f.toFixed(2)} GHz</strong> (λ = {(lam * 100).toFixed(1)} cm)
            <input type="range" min="0.7" max="3.5" step="0.05" value={f} onChange={(e) => setF(+e.target.value)} /></label>
          <label className="sliderL">Orbital altitude: <strong>{h} km</strong>
            <input type="range" min="300" max="700" step="5" value={h} onChange={(e) => setH(+e.target.value)} /></label>
          <label className="sliderL">Beam elevation at the spot: <strong>{be}°</strong> {be >= 88 ? "(nadir)" : ""}
            <input type="range" min="25" max="90" value={be} onChange={(e) => setBe(+e.target.value)} /></label>
          <div className="statGrid" style={{ marginTop: 10 }}>
            <div className="stat"><div className="statL">Beamwidth</div><div className="statV">~{(th * 57.296).toFixed(2)}°</div></div>
            <div className="stat"><div className="statL">Spot at nadir</div><div className="statV">~{nadirKm.toFixed(1)} km ⌀</div></div>
            <div className="stat"><div className="statL">Spot at {be}°</div><div className="statV" style={{ color: C.amber }}>~{across.toFixed(1)} × {along.toFixed(1)} km · ~{area.toFixed(0)} km²</div></div>
            <div className="stat"><div className="statL">Panel needed for 1-km cells here</div>
              <div className="statV" style={{ color: "#C79BFF" }}>~{Dsub.toFixed(0)} m side (~{(Dsub * Dsub / 1000).toFixed(1)}k m²)</div></div>
          </div>
        </div>
        <svg viewBox="0 0 440 300" style={{ width: "100%", display: "block" }} role="img" aria-label="To-scale ground spot ellipse with kilometre dimensions">
          <text x="220" y="22" textAnchor="middle" fill={C.dim} fontSize="9.5" fontFamily="var(--mono)">GROUND SPOT · TO SCALE</text>
          <ellipse cx="220" cy="150" rx={Math.max((along / 2) * k, 1.5)} ry={Math.max((across / 2) * k, 1.5)}
            fill="rgba(199,155,255,0.18)" stroke="#C79BFF" strokeWidth="1.5" style={{ transition: "all 150ms" }} />
          <line x1={220 - (along / 2) * k} y1="150" x2={220 + (along / 2) * k} y2="150" stroke="#C79BFF" strokeWidth="0.8" strokeDasharray="2 3" opacity="0.7" />
          <text x="220" y={158 + Math.max((across / 2) * k, 1.5) + 14} textAnchor="middle" fill="#C79BFF" fontSize="10.5" fontFamily="var(--mono)">
            {along.toFixed(1)} km along look · {across.toFixed(1)} km across
          </text>
          {/* 10 km scale bar */}
          {10 * k < 380 && (
            <g>
              <line x1={30} y1="272" x2={30 + 10 * k} y2="272" stroke={C.text} strokeWidth="2" opacity="0.7" />
              <text x={30 + 5 * k} y="288" textAnchor="middle" fill={C.dim} fontSize="9" fontFamily="var(--mono)">10 km</text>
            </g>
          )}
          {/* 1 km reference circle */}
          {0.5 * k >= 1.5 && (
            <g>
              <circle cx="395" cy="255" r={0.5 * k} fill="none" stroke={C.green} strokeWidth="1" strokeDasharray="2 2" />
              <text x="395" y={262 + 0.5 * k + 10} textAnchor="middle" fill={C.green} fontSize="8.5" fontFamily="var(--mono)">1 km</text>
            </g>
          )}
        </svg>
      </div>
      {/* ---- edge-on view: the same four knobs, seen from the side ---- */}
      <div style={{ marginTop: 12 }}>
        <div className="statL" style={{ marginBottom: 5 }}>Edge-on — the same beam, seen from the side</div>
        {(() => {
          const VW = 880, VH = 250;
          const satY = 34, gndY = 214;                     // altitude maps to this vertical run
          const EXAG = 26;                                 // horizontal exaggeration (angle is ~0.8°, invisible true-scale)
          const pxPerKmH = ((gndY - satY) / h) * EXAG;     // horizontal km → px, exaggerated
          const halfSpot = Math.max(1.5, (nadirKm / 2) * pxPerKmH);
          const cx = VW * 0.30;
          const apHalf = Math.max(7, (D / 1000) * pxPerKmH * 40); // aperture, further exaggerated to be visible
          const slantX = be < 90 ? (gndY - satY) / Math.tan((be * Math.PI) / 180) * (pxPerKmH / (((gndY - satY) / h))) / h * h : 0;
          const gx = cx + Math.min(slantX, VW * 0.55);
          const halfAcross = Math.max(1.5, (across / 2) * pxPerKmH);

              </text>

              <polygon points={`${cx},${satY + 8} ${gx - halfAcross},${gndY} ${gx + halfAcross},${gndY}`}

              <line x1={cx} y1={satY + 8} x2={gx} y2={gndY} stroke="#C79BFF" strokeOpacity="0.5" strokeDasharray="2 3" strokeWidth="1" />

                aperture D = {D.toFixed(1)} m
              </text>
              {/* the angle */}
              <path d={`M ${cx} ${satY + 46} A 46 46 0 0 1 ${cx + Math.min(halfAcross * 0.42, 40)} ${satY + 46}`}
                fill="none" stroke={C.amber} strokeWidth="1.4" />
              <text x={cx + 54} y={satY + 52} fill={C.amber} fontSize="11" fontFamily="var(--mono)">

              </text>
              {/* spot on the ground */}
              <line x1={gx - halfAcross} y1={gndY} x2={gx + halfAcross} y2={gndY} stroke="#C79BFF" strokeWidth="4" />
              <text x={gx} y={gndY + 30} textAnchor="middle" fill="#C79BFF" fontSize="11" fontFamily="var(--mono)">
                {be >= 89.5 ? nadirKm.toFixed(2) + " km spot" : across.toFixed(1) + " km across · " + along.toFixed(1) + " km along"}
              </text>
              {/* wavelength inset — what λ/D actually means */}
              <g transform={`translate(${VW - 250}, 24)`}>
                <rect x="0" y="0" width="230" height="88" rx="6" fill={C.panel} stroke={C.line} strokeWidth="1" />
                <text x="12" y="17" fill={C.dim} fontSize="9" fontFamily="var(--mono)">WHY λ/D — THE DIFFRACTION RATIO</text>
                <line x1="12" y1="46" x2={12 + 190} y2="46" stroke={C.text} strokeWidth="2.5" />
                <text x={12 + 95} y="60" textAnchor="middle" fill={C.text} fontSize="9" fontFamily="var(--mono)">panel D = {D.toFixed(1)} m</text>
                {(() => { const wpx = Math.max(3, (lam / D) * 190); return (

                    <text x={12 + wpx + 6} y="37" fill={C.amber} fontSize="9" fontFamily="var(--mono)">λ = {(lam * 100).toFixed(1)} cm</text>
                  </g>); })()}
                <text x="12" y="79" fill={C.dim} fontSize="9" fontFamily="var(--mono)">
                  {(D / lam).toFixed(0)} wavelengths across → beam {(th * 1000).toFixed(1)} mrad wide
                </text>
              </g>
              <text x={VW - 24} y={VH - 8} textAnchor="end" fill={C.dim} fontSize="9" fontFamily="var(--mono)">
                horizontal scale exaggerated ×{EXAG} — at true scale this cone is {(nadirKm / h * 100).toFixed(2)}% as wide as it is tall
              </text>
            </svg>
          );
        })()}
      </div>
      <p className="body" style={{ fontSize: 12, color: C.dim, marginTop: 10 }}>
        Model: beamwidth ≈ λ/D — this k = 1 convention applies to the per-beam aperture; the site-wide canonical (v92) is 8.9 km ⌀ at nadir for 2027 — the bracket center (floor 4.4 full-aperture · upper 19.9 Gen1-panels) — used identically by the budget card, the Stitching panel, and Serviceability (half-power conventions vary by taper; treat sizes as ±30% estimates); spot at elevation ε
        widens by the longer slant (h/sin ε) and stretches 1/sin ε along the look direction; scan loss not included. Preset
        notes: today's payload is ~25 m² in four panels — beams form on 1–2 panels (2.5–3.5 m side, per the FCC gain ladder); 2027 ≈ 5× → ~125 m², per-beam ~31 m² if panelization scales (5.6 m side); AST Block 2 ≈ 223 m²
        — click its two presets back-to-back: the identical panel paints ~12 km spots on 850 MHz partner low-band but
        ~5 km at 2 GHz. The panel is real; the wavelength decides what it buys — spectrum choice is silently a beam-size
        choice. The purple readout is the punchline: sub-km cells at phone frequencies demand a
        ~50 m panel (~2,500 m²) — an order of magnitude beyond anything flying or announced, which is why every D2C player
        converges on kilometers-wide cells and why femtocells, not satellites, own street-level capacity.
      </p>
      <Info label="the receipts — where the beam bracket comes from, and how to argue with it">
        <BeamReceipts />
      </Info>
      <Info label="walk me through the four knobs">
        Think of the antenna as a flashlight lens. <strong>Bigger lens, tighter beam:</strong> a radio antenna can only
        focus energy into a cone about as narrow as (wavelength ÷ its own width) — physics' non-negotiable exchange rate.
        Double the panel, halve the beam. <strong>Higher frequency, tighter beam:</strong> shorter waves focus better
        through the same lens — which cuts both ways: AST's enormous 223 m² panel makes tight beams on 2 GHz, but when it
        serves a partner's 850 MHz low-band the wavelength more than doubles and the beams balloon back out. Spectrum
        choice is silently a beam-size choice. <strong>Lower altitude, smaller spot:</strong> the beam is a cone; catch it
        closer to the apex and the circle is smaller — one of the reasons the 2027 fleet drops to ~330 km.
        <strong> Steeper look, rounder spot:</strong> Panel 1's ellipse story — off-nadir, the cone travels farther and
        lands obliquely. Multiply the four together and you get the punchline number: at 2 GHz from 330 km, 1-km cells
        need a ~50-meter antenna. That's not an engineering challenge, it's a different class of spacecraft — so the
        entire industry's cells bottom out at kilometers, and the last mile of capacity density belongs to the ground.
      </Info>
    </div>
  );
}

function BeamMap() {
  const [playing, setPlaying] = useState(true);
  const [beams, setBeams] = useState(24);
  const [reuse, setReuse] = useState("reuse3");
  const [view, setView] = useState("beams");
  const [t, setT] = useState(0);
  const [active, setActive] = useState([]);

  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setT((x) => x + 120), 120);
    return () => clearInterval(id);
  }, [playing]);

  const cols = 30, rows = 11, dx = 28, dy = 27, x0 = 34, y0 = 90;
  const cells = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      cells.push({ id: r * cols + c, x: x0 + c * dx + (r % 2 ? dx / 2 : 0), y: y0 + r * dy, f: (c + 2 * r) % 3 });
  const W = 900, H = 440, cy = y0 + ((rows - 1) * dy) / 2;
  const period = 24000, span = 1250, R = 218;
  const satX = (off) => -170 + (((t + off) % period) / period) * span;
  const sats = [
    { id: "SAT-A", x: satX(0) },
    { id: "SAT-B", x: satX(period / 3) },
    { id: "SAT-C", x: satX((2 * period) / 3) },
  ];
  const hot = [{ x: x0 + 6 * dx, y: y0 + 3 * dy }, { x: x0 + 15 * dx, y: y0 + 7 * dy }, { x: x0 + 23 * dx, y: y0 + 4 * dy }];
  const isHot = (cl) => hot.some((h) => Math.hypot(cl.x - h.x, cl.y - h.y) < 58);
  const inFootOf = (cl) => sats.filter((s) => Math.hypot(cl.x - s.x, cl.y - cy) < R);

  const slot = Math.floor(t / 480);
  useEffect(() => {
    const inFoot = cells.filter((cl) => inFootOf(cl).length > 0);
    if (inFoot.length === 0) { setActive([]); return; }
    const pool = [];
    inFoot.forEach((cl) => { pool.push(cl); if (isHot(cl)) { pool.push(cl); pool.push(cl); pool.push(cl); } });
    const rand = mulberry(slot * 7919 + beams);
    const chosen = new Set();
    let guard = 0;
    while (chosen.size < Math.min(beams, inFoot.length) && guard++ < 2000)
      chosen.add(pool[Math.floor(rand() * pool.length)].id);
    setActive([...chosen]);
    // eslint-disable-next-line
  }, [slot, beams, reuse]);

  const FCOLORS = [C.amber, C.blue, "#C79BFF"];
  const SATC = ["#6BDB8F", "#4DD0E1", "#FF9ECF"];
  const servingOf = (cl) => {
    const f = inFootOf(cl);
    if (!f.length) return -1;
    const s = [...f].sort((a, b) => Math.hypot(cl.x - a.x, cl.y - cy) - Math.hypot(cl.x - b.x, cl.y - cy))[0];
    return sats.indexOf(s);
  };
  const phoneCell = cells[5 * cols + 12];
  const phoneSats = inFootOf(phoneCell).sort((a, b) => Math.hypot(phoneCell.x - a.x, phoneCell.y - cy) - Math.hypot(phoneCell.x - b.x, phoneCell.y - cy));
  const serving = phoneSats[0];

  return (
    <div className="card" style={{ borderTop: `2px solid ${C.amber}` }}>
      <div className="eyebrow" style={{ color: C.amber }}>Panel 2 · Earth-fixed cells, hopping beams, frequency reuse — the animation <Src k="nextgen" topic="nextgen" /></div>
      <p className="body" style={{ marginBottom: 10 }}>
        The grid never moves: those are <strong>Earth-fixed cells</strong>, virtual towers nailed to geography. Satellites
        sweep across at 7.5 km/s (a ~3-minute pass, compressed), and the constellation is sized so footprints
        <em> always overlap</em> — no cell is ever outside every footprint. Two views of the same system:
        <strong> Beam activity</strong> shows illumination — where beams are dwelling <em>right now</em> (for user data,
        broadcast, or paging alike; lit ≠ specifically paging), which is inherently intermittent because an unlit cell is
        just <em>between visits</em>. <strong>Coverage assignment</strong> shows the other truth: every covered cell's
        <em> border</em> is colored by the satellite responsible for it at this instant — continuous and gapless even
        while illumination hops, with handoffs visible as a border-color wave sweeping the static grid. Watch the marked
        📱 cell in either view: served without interruption, no phone-side handoff.
      </p>
      <div className="tglRow" style={{ marginBottom: 8, alignItems: "center" }}>
        <button className="genBtn on" onClick={() => setPlaying(!playing)}>{playing ? "⏸ pause" : "▶ play"}</button>
        <button className={"genBtn" + (view === "beams" ? " on" : "")} onClick={() => setView("beams")}>Beam activity view</button>
        <button className={"genBtn" + (view === "coverage" ? " on" : "")} onClick={() => setView("coverage")}>Coverage-assignment view</button>
        <button className={"genBtn" + (reuse === "reuse3" ? " on" : "")} onClick={() => setReuse("reuse3")}>Reuse-3</button>
        <button className={"genBtn" + (reuse === "reuse1" ? " on" : "")} onClick={() => setReuse("reuse1")}>Reuse-1</button>
        <label className="sliderL" style={{ flex: 1, minWidth: 200, fontSize: 12 }}>
          Beams in this window: <strong>{beams}</strong> <span style={{ color: C.dim }}>(scale model — the grid is a small window of a real footprint; the 2027 satellite runs ~hundreds of beams over thousands of positions, 16× Gen1)</span>
          <input type="range" min="8" max="64" value={beams} onChange={(e) => setBeams(+e.target.value)} />
        </label>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block" }} role="img" aria-label="Animated map of Earth-fixed cells served by hopping satellite beams">
        {/* satellites + footprints */}
        {sats.map((s) => (
          <g key={s.id}>
            <circle cx={s.x} cy={cy} r={R} fill="none" stroke={C.line} strokeDasharray="4 5" />
            <g transform={`translate(${s.x}, 34)`}>
              <rect x="-10" y="-6" width="20" height="12" fill={C.amber} rx="2" />
              <rect x="-30" y="-3" width="16" height="6" fill="none" stroke={C.amber} strokeWidth="1" />
              <rect x="14" y="-3" width="16" height="6" fill="none" stroke={C.amber} strokeWidth="1" />
              <text x="0" y="-14" textAnchor="middle" fill={C.dim} fontSize="10" fontFamily="var(--mono)">{s.id}</text>
            </g>
            <line x1={s.x} y1="46" x2={s.x} y2={cy - R} stroke={C.line} strokeWidth="1" />
          </g>
        ))}
        <text x="12" y="20" fill={C.dim} fontSize="10" fontFamily="var(--mono)">→ satellites sweep at 7.5 km/s · pass ≈ 3 min (compressed)</text>
        <text x={W - 12} y={H - 10} textAnchor="end" fill={C.dim} fontSize="10" fontFamily="var(--mono)">EARTH-FIXED CELL GRID (static)</text>
        {/* towns */}
        {hot.map((h, i) => (
          <text key={i} x={h.x} y={h.y - 20} textAnchor="middle" fill={C.green} fontSize="13">⌂</text>
        ))}
        {/* cells */}
        {cells.map((cl) => {
          const on = active.includes(cl.id);
          const sIdx = servingOf(cl);
          const inF = sIdx >= 0;
          const col = reuse === "reuse3" ? FCOLORS[cl.f] : C.amber;
          if (view === "coverage") {
            return (
              <circle key={cl.id} cx={cl.x} cy={cl.y} r={9}
                fill={inF ? col : "transparent"} fillOpacity={inF ? 0.16 : 0}
                stroke={inF ? SATC[sIdx] : C.line} strokeWidth={inF ? 1.8 : 0.7}
                strokeOpacity={inF ? 1 : 0.35} />
            );
          }
          return (
            <circle key={cl.id} cx={cl.x} cy={cl.y} r={on ? 11 : 8}
              fill={on ? col : "transparent"} fillOpacity={on ? 0.55 : 0}
              stroke={on ? col : inF ? C.dim : C.line} strokeWidth={on ? 1.5 : 0.7}
              strokeOpacity={on ? 1 : inF ? 0.7 : 0.35} />
          );
        })}
        {/* phone cell */}
        <text x={phoneCell.x} y={phoneCell.y - 16} textAnchor="middle" fontSize="12">📱</text>
        <circle cx={phoneCell.x} cy={phoneCell.y} r="14" fill="none" stroke={C.green} strokeWidth="1.2" />
        <text x={phoneCell.x} y={phoneCell.y + 32} textAnchor="middle" fill={C.green} fontSize="9.5" fontFamily="var(--mono)">
          {serving ? `cell #162 ← ${serving.id}` : "cell #162: awaiting next satellite"}
        </text>
      </svg>
      <div className="tglRow" style={{ marginTop: 8, alignItems: "center", gap: 16 }}>
        {view === "coverage" && (
          <>
            <span className="legendF"><i style={{ background: "transparent", border: `2px solid ${SATC[0]}` }} /> SAT-A serves</span>
            <span className="legendF"><i style={{ background: "transparent", border: `2px solid ${SATC[1]}` }} /> SAT-B serves</span>
            <span className="legendF"><i style={{ background: "transparent", border: `2px solid ${SATC[2]}` }} /> SAT-C serves</span>
            <span style={{ fontSize: 12, color: C.dim }}>Border = the satellite currently responsible for the cell (continuous, gapless); interior tint = the cell's frequency channel. Beam activity is deliberately hidden in this view — flip back to see illumination hopping within these assignments.</span>
          </>
        )}
        {view === "beams" && (reuse === "reuse3" ? (
          <>
            <span className="legendF"><i style={{ background: FCOLORS[0] }} /> F1</span>
            <span className="legendF"><i style={{ background: FCOLORS[1] }} /> F2</span>
            <span className="legendF"><i style={{ background: FCOLORS[2] }} /> F3</span>
            <span style={{ fontSize: 12, color: C.dim }}>Classic reuse-3: neighboring cells use different channels (~⅓ of the DL MHz each), buying interference isolation with spectrum — 1980s cellular planning, recomputed every few seconds from orbit.</span>
          </>
        ) : (
          <span style={{ fontSize: 12, color: C.red }}>Reuse-1: every beam uses the full DL allocation. Maximum capacity per beam — but only beams with enough spatial separation can be co-scheduled, or they jam each other. The scheduler must keep same-channel beams apart; with 16× more, smaller beams (2027 hardware), isolation improves and reuse-1 gets more viable.</span>
        ))}
      </div>
      <Info label="what exactly is an Earth-fixed cell? (the core trick, slowly)">
        In a normal network your phone talks to a tower that never moves; the "cell" is just that tower's neighborhood.
        Starlink's towers move at 27,000 km/h — so instead of letting cells follow satellites, the network defines a map
        of virtual cells <em>glued to the ground</em>, each with a permanent identity, like postal codes. A satellite
        passing overhead is assigned to "be" cell #162 for the few minutes it can see it: it steers a beam to hold that
        exact patch of ground, continuously adjusting as it flies. Before it loses the angle, the network — which knows
        every satellite's position seconds and minutes into the future — orders the next satellite to take over the same
        cell: same identity, same frequency, seamlessly. Your phone, which only knows "I'm connected to cell #162," never
        notices anything happened. All the motion, all the handoffs, all the complexity is hidden on the space side of the
        link. It's a relay race where the baton is a cell tower and the runners are invisible.
      </Info>
      <Info label="if my cell is dark right now, how does a call reach me?">
        Phones don't listen continuously — that would drain the battery in hours. An idle phone sleeps and wakes only at
        scheduled instants (every 1.28 or 2.56 seconds in LTE, and NTN allows much longer) to check for a "page": the
        network's knock announcing an incoming call or text. This is called DRX — discontinuous reception. And the
        coincidence isn't luck — it's a <strong>shared appointment calendar</strong>: when a phone camps on a cell it reads
        the cell's broadcast paging configuration, then both sides run the same formula — the phone's identity number,
        hashed against the paging cycle, yields the exact instants <em>this specific phone</em> will listen. The network
        knows every camped phone's appointments and queues pages for them; the hashing also spreads millions of phones
        across different instants so paging never bottlenecks on one moment. The satellite's beam-hopping schedule is then
        built around that calendar: a beam revisits each cell so it's present at the appointments of the phones camped
        there. So a cell that looks dark 80% of the time still delivers every incoming call — the 20% of illumination is
        aimed at exactly the instants that matter, and pages repeat across a few occasions so one missed dwell costs
        latency, not the call. (Active data sessions are different: those cells get dwell time proportional to demand,
        which is what the ⌂ town weighting shows.)
      </Info>
      <Info label="frequency reuse, for people who don't plan cell networks">
        SpaceX owns a limited slice of radio spectrum — think of it as three lanes of highway. Two beams pointed at
        neighboring patches of ground can't both shout on the same lane at full power: phones near the border would hear
        both and understand neither. Solution one (reuse-3): assign neighbors different lanes — F1, F2, F3 in a repeating
        pattern — so no two adjacent cells share one. Cost: each cell only gets a third of the total spectrum. Solution
        two (reuse-1): give every beam all three lanes and rely on <em>distance</em> — physically separate same-lane
        beams far enough that they can't hear each other. That's maximum capacity but a hard scheduling puzzle. The 2027
        satellites' smaller, more numerous beams make the distance trick work better (tighter beams bleed less energy
        sideways), which is one of the quiet reasons beam-shrinking multiplies capacity by more than the beam count alone.
      </Info>
      <Info label="aren't low-elevation beams stretched into ellipses? (yes)">
        The circles in this animation are <em>cells</em>, not beam projections — and real beam projections at low elevation
        are indeed ellipses, significantly so. A conical beam hitting the ground at 25° elevation smears along the look
        direction by roughly 1/sin(25°) ≈ 2.4×, and the slant distance at that angle is about double the straight-down
        distance, widening the beam in both axes before the stretch — so an edge-of-footprint beam can paint ~2× wider and
        ~5× longer than the same beam at nadir. Phased arrays make it worse at the edges, not better: steering far
        off-center shrinks the antenna's effective area (you're seeing the panel edge-on — "scan loss"), widening the beam
        and costing signal exactly where the path is already longest. Beam shaping can partially compensate; geometry
        always wins. The system's real answers: <strong>prefer steep looks</strong> — with overlapping footprints, the
        scheduler hands each cell to whichever satellite sees it most steeply (one more quiet reason to overbuild past 1×
        coverage); <strong>decouple cells from beams</strong> — the Earth-fixed cell stays a neat fixed patch, and an
        oversized elliptical beam merely has to cover it, wasting some energy and leaking more interference but keeping
        the phone's world clean; and <strong>accept degraded edges</strong> — edge-of-footprint service is genuinely
        worse, which is why minimum elevation is the master variable of this whole architecture (Panel 1).
      </Info>
    </div>
  );
}

        neighbors' beams barely spill onto each other, so there's no interference to manage: every cell can use the entire
        20 MHz downlink channel at once (the three stacked color stripes — the "full menu"). Now walk away from nadir. From your
        new position the satellite hangs lower in the sky; its beam reaches you along a longer slanted path and smears into
        a stretched ellipse (drag the slider and watch the patches widen). Smeared beams slop energy onto their neighbors,
        so cells out here can't all shout on the same frequencies — the network rations: adjacent cells split the downlink
        channel (single stripes, alternating colors) so each one's slice stays clean, at the cost of only a third of it.

        each beam's volume up or down depending on how close its channel-mates are. And because footprints overlap, the
        network's simplest trick is the best one: hand every cell to whichever satellite is most nearly overhead — keeping

function SawtoothPanel() {
  const [fleet, setFleet] = useState(650);
  const [pool, setPool] = useState(20);
  const mask = 30, alt = 330;
  // coverage multiplicity: satellites simultaneously visible above mask, calibrated via cap geometry
  const capf = (1 - Math.cos(Math.acos((6371 / (6371 + alt)) * Math.cos((mask * Math.PI) / 180)) - (mask * Math.PI) / 180)) / 2;
  const kVis = Math.max((fleet * capf) / 3.3 * 3.3, fleet * capf); // expected sats in view ≈ N × cap fraction
  // simulate passes: each pass rises mask→peak→mask over PD steps; serving elevation = max over active passes
  const STEPS = 240, PD = 60;
  const rand = mulberry(fleet * 31 + pool * 7);
  const passes = [];
  const spawnP = kVis / PD; // expected concurrent ≈ kVis
  for (let t = -PD; t < STEPS; t++) {
    let n = 0;
    if (spawnP >= 1) { n = Math.floor(spawnP); if (rand() < spawnP - n) n++; }
    else if (rand() < spawnP) n = 1;
    for (let j = 0; j < n; j++) passes.push({ t0: t, pk: mask + (90 - mask) * Math.sqrt(rand()) });
  }
  const elev = [], thr = [];
  const regime = (e) => (e >= 60 ? 1 : e >= 42 ? 2 : 3);
  for (let t = 0; t < STEPS; t++) {
    let best = 0;
    for (const p of passes) {
      const dt = t - p.t0;
      if (dt < 0 || dt > PD) continue;
      const frac = 1 - Math.abs(dt - PD / 2) / (PD / 2);
      const e = mask + (p.pk - mask) * frac;
      if (e > best) best = e;
    }
    elev.push(best);
    if (best < mask) { thr.push(0); continue; }
    const r = regime(best);
    const mhz = r === 1 ? pool : r === 2 ? (pool * 2) / 3 : pool / 3;
    thr.push(mhz * 2.48 * Math.sin((best * Math.PI) / 180));
  }
  const valid = thr.filter((x) => x > 0);
  const mean = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : 0;
  const sorted = [...thr].sort((a, b) => a - b);
  const p10 = sorted[Math.floor(STEPS * 0.1)], p90 = sorted[Math.floor(STEPS * 0.9)];
  const outage = (thr.filter((x) => x === 0).length / STEPS) * 100;
  const r1pct = (elev.filter((e) => e >= 60).length / STEPS) * 100;
  const maxT = pool * 2.48;
  const X = (t) => 40 + (t / STEPS) * 830;
  const Ye = (e) => 120 - ((e - 0) / 90) * 95;
  const Yt = (v) => 285 - (v / maxT) * 120;
  const line = (arr, Y) => arr.map((v, t) => `${t === 0 ? "M" : "L"} ${X(t).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
  return (
    <div className="card" style={{ borderTop: `2px solid ${C.red}` }}>
      <div className="eyebrow" style={{ color: C.red }}>Panel 5 · The elevation sawtooth — throughput variance vs fleet size <Src k="measured" topic="derived" /></div>
      <p className="body" style={{ marginBottom: 10 }}>
        Your serving satellite isn't a constant — it rises from the mask, peaks, and recedes, replaced by the next. With a
        sparse fleet, the <em>best</em> satellite in your sky sometimes peaks barely above the mask, and throughput
        sawtooths violently between full-menu overhead moments and rationed low-angle troughs. Saturate the sky and the
        max over many visible satellites never drops far: the sawtooth flattens into a ripple. Drag the fleet slider and
        watch <strong>variance</strong>, not just the average — variance is what a phone call actually experiences.
      </p>
      <div className="tglRow" style={{ marginBottom: 8, alignItems: "center" }}>
        <button className={"genBtn" + (pool === 20 ? " on" : "")} onClick={() => setPool(20)}>20 MHz DL · n252 today</button>
        <button className={"genBtn" + (pool === 25 ? " on" : "")} onClick={() => setPool(25)}>25 MHz · + H-block (future)</button>
        <label className="sliderL" style={{ flex: 1, minWidth: 220, fontSize: 12 }}>
          Fleet size: <strong>{fleet.toLocaleString()}</strong> satellites (~{kVis.toFixed(1)} typically in view above {mask}°)
          <input type="range" min="650" max="15000" step="50" value={fleet} onChange={(e) => setFleet(+e.target.value)} />
        </label>
      </div>
      <svg viewBox="0 0 900 320" style={{ width: "100%", display: "block" }} role="img" aria-label="Serving satellite elevation and per-cell throughput over time for the selected fleet size">
        <text x="40" y="16" fill={C.dim} fontSize="9.5" fontFamily="var(--mono)">SERVING SATELLITE ELEVATION (best in view)</text>
        <line x1="40" y1={Ye(mask)} x2="870" y2={Ye(mask)} stroke={C.red} strokeWidth="0.8" strokeDasharray="4 4" />
        <text x="874" y={Ye(mask) + 3} fill={C.red} fontSize="8.5" fontFamily="var(--mono)">mask {mask}°</text>
        {[30, 60, 90].map((e) => (
          <text key={e} x="34" y={Ye(e) + 3} textAnchor="end" fill={C.dim} fontSize="8.5" fontFamily="var(--mono)">{e}°</text>
        ))}

        {[0, 0.5, 1].map((f2) => (

      </svg>
      <div className="statGrid" style={{ marginTop: 10 }}>
        <div className="stat"><div className="statL">Mean per-cell DL</div><div className="statV">~{mean.toFixed(0)} Mbps</div></div>
        <div className="stat"><div className="statL">p10 – p90 swing</div><div className="statV" style={{ color: C.amber }}>{p10.toFixed(0)} – {p90.toFixed(0)} Mbps {mean > 0 ? `(±${(((p90 - p10) / 2 / mean) * 100).toFixed(0)}%)` : ""}</div></div>
        <div className="stat"><div className="statL">Time in reuse-1 (≥60°)</div><div className="statV" style={{ color: C.green }}>{r1pct.toFixed(0)}%</div></div>
        <div className="stat"><div className="statL">Coverage gaps (no sat ≥{mask}°)</div><div className="statV" style={{ color: outage > 0.5 ? C.red : C.dim }}>{outage.toFixed(1)}% of time</div></div>
      </div>
      <Info label="how to read these two charts">
        The green trace is the elevation (in degrees, left axis) of the <em>best</em> satellite in your sky. Each hump is
        one satellite's pass — rising from the 30° mask, peaking, receding — and the kinks are <strong>handovers</strong>:
        the instant a rising satellite overtakes the receding one as your best option. The amber trace is that elevation
        pushed through Panel 3's throughput model, and its jagged shape is the real lesson: it is <em>not</em> a smooth
        copy of the green line, because frequency reuse is a <strong>staircase</strong>. When your best satellite crosses
        60°, your cell snaps from ~⅔ to the full spectrum menu (the flat plateaus hugging the ceiling are reuse-1
        stretches); when it sinks through ~42°, you snap down to one lane of three (the deep square troughs); within each
        stair, the gentle slope is the sin ε link penalty. So: cliffs = reuse thresholds, slopes = geometry, flat tops =
        the spectrum ceiling, zero-drops = moments with no satellite above the mask at all. Now drag the fleet slider up
        and watch the staircase collapse into a plateau — with many satellites in view, the best one is almost always
        above 60°, so the network lives in reuse-1, the troughs vanish, and the p10–p90 swing collapses. Same spectrum,
        same satellites, same physics: consistency is purely a fleet-count product.
      </Info>
      <p className="body" style={{ fontSize: 12, color: C.dim, marginTop: 10 }}>
        Model (derived, schematic): satellites-in-view ≈ fleet × visible-cap fraction at 330 km; passes rise
        mask → random peak → mask; the phone is served by the highest satellite in view; throughput uses Panel 3's exact
        anchors and reuse thresholds. Real constellations phase their planes to smooth this further — treat the shapes and
        the variance trend as the point, not the exact Mbps. The strategic reading: fleet growth's least-advertised
        product is <em>consistency</em> — the same slider that adds capacity is quietly deleting the troughs.
      </p>
    </div>
  );
