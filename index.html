/* Spectral efficiency anchors (Mbps per MHz):
   SAT DL gen1 0.62 = UPM measurement (≈ FCC's 9-yr 600 kbps/MHz/beam DL milestone);
   SAT DL v2 2.48 = company-claimed 4× bandwidth-per-beam uplift (claim);
   SAT UL gen1 0.10 = FCC 2-yr milestone floor; v2 0.30 = 9-yr milestone / claims;
   TERR: user-set 2–6 bps/Hz small-cell efficiency. */
const SAT_EFF = { gen1: { dl: 0.62, ul: 0.10 }, v2: { dl: 2.48, ul: 0.30 } };

function calcZones(cfg, year = 2032) {
  const inSat = (a) => a === "sat" || a === "split";
  const inTerr = (a) => a === "terr" || a === "split";
  let satDL = 0, satUL = 0, terrDL = 0, terrUL = 0, leasedDL = 0, leasedUL = 0;
  const gates = [];
  for (const b of BLOCKS) {
    const a = cfg[b.id];
    if (inSat(a)) {
      // a4main in sat mode contributes UL only (n252 uplink); its DL twin is a4dl
      const hULStranded = b.id === "h" && year < 2029;
      satUL += b.id === "a4main" ? 20 : hULStranded ? 0 : b.ulMHz;
      satDL += b.id === "a4main" ? 0 : b.dlMHz;
      if (hULStranded) gates.push("H-block satellite = DL-only (5 MHz): the 1915\u20131920 uplink is stranded \u2014 no handset band covers it; needs new standards + phone RF (~2029+ at best)");
      if (b.id === "g") { leasedDL += b.dlMHz; leasedUL += b.ulMHz; }
      if (b.satGate) gates.push(`${b.label}: ${b.satGate}`);
    }
    if (inTerr(a)) {
      // a4main in terr mode contributes DL only (n70 downlink)
      terrDL += b.id === "a4main" ? 20 : b.dlMHz;
      terrUL += b.id === "a4main" ? 0 : b.ulMHz;
    }
  }
  const eff = SAT_EFF[cfg.gen];
  return {
    satDLMHz: satDL, satULMHz: satUL, terrDLMHz: terrDL, terrULMHz: terrUL,
    leasedDL, leasedUL, ownedDL: satDL - leasedDL, ownedUL: satUL - leasedUL,
    satDLMbps: satDL * eff.dl, satULMbps: satUL * eff.ul,
    terrDLMbps: terrDL * cfg.terrEff, terrULMbps: terrUL * cfg.terrEff * 0.6,
    gates,
    boundary: cfg.a4main === "split",
  };
}

function feasibility(cfg) {
  const satU = (a) => a === "sat" || a === "split";
  const terrU = (a) => a === "terr" || a === "split";
  const gates = [];
  let year = 2026;
  const need = (y, t) => { gates.push({ y, t }); if (y > year) year = y; };
  if (["aws3", "h", "a4main", "a4dl"].some((id) => cfg[id] !== "off"))
    need(2027, "EchoStar deal consummation (deadline Nov 2027)");
  if (cfg.g !== "off")
    gates.push({ y: 2026, t: "G-block MANUALLY INCLUDED: T-Mobile spectrum under a revocable SCS lease — partner-channel capacity serving T-Mobile service, NOT fourth-carrier capacity; excluded from every default scenario" });
  if (satU(cfg.a4main) || satU(cfg.a4dl))
    need(2027, "n252 from orbit: 2027 satellites + first Rel-19/X105-class handsets (handset volume ~2028\u201329)");
  if (satU(cfg.h))
    need(2027, "H-block from orbit: via SCS adapted-LTE once the D2C application grants (~2027); full NR-NTN needs a 3GPP band work item nobody has filed (~2029+ if championed)");
  if (satU(cfg.aws3))
    need(2029, "AWS-3 supplemental UL from orbit: 3GPP NTN + FCC Earth-to-space treatment — the furthest-out gate");
  if (["aws3", "h", "a4main", "a4dl"].some((id) => terrU(cfg[id])))
    need(2028, "Femtocell/terrestrial layer at meaningful scale (service from ~late 2027)");
  if (cfg.gen === "v2")
    need(2027, "Dedicated D2C satellites flying at scale (launches from mid-2027)");
  gates.sort((a, b) => a.y - b.y);
  return { year, gates };
}

function clampCfgToYear(cfg, year) {
  const c = { ...cfg };
  const changes = [];
  const chg = (id, from, to, why) => { c[id] = to; changes.push(`${id === "a4main" ? "2000\u20132020" : id === "a4dl" ? "2180\u20132200" : id.toUpperCase()}: ${from.toUpperCase()} \u2192 ${to.toUpperCase()} — ${why}`); };
  const ownedIds = ["aws3", "h", "a4main", "a4dl"];
  for (const id of ownedIds) {
    if (cfg[id] !== "off" && year < 2027) { chg(id, cfg[id], "off", "owned spectrum unusable before deal consummation (2027)"); continue; }
    const a = c[id];
    const satOK = id === "aws3" ? year >= 2029 : year >= 2027;
    const terrOK = year >= 2028;
    if (a === "sat" && !satOK) chg(id, a, terrOK && id !== "a4dl" ? "terr" : "off", id === "aws3" ? "satellite SUL opens ~2029 (3GPP + FCC)" : "satellite path opens ~2027");
    else if (a === "terr" && !terrOK) chg(id, a, "off", "femtocell layer at scale from ~2028");
    else if (a === "split") {
      if (!satOK && terrOK) chg(id, a, "terr", "satellite half not yet available");
      else if (satOK && !terrOK) chg(id, a, "sat", "terrestrial half not yet at scale (~2028)");
      else if (!satOK && !terrOK) chg(id, a, "off", "neither mode available yet");
    }
  }
  if (cfg.gen === "v2" && year < 2027) { c.gen = "gen1"; changes.push("Satellites: V2 \u2192 Gen1 — dedicated D2C satellites fly from mid-2027"); }
  return { cfg: c, changes };
}

          <strong> TERR</strong> assigns it to rooftop femtocells (serving dense neighborhoods), <strong>SPLIT</strong> does

          debate — try "everything satellite" vs "urban split" and watch the trade: MHz given to femtocells multiply speeds

/* ------------------------- TRAJECTORY ------------------------- */

function Trajectory({ phase, setPhase }) {
  const W = 900, H = 190;
  const pathD = `M 40 ${H - 34} C ${W * 0.3} ${H - 40}, ${W * 0.55} 66, ${W - 40} 38`;
  const pts = PHASES.map((p) => {
    const t = 0.08 + p.orbit * 0.9;
    const x0 = 40, y0 = H - 34, x1 = W * 0.3, y1 = H - 40, x2 = W * 0.55, y2 = 66, x3 = W - 40, y3 = 38;
    const mt = 1 - t;
    const x = mt*mt*mt*x0 + 3*mt*mt*t*x1 + 3*mt*t*t*x2 + t*t*t*x3;
    const y = mt*mt*mt*y0 + 3*mt*mt*t*y1 + 3*mt*t*t*y2 + t*t*t*y3;
    return { x, y };
  });
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block" }} role="img"
      aria-label="Trajectory from today's texting service to a scaled carrier">
      <line x1="0" y1={H - 18} x2={W} y2={H - 18} stroke={C.line} strokeWidth="1" />
      <text x="42" y={H - 4} fill={C.dim} fontSize="10" fontFamily="var(--mono)" letterSpacing="0.1em">GROUND · AUG 2026</text>
      <text x={W - 42} y="22" fill={C.dim} fontSize="10" fontFamily="var(--mono)" letterSpacing="0.1em" textAnchor="end">SCALED SERVICE · 2030+</text>
      <path d={pathD} fill="none" stroke={C.line} strokeWidth="1.5" strokeDasharray="1 5" />
      <path d={pathD} fill="none" stroke={C.amber} strokeWidth="2"
        strokeDasharray="1200" strokeDashoffset={1200 - (200 + PHASES[phase].orbit * 1000)}
        style={{ transition: "stroke-dashoffset 700ms cubic-bezier(.4,0,.2,1)" }} opacity="0.85" />
      {pts.map((pt, i) => (
        <g key={i} onClick={() => setPhase(i)} style={{ cursor: "pointer" }}>
          <circle cx={pt.x} cy={pt.y} r="16" fill="transparent" />
          <circle cx={pt.x} cy={pt.y} r={i === phase ? 7 : 4.5}
            fill={i === phase ? C.amber : C.panel}
            stroke={i <= phase ? C.amber : C.dim} strokeWidth="1.5"
            style={{ transition: "all 300ms" }} />
          <text x={pt.x} y={pt.y - 14} textAnchor="middle" fill={i === phase ? C.text : C.dim}
            fontSize="10" fontFamily="var(--mono)" letterSpacing="0.08em">P{i}</text>
        </g>
      ))}
    </svg>
  );
}

        originally defined for satellites, with phones <em>talking up</em> to space on it. Dish Network later won permission
        to flip it — using the same lane terrestrially with towers <em>talking down</em> to phones. SpaceX bought both
        rights. So in Montana, that lane carries whispers going up to satellites; in Manhattan, the same lane carries
        femtocells shouting down at phones. Both at once, in the same city block? Impossible — a phone transmitting up is
        deafening noise beside a femtocell transmitting down. The resolution is geography: satellite mode where people are
        sparse, terrestrial mode where they're dense, with engineered buffer zones between. It works only because one

        other US carrier has a lane that can do this.

function SpeedLadder({ dlMHz }) {
  const B = dlMHz > 0 ? dlMHz : 20;
  const RUNGS = [
    { se: 0.62, name: "Measured today", what: "UPM crowdsourced measurement of the live service (mean ~0.52\u20130.62 bps/Hz; high SINR rarely observed)", status: "MEASURED FACT", tone: C.green },
    { se: 2.48, name: "Claim-anchored average", what: "measured \u00D7 the claimed 4\u00D7 \u2014 this site's per-beam planning number, shared by everyone in the cell", status: "PLANNING ESTIMATE", tone: C.blue },
    { se: 7.5, name: "SpaceX's official peak", what: "\u201C150 Mbps per user\u201D (Pica, ITU Feb 2026) \u2014 exactly the standard 20 MHz LTE/NR 2\u00D72 / 64QAM peak: one user, beam center, whole channel, briefly", status: "COMPANY CLAIM", tone: C.amber },
    { se: 16, name: "The 16 bps/Hz figure", what: "the NR 256QAM 2-layer waveform ceiling (also \u2248 the dish service's 300 Mbps \u00F7 20 MHz) \u2014 no SpaceX D2C statement claims it, and the link budget can't reach it", status: "NOT A D2C CLAIM", tone: C.red },
  ];
  return (
    <div className="card" style={{ borderTop: `2px solid ${C.green}` }}>
      <div className="eyebrow" style={{ color: C.green }}>The speed ladder — measured vs claimed vs ceiling <Src k="speeds" topic="measured" /></div>
      <p className="body" style={{ marginBottom: 10 }}>
        Every throughput number in this debate is real <em>somewhere</em> — the question is which quantity it measures.
        Spectral efficiency (bits per second per Hz) is the honest common currency. The ladder below applies each rung to
        the currently configured satellite downlink ({B} MHz). When someone quotes you a single number, find its rung:
      </p>
      {RUNGS.map((r, i) => (
        <div key={i} className="evt" style={{ borderLeft: `2px solid ${r.tone}`, paddingLeft: 12, marginBottom: 8 }}>
          <div className="evtHead" style={{ gap: 10 }}>
            <span style={{ fontFamily: "var(--mono)", fontSize: 13, color: r.tone }}>{r.se} bps/Hz → ~{Math.round(r.se * B)} Mbps</span>
            <span style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.08em", color: r.tone, border: `1px solid ${r.tone}`, borderRadius: 3, padding: "1px 6px", opacity: 0.9 }}>{r.status}</span>
          </div>
          <div className="evtBody"><strong style={{ color: C.text }}>{r.name}.</strong> {r.what}</div>
        </div>
      ))}
      <p className="body" style={{ fontSize: 12, color: C.dim, marginTop: 8 }}>
        The physics test: spectral efficiency is bought with SINR. 256QAM (the 16 bps/Hz rung) needs ~28–30 dB at the
        phone; the FCC milestone ladder SpaceX itself negotiated benchmarks this service at <strong>5 dB SINR, 90%
        availability</strong> — a ~25 dB gap no power waiver or aperture jump closes as an operating point. Dual-stream
        MIMO from one satellite additionally requires polarization multiplexing to a randomly oriented handset (a rank-1
        line-of-sight channel otherwise). Note what SpaceX's aggressive numbers actually claim: "20×
        throughput, 100× capacity" are <em>capacity multipliers</em> (beams × MHz × efficiency summed
        per satellite), not per-Hz efficiency — and their official 7.5 bps/Hz peak is the tell that their engineers
        claimed the 64QAM ceiling, not the 256QAM one. Peak-to-average of ~3× (150 peak vs ~50 shared) matches every
        terrestrial LTE network ever deployed: 150 is the sprint, 50 is the marathon pace.
      </p>
    </div>
  );
}

function PhysicsTab({ cfg, setCfg }) {

            rates (accepting fewer bits per second is itself worth many dB), and flying lower (each halving of distance buys
            +6 dB). Stack them and the ledger barely balances — which is why every single dB in this story is fought over:
            a 3 dB regulatory power waiver (2× power) was worth a year of FCC litigation, and the 5× bigger 2027 antenna

          { l: femtoLive ? `Configured n70 femtocell (${z.terrDLMbps.toFixed(0)} Mbps over ~50 m radius)` : "Femtocell layer — no blocks assigned TERR", v: femtoDensity, c: C.blue, t: femtoLive ? `~${Math.round(femtoDensity).toLocaleString()} Mbps/km²` : "—" },
        ].map((r, i) => (

            <div className="meter big"><div className="meterFill" style={{ width: bar(r.v) + "%", background: r.c }} /></div>
          </div>
        ))}
        <p className="body" style={{ marginTop: 14, color: C.dim, fontSize: 13 }}>
          Six-plus orders of magnitude apart in the hybrid configurations — and that's the whole strategy in one chart. The
          satellite layer buys ubiquity (every km² gets <em>something</em>); the femtocell layer buys intensity (huge Mbps/km²,
          in dots tens of meters wide). Incumbents solve the pairing with ~250k macro towers and &gt;1M small cells; SpaceX's
          bet is satellites + dish-mounted femtocells approximate it without the tower capex. The V2 150 Mbps headline is a
          peak, single-user, best-case claim.
        </p>
        <Info label="why everyone under a beam shares one pipe — and what Mbps/km² means">
          A satellite beam is one radio channel painted over a patch of ground — like one Wi-Fi router asked to serve an
          entire county. Its Mbps figure is the <em>total</em> for everyone inside: two active users each get roughly half,
          twenty get a twentieth. That's why raw per-beam speed matters less than <strong>capacity density</strong> —
          Mbps per square kilometer — which asks the question that actually decides whether a network works: how much
          traffic can this patch of map carry at once? The chart above shows why the hybrid exists: a satellite beam
          spreads its Mbps over ~2,000 km² (a big number divided by a huge area = a tiny density), while a femtocell pours
          its Mbps into a ~50-meter circle (a modest number over a tiny area = enormous density). Cities need density;
          wilderness needs presence. No single technology delivers both — which is the one-sentence justification for the
          entire two-layer architecture, and the reason "150 Mbps from space" and "satellite can't serve cities" are both
          true at the same time.
        </Info>
      </div>

      <DeployClock compact />
    </div>

/* The phone is omnidirectional and satellite-unaware; the satellite does
   everything. These panels model footprint geometry, Earth-fixed-cell
   beam hopping with frequency reuse, and the Rel-17/19 NTN handset gain. */

function footprintGeom(hKm, elevDeg) {
  const Re = 6371;
  const e = (elevDeg * Math.PI) / 180;
  const lam = Math.acos((Re / (Re + hKm)) * Math.cos(e)) - e;
  const rKm = Re * lam;
  const area = 2 * Math.PI * Re * Re * (1 - Math.cos(lam));
  const cap = (1 - Math.cos(lam)) / 2;
  const N = Math.round(3.3 / cap); // Walker-overlap factor calibrated to ~650 @ 25°/530 km
  return { rKm, area, N };
}

function mulberry(seed) {
  let a = seed + 0x6d2b79f5;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

      <Info label="walk me through elevation angle — why it decides everything">
        Stand outside and point at a satellite. If it's 25° above the horizon, your arm is nearly level — and the signal
        path between you skims across everything around you: every tree line, rooftop, hill, and even your own body when
        you're turned the wrong way. If it's 60° up, you're pointing well overhead and the path clears most obstacles.
        A phone can't do anything about blockage — so the only fix is <em>waiting for (or having) a satellite high enough
        in the sky for your surroundings</em>. That's why the "right" angle depends on where you're standing: a Kansas
        wheat field is served fine by a satellite crawling along the horizon; a Manhattan sidewalk needs one nearly
        overhead. And satellites near overhead are rare — the sky directly above you is a small target — so demanding a
        high angle everywhere multiplies the number of satellites the constellation needs. The FCC understood this, which
        is why its rules don't say "cover at 45°"; they say "deliver a usable signal ≥70% (later 90%) of the time" —
        letting statistics over the whole sky do the talking.
      </Info>
      <Info label="how the satellite-count estimate is computed">
        Each satellite covers a circular cap of Earth's surface (the amber circle). Basic geometry gives that cap's size
        from altitude and elevation angle. Dividing Earth's surface by the cap area gives a theoretical minimum satellite
        count — but real constellations can't tile the sphere perfectly: orbits bunch coverage at some latitudes and
        satellites' circles must overlap to leave no gaps. We apply a ~3.3× "overlap inefficiency" factor, chosen so the
        model reproduces reality — SpaceX's actual ~650-satellite first-generation fleet delivering continuous ~25°
        coverage from 530 km. With the model anchored to a known truth, the other slider positions become credible
        extrapolations rather than guesses. It remains an estimate: real constellation design juggles inclinations,
        planes, and phasing that no single factor captures.
      </Info>
      <Info label="reach vs share vs illumination — the three circle sizes on this site">
        This site draws circles at three very different scales, and they nest. <strong>Reach</strong> (this panel's amber
        circle): everything one satellite <em>can</em> see above the elevation mask — set purely by altitude and mask
        geometry, and completely independent of how many other satellites exist. <strong>Share</strong> (Panel 6's faint
        circles): the slice of its reach a satellite <em>actually serves</em> once neighbors claim the rest — every cell
        goes to whichever satellite sees it steepest, so shares shrink as the fleet grows (~900 km across at 650
        satellites, ~190 km at 15,000) while reach never moves. <strong>Illumination</strong> (the ~5 km beam dots): the
        ground a satellite is <em>lighting this instant</em> inside its share, hopping to cover the rest. Reach ⊇ share ⊇
        lit beams. The satellite-count ladder on this panel is derived from reach — Earth's area ÷ one footprint (× a
        constellation overlap factor) — which is why the fleet number is an <em>output</em> of this circle, never an
        input to it.
      </Info>
      <Info label="why more satellites ≠ smaller beams (how coverage becomes capacity)">
        A common misreading of the ladder: that launching more satellites shrinks the beams. It doesn't — beam size is
        frozen into each satellite's hardware at the factory by the diffraction limit (wavelength ÷ antenna size) and the
        orbital altitude. A thousand more identical satellites leave every beam exactly as big as before. Densification
        actually runs on two separate clocks. <strong>Hardware generations shrink beams:</strong> Gen1's ~25 m² arrays at
        530 km paint ~20–50 km spots; the 2027 satellites' ~5× arrays at 330 km paint ~5–10 km — and there's a floor: at
        phone frequencies, ~4–5 km is roughly the physical minimum for buildable antennas (sub-km would need a ~50 m
        panel; nobody's flying that — see the beam-size lab below). <strong>Fleet growth densifies by stacking:</strong>
        more satellites overhead means more beams available per km², higher revisit duty-cycle per cell — and, subtly,
        <em> steeper average look angles</em>: with ten satellites in view instead of two, every cell gets handed to one
        nearly overhead, pushing more of the map into the full-menu reuse-1 zone (Panel 3). That last effect means
        per-cell spectrum and efficiency improve purely from fleet count, with zero hardware change — a capacity gain
        hiding inside a coverage number. So the ladder's real meaning: ~650 saturates coverage; everything beyond
        multiplies capacity along three compounding axes — beams-per-area, duty cycle, and look-angle quality — until the
        aperture floor, regulatory power-density ceilings, and the launch treadmill become the binding constraints.
        15,000 satellites isn't more coverage; it's the same coverage served ~20× more densely at steadily steeper angles.
      </Info>
    </div>
  );
}

function BeamSizeLab() {
  const [D, setD] = useState(11.2);   // aperture side, m
  const [f, setF] = useState(2.0);    // GHz
  const [h, setH] = useState(330);    // km
  const [be, setBe] = useState(90);   // beam elevation at the ground spot, deg
  const lam = 0.2998 / f;             // wavelength, m
  const th = lam / D;                 // beamwidth, rad (λ/D convention)
  const s = Math.sin((be * Math.PI) / 180);
  const nadirKm = th * h;
  const slant = h / s;
  const across = th * slant;          // km, cross-track
  const along = across / s;           // km, along look direction
  const area = Math.PI * (across / 2) * (along / 2);
  const Dsub = lam * h;               // aperture side for 1-km nadir cells at this f & h
  const PRESETS = [
    { n: "V2-Mini D2C (today)", D: 5.0, f: 2.0, h: 530 },
    { n: "Dedicated D2C 2027", D: 11.2, f: 2.0, h: 330 },
    { n: "AST BB2 · 850 MHz low-band", D: 14.9, f: 0.85, h: 520 },
    { n: "AST BB2 · same panel @ 2 GHz", D: 14.9, f: 2.0, h: 520 },
  ];
  const isPre = (p) => Math.abs(D - p.D) < 0.15 && Math.abs(f - p.f) < 0.03 && Math.abs(h - p.h) < 6;
  const k = Math.min(360 / Math.max(along, 0.001), 46); // px per km, capped

        entire industry's cells bottom out at kilometers, and the last mile of capacity density belongs to the ground.

function BeamMap() {
  const [playing, setPlaying] = useState(true);

  const [view, setView] = useState("beams");
  const [t, setT] = useState(0);

  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setT((x) => x + 120), 120);
    return () => clearInterval(id);
  }, [playing]);

  const cols = 30, rows = 11, dx = 28, dy = 27, x0 = 34, y0 = 90;
  const cells = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      cells.push({ id: r * cols + c, x: x0 + c * dx + (r % 2 ? dx / 2 : 0), y: y0 + r * dy, f: (c + 2 * r) % 3 });
  const W = 900, H = 440, cy = y0 + ((rows - 1) * dy) / 2;
  const period = 24000, span = 1250, R = 218;
  const satX = (off) => -170 + (((t + off) % period) / period) * span;
  const sats = [
    { id: "SAT-A", x: satX(0) },
    { id: "SAT-B", x: satX(period / 3) },
    { id: "SAT-C", x: satX((2 * period) / 3) },
  ];
  const hot = [{ x: x0 + 6 * dx, y: y0 + 3 * dy }, { x: x0 + 15 * dx, y: y0 + 7 * dy }, { x: x0 + 23 * dx, y: y0 + 4 * dy }];
  const isHot = (cl) => hot.some((h) => Math.hypot(cl.x - h.x, cl.y - h.y) < 58);
  const inFootOf = (cl) => sats.filter((s) => Math.hypot(cl.x - s.x, cl.y - cy) < R);

  const slot = Math.floor(t / 480);
  useEffect(() => {
    const inFoot = cells.filter((cl) => inFootOf(cl).length > 0);
    if (inFoot.length === 0) { setActive([]); return; }
    const pool = [];
    inFoot.forEach((cl) => { pool.push(cl); if (isHot(cl)) { pool.push(cl); pool.push(cl); pool.push(cl); } });
    const rand = mulberry(slot * 7919 + beams);
    const chosen = new Set();
    let guard = 0;
    while (chosen.size < Math.min(beams, inFoot.length) && guard++ < 2000)
      chosen.add(pool[Math.floor(rand() * pool.length)].id);
    setActive([...chosen]);
    // eslint-disable-next-line
  }, [slot, beams, reuse]);

  const FCOLORS = [C.amber, C.blue, "#C79BFF"];
  const SATC = ["#6BDB8F", "#4DD0E1", "#FF9ECF"];

    const f = inFootOf(cl);
    if (!f.length) return -1;
    const s = [...f].sort((a, b) => Math.hypot(cl.x - a.x, cl.y - cy) - Math.hypot(cl.x - b.x, cl.y - cy))[0];
    return sats.indexOf(s);
  };
  const phoneCell = cells[5 * cols + 12];
  const phoneSats = inFootOf(phoneCell).sort((a, b) => Math.hypot(phoneCell.x - a.x, phoneCell.y - cy) - Math.hypot(phoneCell.x - b.x, phoneCell.y - cy));
  const serving = phoneSats[0];

    <div className="card" style={{ borderTop: `2px solid ${C.amber}` }}>
      <div className="eyebrow" style={{ color: C.amber }}>Panel 2 · Earth-fixed cells, hopping beams, frequency reuse — the animation <Src k="nextgen" topic="nextgen" /></div>
      <p className="body" style={{ marginBottom: 10 }}>
        The grid never moves: those are <strong>Earth-fixed cells</strong>, virtual towers nailed to geography. Satellites
        sweep across at 7.5 km/s (a ~3-minute pass, compressed), and the constellation is sized so footprints
        <em> always overlap</em> — no cell is ever outside every footprint. Two views of the same system:
        <strong> Beam activity</strong> shows illumination — where beams are dwelling <em>right now</em> (for user data,
        broadcast, or paging alike; lit ≠ specifically paging), which is inherently intermittent because an unlit cell is
        just <em>between visits</em>. <strong>Coverage assignment</strong> shows the other truth: every covered cell's
        <em> border</em> is colored by the satellite responsible for it at this instant — continuous and gapless even
        while illumination hops, with handoffs visible as a border-color wave sweeping the static grid. Watch the marked
        📱 cell in either view: served without interruption, no phone-side handoff.
      </p>
      <div className="tglRow" style={{ marginBottom: 8, alignItems: "center" }}>
        <button className="genBtn on" onClick={() => setPlaying(!playing)}>{playing ? "⏸ pause" : "▶ play"}</button>
        <button className={"genBtn" + (view === "beams" ? " on" : "")} onClick={() => setView("beams")}>Beam activity view</button>
        <button className={"genBtn" + (view === "coverage" ? " on" : "")} onClick={() => setView("coverage")}>Coverage-assignment view</button>
        <button className={"genBtn" + (reuse === "reuse3" ? " on" : "")} onClick={() => setReuse("reuse3")}>Reuse-3</button>
        <button className={"genBtn" + (reuse === "reuse1" ? " on" : "")} onClick={() => setReuse("reuse1")}>Reuse-1</button>
        <label className="sliderL" style={{ flex: 1, minWidth: 200, fontSize: 12 }}>

          <input type="range" min="8" max="64" value={beams} onChange={(e) => setBeams(+e.target.value)} />
        </label>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block" }} role="img" aria-label="Animated map of Earth-fixed cells served by hopping satellite beams">

            <g transform={`translate(${s.x}, 34)`}>

              <rect x="-30" y="-3" width="16" height="6" fill="none" stroke={C.amber} strokeWidth="1" />

            <span style={{ fontSize: 12, color: C.dim }}>Border = the satellite currently responsible for the cell (continuous, gapless); interior tint = the cell's frequency channel. Beam activity is deliberately hidden in this view — flip back to see illumination hopping within these assignments.</span>

          </>
        ) : (
          <span style={{ fontSize: 12, color: C.red }}>Reuse-1: every beam uses the full DL allocation. Maximum capacity per beam — but only beams with enough spatial separation can be co-scheduled, or they jam each other. The scheduler must keep same-channel beams apart; with 16× more, smaller beams (2027 hardware), isolation improves and reuse-1 gets more viable.</span>
        ))}
      </div>
      <Info label="what exactly is an Earth-fixed cell? (the core trick, slowly)">
        In a normal network your phone talks to a tower that never moves; the "cell" is just that tower's neighborhood.
        Starlink's towers move at 27,000 km/h — so instead of letting cells follow satellites, the network defines a map
        of virtual cells <em>glued to the ground</em>, each with a permanent identity, like postal codes. A satellite
        passing overhead is assigned to "be" cell #162 for the few minutes it can see it: it steers a beam to hold that
        exact patch of ground, continuously adjusting as it flies. Before it loses the angle, the network — which knows
        every satellite's position seconds and minutes into the future — orders the next satellite to take over the same
        cell: same identity, same frequency, seamlessly. Your phone, which only knows "I'm connected to cell #162," never
        notices anything happened. All the motion, all the handoffs, all the complexity is hidden on the space side of the
        link. It's a relay race where the baton is a cell tower and the runners are invisible.
      </Info>
      <Info label="if my cell is dark right now, how does a call reach me?">
        Phones don't listen continuously — that would drain the battery in hours. An idle phone sleeps and wakes only at
        scheduled instants (every 1.28 or 2.56 seconds in LTE, and NTN allows much longer) to check for a "page": the
        network's knock announcing an incoming call or text. This is called DRX — discontinuous reception. And the
        coincidence isn't luck — it's a <strong>shared appointment calendar</strong>: when a phone camps on a cell it reads
        the cell's broadcast paging configuration, then both sides run the same formula — the phone's identity number,
        hashed against the paging cycle, yields the exact instants <em>this specific phone</em> will listen. The network
        knows every camped phone's appointments and queues pages for them; the hashing also spreads millions of phones
        across different instants so paging never bottlenecks on one moment. The satellite's beam-hopping schedule is then
        built around that calendar: a beam revisits each cell so it's present at the appointments of the phones camped
        there. So a cell that looks dark 80% of the time still delivers every incoming call — the 20% of illumination is
        aimed at exactly the instants that matter, and pages repeat across a few occasions so one missed dwell costs
        latency, not the call. (Active data sessions are different: those cells get dwell time proportional to demand,
        which is what the ⌂ town weighting shows.)
      </Info>
      <Info label="frequency reuse, for people who don't plan cell networks">
        SpaceX owns a limited slice of radio spectrum — think of it as three lanes of highway. Two beams pointed at
        neighboring patches of ground can't both shout on the same lane at full power: phones near the border would hear
        both and understand neither. Solution one (reuse-3): assign neighbors different lanes — F1, F2, F3 in a repeating
        pattern — so no two adjacent cells share one. Cost: each cell only gets a third of the total spectrum. Solution
        two (reuse-1): give every beam all three lanes and rely on <em>distance</em> — physically separate same-lane
        beams far enough that they can't hear each other. That's maximum capacity but a hard scheduling puzzle. The 2027
        satellites' smaller, more numerous beams make the distance trick work better (tighter beams bleed less energy
        sideways), which is one of the quiet reasons beam-shrinking multiplies capacity by more than the beam count alone.
      </Info>
      <Info label="aren't low-elevation beams stretched into ellipses? (yes)">
        The circles in this animation are <em>cells</em>, not beam projections — and real beam projections at low elevation
        are indeed ellipses, significantly so. A conical beam hitting the ground at 25° elevation smears along the look
        direction by roughly 1/sin(25°) ≈ 2.4×, and the slant distance at that angle is about double the straight-down
        distance, widening the beam in both axes before the stretch — so an edge-of-footprint beam can paint ~2× wider and
        ~5× longer than the same beam at nadir. Phased arrays make it worse at the edges, not better: steering far
        off-center shrinks the antenna's effective area (you're seeing the panel edge-on — "scan loss"), widening the beam
        and costing signal exactly where the path is already longest. Beam shaping can partially compensate; geometry
        always wins. The system's real answers: <strong>prefer steep looks</strong> — with overlapping footprints, the
        scheduler hands each cell to whichever satellite sees it most steeply (one more quiet reason to overbuild past 1×
        coverage); <strong>decouple cells from beams</strong> — the Earth-fixed cell stays a neat fixed patch, and an
        oversized elliptical beam merely has to cover it, wasting some energy and leaking more interference but keeping
        the phone's world clean; and <strong>accept degraded edges</strong> — edge-of-footprint service is genuinely
        worse, which is why minimum elevation is the master variable of this whole architecture (Panel 1).
      </Info>
    </div>
  );
}

      <div className="statGrid" style={{ marginTop: 12 }}>

        <div className="stat"><div className="statL">Beam footprint stretch</div><div className="statV">~{stretch.toFixed(1)}× along look direction</div></div>

        neighbors' beams barely spill onto each other, so there's no interference to manage: every cell can use the entire
        20 MHz downlink channel at once (the three stacked color stripes — the "full menu"). Now walk away from nadir. From your
        new position the satellite hangs lower in the sky; its beam reaches you along a longer slanted path and smears into
        a stretched ellipse (drag the slider and watch the patches widen). Smeared beams slop energy onto their neighbors,

        channel (single stripes, alternating colors) so each one's slice stays clean, at the cost of only a third of it.

function SawtoothPanel() {
  const [fleet, setFleet] = useState(650);
  const [pool, setPool] = useState(20);
  const mask = 30, alt = 330;
  // coverage multiplicity: satellites simultaneously visible above mask, calibrated via cap geometry
  const capf = (1 - Math.cos(Math.acos((6371 / (6371 + alt)) * Math.cos((mask * Math.PI) / 180)) - (mask * Math.PI) / 180)) / 2;
  const kVis = Math.max((fleet * capf) / 3.3 * 3.3, fleet * capf); // expected sats in view ≈ N × cap fraction
  // simulate passes: each pass rises mask→peak→mask over PD steps; serving elevation = max over active passes
  const STEPS = 240, PD = 60;
  const rand = mulberry(fleet * 31 + pool * 7);
  const passes = [];
  const spawnP = kVis / PD; // expected concurrent ≈ kVis
  for (let t = -PD; t < STEPS; t++) {
    let n = 0;
    if (spawnP >= 1) { n = Math.floor(spawnP); if (rand() < spawnP - n) n++; }
    else if (rand() < spawnP) n = 1;
    for (let j = 0; j < n; j++) passes.push({ t0: t, pk: mask + (90 - mask) * Math.sqrt(rand()) });
  }
  const elev = [], thr = [];
  const regime = (e) => (e >= 60 ? 1 : e >= 42 ? 2 : 3);
  for (let t = 0; t < STEPS; t++) {
    let best = 0;
    for (const p of passes) {
      const dt = t - p.t0;
      if (dt < 0 || dt > PD) continue;
      const frac = 1 - Math.abs(dt - PD / 2) / (PD / 2);
      const e = mask + (p.pk - mask) * frac;
      if (e > best) best = e;
    }
    elev.push(best);
    if (best < mask) { thr.push(0); continue; }
    const r = regime(best);
    const mhz = r === 1 ? pool : r === 2 ? (pool * 2) / 3 : pool / 3;
    thr.push(mhz * 2.48 * Math.sin((best * Math.PI) / 180));
  }
  const valid = thr.filter((x) => x > 0);
  const mean = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : 0;
  const sorted = [...thr].sort((a, b) => a - b);
  const p10 = sorted[Math.floor(STEPS * 0.1)], p90 = sorted[Math.floor(STEPS * 0.9)];
  const outage = (thr.filter((x) => x === 0).length / STEPS) * 100;
  const r1pct = (elev.filter((e) => e >= 60).length / STEPS) * 100;
  const maxT = pool * 2.48;
  const X = (t) => 40 + (t / STEPS) * 830;
  const Ye = (e) => 120 - ((e - 0) / 90) * 95;
  const Yt = (v) => 285 - (v / maxT) * 120;
  const line = (arr, Y) => arr.map((v, t) => `${t === 0 ? "M" : "L"} ${X(t).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
  return (
    <div className="card" style={{ borderTop: `2px solid ${C.red}` }}>
      <div className="eyebrow" style={{ color: C.red }}>Panel 5 · The elevation sawtooth — throughput variance vs fleet size <Src k="measured" topic="derived" /></div>
      <p className="body" style={{ marginBottom: 10 }}>
        Your serving satellite isn't a constant — it rises from the mask, peaks, and recedes, replaced by the next. With a
        sparse fleet, the <em>best</em> satellite in your sky sometimes peaks barely above the mask, and throughput
        sawtooths violently between full-menu overhead moments and rationed low-angle troughs. Saturate the sky and the
        max over many visible satellites never drops far: the sawtooth flattens into a ripple. Drag the fleet slider and
        watch <strong>variance</strong>, not just the average — variance is what a phone call actually experiences.
      </p>
      <div className="tglRow" style={{ marginBottom: 8, alignItems: "center" }}>
        <button className={"genBtn" + (pool === 20 ? " on" : "")} onClick={() => setPool(20)}>20 MHz DL · n252 today</button>
        <button className={"genBtn" + (pool === 25 ? " on" : "")} onClick={() => setPool(25)}>25 MHz · + H-block (future)</button>
        <label className="sliderL" style={{ flex: 1, minWidth: 220, fontSize: 12 }}>
          Fleet size: <strong>{fleet.toLocaleString()}</strong> satellites (~{kVis.toFixed(1)} typically in view above {mask}°)
          <input type="range" min="650" max="15000" step="50" value={fleet} onChange={(e) => setFleet(+e.target.value)} />
        </label>
      </div>
      <svg viewBox="0 0 900 320" style={{ width: "100%", display: "block" }} role="img" aria-label="Serving satellite elevation and per-cell throughput over time for the selected fleet size">
        <text x="40" y="16" fill={C.dim} fontSize="9.5" fontFamily="var(--mono)">SERVING SATELLITE ELEVATION (best in view)</text>
        <line x1="40" y1={Ye(mask)} x2="870" y2={Ye(mask)} stroke={C.red} strokeWidth="0.8" strokeDasharray="4 4" />
        <text x="874" y={Ye(mask) + 3} fill={C.red} fontSize="8.5" fontFamily="var(--mono)">mask {mask}°</text>
        {[30, 60, 90].map((e) => (
          <text key={e} x="34" y={Ye(e) + 3} textAnchor="end" fill={C.dim} fontSize="8.5" fontFamily="var(--mono)">{e}°</text>
        ))}
        <line x1="40" y1={Ye(60)} x2="870" y2={Ye(60)} stroke={C.green} strokeWidth="0.8" strokeDasharray="4 4" />
        <text x="874" y={Ye(60) + 3} fill={C.green} fontSize="8.5" fontFamily="var(--mono)">reuse-1 ≥60°</text>
        <path d={line(elev, Ye)} fill="none" stroke={C.green} strokeWidth="1.3" />
        <text x="40" y="168" fill={C.dim} fontSize="9.5" fontFamily="var(--mono)">PER-CELL DL THROUGHPUT · Mbps (Panel 3 model: MHz by reuse regime × 2.48 × sin ε)</text>
        {[0, 0.5, 1].map((f2) => (
          <text key={f2} x="34" y={Yt(maxT * f2) + 3} textAnchor="end" fill={C.dim} fontSize="8.5" fontFamily="var(--mono)">{Math.round(maxT * f2)}</text>
        ))}
        <line x1="40" y1={Yt(0)} x2="870" y2={Yt(0)} stroke={C.line} />
        <line x1="40" y1={Yt(maxT)} x2="870" y2={Yt(maxT)} stroke={C.line} strokeDasharray="3 4" opacity="0.6" />
        <text x="874" y={Yt(maxT) + 3} fill={C.dim} fontSize="8.5" fontFamily="var(--mono)">{maxT.toFixed(0)} Mbps ceiling</text>
        <path d={line(thr, Yt)} fill="none" stroke={C.amber} strokeWidth="1.4" />
        <text x="455" y="314" textAnchor="middle" fill={C.dim} fontSize="9" fontFamily="var(--mono)">time → (~a few orbital passes, schematic)</text>
      </svg>
      <div className="statGrid" style={{ marginTop: 10 }}>
        <div className="stat"><div className="statL">Mean per-cell DL</div><div className="statV">~{mean.toFixed(0)} Mbps</div></div>
        <div className="stat"><div className="statL">p10 – p90 swing</div><div className="statV" style={{ color: C.amber }}>{p10.toFixed(0)} – {p90.toFixed(0)} Mbps {mean > 0 ? `(±${(((p90 - p10) / 2 / mean) * 100).toFixed(0)}%)` : ""}</div></div>
        <div className="stat"><div className="statL">Time in reuse-1 (≥60°)</div><div className="statV" style={{ color: C.green }}>{r1pct.toFixed(0)}%</div></div>
        <div className="stat"><div className="statL">Coverage gaps (no sat ≥{mask}°)</div><div className="statV" style={{ color: outage > 0.5 ? C.red : C.dim }}>{outage.toFixed(1)}% of time</div></div>
      </div>
      <Info label="how to read these two charts">
        The green trace is the elevation (in degrees, left axis) of the <em>best</em> satellite in your sky. Each hump is
        one satellite's pass — rising from the 30° mask, peaking, receding — and the kinks are <strong>handovers</strong>:
        the instant a rising satellite overtakes the receding one as your best option. The amber trace is that elevation
        pushed through Panel 3's throughput model, and its jagged shape is the real lesson: it is <em>not</em> a smooth
        copy of the green line, because frequency reuse is a <strong>staircase</strong>. When your best satellite crosses
        60°, your cell snaps from ~⅔ to the full spectrum menu (the flat plateaus hugging the ceiling are reuse-1
        stretches); when it sinks through ~42°, you snap down to one lane of three (the deep square troughs); within each
        stair, the gentle slope is the sin ε link penalty. So: cliffs = reuse thresholds, slopes = geometry, flat tops =
        the spectrum ceiling, zero-drops = moments with no satellite above the mask at all. Now drag the fleet slider up
        and watch the staircase collapse into a plateau — with many satellites in view, the best one is almost always
        above 60°, so the network lives in reuse-1, the troughs vanish, and the p10–p90 swing collapses. Same spectrum,
        same satellites, same physics: consistency is purely a fleet-count product.
      </Info>
      <p className="body" style={{ fontSize: 12, color: C.dim, marginTop: 10 }}>
        Model (derived, schematic): satellites-in-view ≈ fleet × visible-cap fraction at 330 km; passes rise
        mask → random peak → mask; the phone is served by the highest satellite in view; throughput uses Panel 3's exact
        anchors and reuse thresholds. Real constellations phase their planes to smooth this further — treat the shapes and
        the variance trend as the point, not the exact Mbps. The strategic reading: fleet growth's least-advertised
        product is <em>consistency</em> — the same slider that adds capacity is quietly deleting the troughs.
      </p>
    </div>
  );
}

function StitchPanel() {
  const [fleet, setFleet] = useState(2000);
  const [spd, setSpd] = useState(60);
  const [zspd, setZspd] = useState(60);
  const [nb, setNb] = useState(19);
  const [nph, setNph] = useState(1);
  const [nstr, setNstr] = useState(3);
  const [t, setT] = useState(0);
  useEffect(() => {
    if (spd === 0 && zspd === 0) return;
    const id = setInterval(() => setT((x) => x + 0.1), 100);
    return () => clearInterval(id);
  }, [spd, zspd]);
  const h = 330, Re = 6371, EARTH = 510e6, US = 8.1e6;
  const areaPer = EARTH / fleet;
  const spacing = 1.075 * Math.sqrt(areaPer);
  const rServe = spacing / Math.sqrt(3);
  const lamD = rServe / Re;
  const eEdge = (Math.atan2(Math.cos(lamD) - Re / (Re + h), Math.sin(lamD)) * 180) / Math.PI;
  const regime = eEdge >= 60 ? 1 : eEdge >= 42 ? 2 : 3;
  const tone = regime === 1 ? C.green : regime === 2 ? C.amber : "#C79BFF";
  const beamArea = Math.PI * 2.35 * 2.35;
  const beamsNeeded = areaPer / beamArea;
  const duty = Math.min(700 / beamsNeeded, 1) * 100;
  const satsUS = fleet * (US / EARTH) * 1.3;
  // guaranteed floor: invert Panel 1's calibrated model (3.3× Walker overlap) — largest mask this fleet guarantees everywhere, always
  const capf = (e) => { const er = (e * Math.PI) / 180; return (1 - Math.cos(Math.acos((Re / (Re + h)) * Math.cos(er)) - er)) / 2; };
  let gLo = 25, gHi = 89;
  for (let i = 0; i < 40; i++) { const mid = (gLo + gHi) / 2; if (3.3 / capf(mid) > fleet) gHi = mid; else gLo = mid; }
  const guarE = gLo;
  const usCapGbps = satsUS * Math.min(700, beamsNeeded) * 0.05;
  const CONUS = "M 233,89 L 2662,89 L 2662,46 L 2692,46 L 2707,107 L 2734,126 L 2885,150 L 2970,185 L 3041,170 L 3178,198 L 3256,167 L 3564,323 L 3587,374 L 3628,366 L 3650,410 L 3687,424 L 3676,443 L 3768,496 L 3804,693 L 3718,859 L 3755,904 L 4084,772 L 4064,705 L 4104,687 L 4270,687 L 4298,644 L 4442,534 L 4737,533 L 4745,506 L 4811,483 L 4869,346 L 4935,262 L 4965,291 L 5023,272 L 5062,304 L 5062,456 L 5135,556 L 4858,681 L 4797,772 L 4796,831 L 4825,890 L 4862,893 L 4852,852 L 4879,877 L 4872,909 L 4616,955 L 4543,987 L 4672,966 L 4698,987 L 4575,1021 L 4519,1021 L 4522,1007 L 4495,1038 L 4521,1043 L 4502,1123 L 4438,1209 L 4432,1180 L 4384,1147 L 4424,1227 L 4425,1269 L 4347,1401 L 4367,1321 L 4322,1278 L 4312,1186 L 4295,1234 L 4313,1304 L 4255,1287 L 4316,1323 L 4320,1429 L 4345,1436 L 4366,1586 L 4310,1669 L 4220,1702 L 4162,1767 L 4118,1774 L 4074,1815 L 4061,1853 L 3965,1925 L 3874,2044 L 3861,2123 L 3876,2200 L 3944,2374 L 3986,2551 L 3958,2738 L 3932,2752 L 3889,2738 L 3875,2689 L 3841,2664 L 3741,2439 L 3759,2366 L 3666,2211 L 3632,2194 L 3543,2245 L 3430,2160 L 3331,2174 L 3253,2161 L 3150,2186 L 3183,2283 L 3166,2298 L 3133,2281 L 3101,2302 L 3037,2299 L 2971,2240 L 2895,2254 L 2831,2228 L 2703,2262 L 2488,2446 L 2467,2573 L 2488,2664 L 2454,2667 L 2323,2608 L 2279,2478 L 2153,2273 L 2091,2229 L 2019,2231 L 1964,2319 L 1891,2285 L 1846,2252 L 1795,2132 L 1666,2009 L 1514,2009 L 1514,2055 L 1270,2056 L 937,1923 L 946,1901 L 734,1922 L 720,1865 L 663,1801 L 622,1788 L 612,1756 L 428,1691 L 417,1630 L 332,1518 L 259,1363 L 262,1338 L 156,1208 L 143,1117 L 97,1056 L 113,868 L 85,783 L 119,678 L 140,476 L 125,327 L 71,180 L 82,158 L 209,196 L 256,301 L 277,272 L 233,89 Z";
  const MW = 5140, MH = 2760;
  const kpx = 880 / MW, ox = 10, oy = 8;
  // Two complete interleaved families, both spanning the whole map: NE-bound (ascending) and SE-bound (descending)
  const Sf = spacing * 1.414; // per-family lattice spacing; interleaved they net ~`spacing`
  const off = (t * 7.3 * spd) % Sf;
  const diag = Math.hypot(MW, MH) / 2 + Sf * 2;
  const FAMS = [
    { d: [0.766, -0.643], col: C.blue },  // NE-bound: east + north (screen up)
    { d: [0.766, 0.643], col: C.green },  // SE-bound: east + south
  ];
  const sats = [];
  FAMS.forEach((f, fi) => {
    const [dx, dy] = f.d, px = -dy, py = dx;
    for (let a = -diag; a <= diag; a += Sf) {
      for (let c = -diag; c <= diag; c += Sf) {
        const along = a + off + (fi ? Sf / 2 : 0);
        const cross = c + (fi ? Sf / 2 : 0);
        const x = MW / 2 + along * dx + cross * px;
        const y = MH / 2 + along * dy + cross * py;
        if (x > -150 && x < MW + 150 && y > -150 && y < MH + 150) sats.push([x, y, fi]);
      }
    }
  });
  // ZOOM: three adjacent SE-bound strips, satellites streaming with their spot-beam clusters over an Earth-fixed cell grid
  const zw = 560, zh = 340;
  const zSpanKm = (nstr + 0.2) * spacing;
  const trks = Array.from({ length: nstr }, (_, i) => i - (nstr - 1) / 2);
  const zk = zw / zSpanKm;
  const zHKm = zh / zk;
  const beamR = Math.max(2.35 * zk, 1.1);
  const patchPx = rServe * zk;
  const zoff = (t * 7.3 * zspd) % spacing;
  const PAL = ["#FFB04C", "#5BA8FF", "#C79BFF", "#6BDB8F", "#FF9ECF", "#4DD0E1"];
  const zsats = [];
  trks.forEach((tr, ti) => {
    const phase = ti % 2 ? spacing / 2 : 0;
    for (let n = -1; n * spacing <= zHKm + 2 * spacing; n++) {
      const yKm = ((n * spacing + phase + zoff) % (zHKm + 2 * spacing)) - spacing;
      zsats.push([zw / 2 + tr * spacing * zk, yKm * zk]);
    }
  });
  const beams = [];
  const hopN = Math.floor(t * 1.5); // discrete dwell intervals
  // Fixed sunflower lattice of cell sites tiles each patch evenly; hopping = a sliding subset of sites is lit.
  // Consecutive sunflower indices are themselves evenly spread, so the lit set stays uniform at every instant,
  // and shifting the window a few steps per hop swaps only a few beams — churn without chaos.
  const NPOS = Math.max(nb * 3, 60);
  const GA = 2.39996;
  zsats.forEach(([zx, zy], si) => {
    for (let m = 0; m < nb; m++) {
      const j = (hopN * 7 + si * 13 + m) % NPOS;
      const rr = patchPx * 0.95 * Math.sqrt((j + 0.5) / NPOS);
      const a = j * GA;
      beams.push([zx + rr * Math.cos(a), zy + rr * Math.sin(a), si]);
    }

  const gapXs = nstr > 1
    ? trks.slice(0, -1).map((tr) => zw / 2 + (tr + 0.5) * spacing * zk)
    : [zw / 2 - 0.38 * spacing * zk, zw / 2 + 0.38 * spacing * zk];
  const phones = Array.from({ length: nph }, (_, pi) => {
    const gx = gapXs[pi % gapXs.length];
    const wob = ((((pi * 47) % 5) - 2) * 0.07) * spacing * zk; // fixed wobble, stays well clear of tracks
    const pxy = [gx + wob, zh * (0.12 + 0.76 * ((pi * 0.618) % 1))];
    let bsat = 0, bd = 1e9;
    zsats.forEach(([zx, zy], si) => { const dd = Math.hypot(zx - pxy[0], zy - pxy[1]); if (dd < bd) { bd = dd; bsat = si; } });
    const sched = ((pi * 53 + hopN * 29 + bsat * 7) % 10) < 7; // scheduled dwell ~70% of hop intervals
    const jx = (((pi * 31 + hopN * 13) % 9) - 4) * 3.2, jy = (((pi * 17 + hopN * 19) % 9) - 4) * 3.2;
    return { pxy, serving: bsat, lit: sched, hitPos: sched ? [pxy[0] + jx, pxy[1] + jy] : null, pi };
  });
  const litCount = phones.filter((p) => p.lit).length;
  return (
    <div className="card" style={{ borderTop: `2px solid ${C.green}` }}>
      <div className="eyebrow" style={{ color: C.green }}>Panel 6 · The stitching — satellite adjacency over the US as the fleet grows <Src k="fleet" topic="derived" /></div>
      <p className="body" style={{ marginBottom: 10 }}>
        Every cell is served by whichever satellite sees it steepest, so the ground is partitioned into per-satellite
        service patches whose size is set purely by fleet count. At US latitudes two families of ~53°-inclined tracks
        cross everywhere — ascending passes heading northeast, descending passes heading southeast, interleaved across
        the whole map — at ~7.3 km/s ground speed. Grow the fleet and each patch shrinks, retiring the low-elevation
        elliptical beams from service: the channel path narrows.
      </p>
      <div className="tglRow" style={{ alignItems: "center", marginBottom: 6 }}>
        <label className="sliderL" style={{ flex: 2, minWidth: 260 }}>
          D2C fleet (global): <strong>{fleet.toLocaleString()}</strong> — ~{satsUS.toFixed(0)} over CONUS at any instant
          <input type="range" min="650" max="15000" step="50" value={fleet} onChange={(e) => setFleet(+e.target.value)} />
        </label>
        <label className="sliderL" style={{ flex: 1, minWidth: 180 }}>
          Time speed: <strong>{spd === 0 ? "paused" : "×" + spd}</strong>
          <input type="range" min="0" max="300" step="10" value={spd} onChange={(e) => setSpd(+e.target.value)} />
        </label>
      </div>
      <svg viewBox="0 0 900 505" style={{ width: "100%", display: "block" }} role="img" aria-label="Continental US with two interleaved families of moving serving satellites and their service patches">
        <defs><clipPath id="usClip"><path d={CONUS} transform={`translate(${ox},${oy}) scale(${kpx})`} /></clipPath></defs>
        <path d={CONUS} transform={`translate(${ox},${oy}) scale(${kpx})`} fill="rgba(91,168,255,0.05)" stroke={C.line} strokeWidth={1.2 / kpx} vectorEffect="non-scaling-stroke" />
        <g clipPath="url(#usClip)">
          {sats.map(([sx, sy, fi], i) => (
            <g key={i} transform={`translate(${ox + sx * kpx},${oy + sy * kpx})`}>
              <circle r={rServe * kpx} fill="none" stroke={FAMS[fi].col} strokeWidth="0.7" opacity="0.35" />
              <circle r="2" fill={FAMS[fi].col} opacity="0.9" />
            </g>
          ))}
        </g>
        <text x="450" y="498" textAnchor="middle" fill={C.dim} fontSize="9.5" fontFamily="var(--mono)">
          Natural Earth CONUS boundary · blue = NE-bound (ascending) · green = SE-bound (descending) · both families cover the whole map · patches ~{Math.round(2 * rServe).toLocaleString()} km
        </text>
      </svg>
      <p className="body" style={{ fontSize: 13, marginTop: 14, marginBottom: 6 }}>
        <strong style={{ color: C.green }}>Zoom — the strip machine:</strong> {nstr} adjacent descending {nstr > 1 ? "strips" : "strip"}, face-on.
        Each satellite streams down its strip carrying its spot-beam cluster (beams to scale, a slider-set sample of the
        ~700 — slide it up and watch the patch saturate); each satellite's beams wear its color, so a phone's link
        visibly changes color at handover. The dotted grid is Earth-fixed cells; the scheduler assigns one of the
        serving satellite's beams to each active phone's cell most cycles — that beam is shown <em>highlighted</em>
        (double ring, off-centerline, wherever the phone is), the solid line links phone → assigned beam, and a thin tie

      </p>
      <div className="tglRow" style={{ alignItems: "center", marginBottom: 6 }}>
        <label className="sliderL" style={{ flex: 1, minWidth: 150 }}>

        </label>
        <label className="sliderL" style={{ flex: 1, minWidth: 150 }}>

          <input type="range" min="19" max="100" step="1" value={nb} onChange={(e) => setNb(+e.target.value)} />
        </label>
        <label className="sliderL" style={{ flex: 1, minWidth: 140 }}>
          Phones: <strong>{nph}</strong> · lit {litCount}/{nph}
          <input type="range" min="1" max="10" step="1" value={nph} onChange={(e) => setNph(+e.target.value)} />
        </label>
        <label className="sliderL" style={{ flex: 1, minWidth: 120 }}>
          Strips: <strong>{nstr}</strong>
          <input type="range" min="1" max="5" step="1" value={nstr} onChange={(e) => setNstr(+e.target.value)} />
        </label>
      </div>
      <div className="split" style={{ alignItems: "start" }}>
        <svg viewBox={`0 0 ${zw} ${zh}`} style={{ width: "100%", display: "block", background: C.panel2, borderRadius: 8 }} role="img" aria-label="Zoomed strips with moving satellites casting color-coded spot-beam clusters over an Earth-fixed cell grid, with phones handing over between satellites">
          {Array.from({ length: Math.ceil(zw / 18) }, (_, i) => <line key={"v" + i} x1={i * 18} y1="0" x2={i * 18} y2={zh} stroke={C.line} strokeWidth="0.4" opacity="0.5" />)}
          {Array.from({ length: Math.ceil(zh / 18) }, (_, i) => <line key={"h" + i} x1="0" y1={i * 18} x2={zw} y2={i * 18} stroke={C.line} strokeWidth="0.4" opacity="0.5" />)}
          {trks.map((tr) => <line key={tr} x1={zw / 2 + tr * spacing * zk} y1="0" x2={zw / 2 + tr * spacing * zk} y2={zh} stroke={C.dim} strokeDasharray="2 6" opacity="0.6" />)}
          {zsats.map(([zx, zy], i) => <circle key={"p" + i} cx={zx} cy={zy} r={patchPx} fill="none" stroke={PAL[i % PAL.length]} strokeWidth="0.7" opacity="0.35" />)}
          {beams.map(([bx, by, si], i) => <circle key={"b" + i} cx={bx} cy={by} r={beamR} fill={PAL[si % PAL.length]} opacity="0.7" />)}
          {zsats.map(([zx, zy], i) => <circle key={"s" + i} cx={zx} cy={zy} r="3.5" fill={PAL[i % PAL.length]} stroke="#0B1322" strokeWidth="1" />)}
          {phones.map((p) => {
            const scol = PAL[p.serving % PAL.length];
            const sp = zsats[p.serving];
            return (
              <g key={p.pi}>
                {p.lit && p.hitPos && sp && (
                  <g>
                    {/* thin tie: assigned beam back to its satellite (keeps the center trackable) */}
                    <line x1={p.hitPos[0]} y1={p.hitPos[1]} x2={sp[0]} y2={sp[1]} stroke={scol} strokeWidth="0.8" opacity="0.45" />
                    {/* solid link: phone to its assigned beam */}
                    <line x1={p.pxy[0]} y1={p.pxy[1]} x2={p.hitPos[0]} y2={p.hitPos[1]} stroke={scol} strokeWidth="1.7" />
                    {/* the assigned beam, highlighted: filled + double ring */}
                    <circle cx={p.hitPos[0]} cy={p.hitPos[1]} r={beamR + 1} fill={scol} opacity="0.95" />
                    <circle cx={p.hitPos[0]} cy={p.hitPos[1]} r={beamR + 4} fill="none" stroke={scol} strokeWidth="1.4" opacity="0.85" />
                    <circle cx={p.hitPos[0]} cy={p.hitPos[1]} r={beamR + 7.5} fill="none" stroke={scol} strokeWidth="0.8" opacity="0.4" />
                  </g>
                )}

                <rect x={p.pxy[0] - 5} y={p.pxy[1] - 8} width="10" height="16" rx="2" fill={p.lit ? scol : "none"} fillOpacity="0.4" stroke={p.lit ? scol : C.dim} strokeWidth="1.5" />

              </g>
            );
          })}
          <text x="8" y="16" fill={C.dim} fontSize="8.5" fontFamily="var(--mono)">dotted grid = Earth-fixed cells (schematic) · beams colored by satellite · ▼ travel</text>
        </svg>
        <div>
          <div className="stat"><div className="statL">Satellite spacing</div><div className="statV">~{Math.round(spacing).toLocaleString()} km</div></div>
          <div className="stat" style={{ marginTop: 8 }}><div className="statL">Serving elevation — typical vs guaranteed</div>
            <div className="statV" style={{ color: tone }}>typical ~{Math.max(eEdge, 25).toFixed(0)}° <span style={{ color: C.dim, fontSize: 11 }}>(ideal lattice, patch edge)</span></div>
            <div className="statV" style={{ fontSize: 13, marginTop: 2 }}>guaranteed ~{Math.max(guarE, 25).toFixed(0)}° <span style={{ color: C.dim, fontSize: 11 }}>(Panel 1's calibrated floor — everywhere, always)</span></div>
          </div>
          <div className="stat" style={{ marginTop: 8 }}><div className="statL">Beam positions per patch vs ~700 available</div><div className="statV">~{Math.round(beamsNeeded).toLocaleString()} → duty ~{duty < 10 ? duty.toFixed(1) : duty.toFixed(0)}%</div></div>
          <div className="stat" style={{ marginTop: 8 }}><div className="statL">US aggregate (claim-anchored ceiling)</div><div className="statV" style={{ color: C.amber }}>~{usCapGbps >= 1000 ? (usCapGbps / 1000).toFixed(1) + " Tbps" : Math.round(usCapGbps) + " Gbps"}</div></div>
        </div>
      </div>
      <Info label="why this panel and Panel 1 quote different elevations for the same fleet">
        They answer different questions, and together they bracket reality. Panel 1 asks: how many satellites
        <em> guarantee</em> that every point, at every instant, has a satellite above the mask — using a 3.3× overlap
        factor calibrated to the real fleet (650 satellites ≈ continuous 25°), which bakes in genuine constellation
        waste: inclination bunching, imperfect phasing, the bad moments. This panel asks: in an idealized perfect hex
        lattice (with 1.3× mid-latitude crowding), how steep is the <em>typical</em> patch edge — zero waste assumed.
        Divide the two models' implied service areas and the entire gap is ~3.3 ÷ 1.3: at 5,000 satellites, typical
        serving elevation ≈ 57° while the guaranteed-everywhere floor ≈ 43°. Your phone usually lives near the first
        number and occasionally visits the second — which is exactly the variance story Panel 5's sawtooth animates.
        Neither number is wrong; quoting either alone would be.
      </Info>
      <Info label="what exactly am I looking at in the strip view?">
        A face-on window of ground about three satellite-spacings wide. The dashed vertical lines are adjacent orbital
        strips (descending family, face-on). Each large faint circle is a passing satellite's <strong>assigned service
        share</strong> — <em>not</em> its total reach: the satellite's physical footprint is ~1,200 km across (Panel 1's amber circle — its <em>reach</em>), but with
        neighbors present it only serves the patch where it is the steepest option, and the fleet slider sets that
        share's size. The colored dots inside a share are a <strong>sample of the spot beams that satellite is pointing
        this instant</strong> (beams drawn to scale; the count slider sets the sample). Beam sites form a fixed, evenly
        spaced lattice of cells across the share; each dwell interval a <em>different subset</em> of sites lights up —
        a few beams switch per hop while the rest hold — so coverage stays even while the pattern churns calmly rather
        than sweeping or teleporting. The dotted grid
        is Earth-fixed cells. Phones sit in the gaps between strips — the genuinely contested ground. Beams come to phones, not the other way
        around: most cycles the scheduler assigns one of the serving satellite's beams to the phone's own cell — drawn
        highlighted with a double ring, off-centerline wherever the phone sits — with the solid line linking phone to
        that beam and a thin tie linking the beam back to its satellite; between dwells a dim dashed line marks the
        satellite responsible while the phone idles on the paging schedule. Handover = the colors change.
      </Info>
      <p className="body" style={{ fontSize: 12, color: C.dim, marginTop: 10 }}>
        Model (derived, schematic): CONUS boundary from Natural Earth (public domain), equirectangular at 38°N; two
        interleaved hex lattices (ascending + descending families) netting the fleet's density, ×1.3 mid-latitude
        crowding for 53° planes; patch-edge elevation from spherical geometry at 330 km; duty = ~700 available beams ÷
        positions to cover — even at 15,000 satellites it's ~3:1, which is why the zoom's phones blink between lit and
        between-dwells: Earth-fixed cells and hopping schedules exist at every fleet size. Handover cadence at real
        speed: every ~1–2 minutes at 15,000 satellites, ~2–3 at 650. US capacity = satellites over CONUS × beams ×
        50 Mbps claim-anchored — a ceiling, not a forecast. Fleet growth doesn't just add capacity — it deletes the bad
        geometry.
      </p>
    </div>
  );
}

        the correction is exact only at the <em>beam center</em>. Off-center phones see residual frequency error, and the
        waveform tolerates only so much: the beam's usable width is capped by physics. An NTN phone (Rel-17+, Rel-19 /

      </div>
      <svg viewBox="0 0 900 200" style={{ width: "100%", display: "block" }} role="img" aria-label="Residual Doppler across the beam for legacy versus NTN handsets">

        <rect x={X(-usableHalf * 100)} y="24" width={X(usableHalf * 100) - X(-usableHalf * 100)} height="150"

        {/* tolerance band */}
        <rect x="70" y={Y(tol)} width="760" height={Y(-tol) - Y(tol)} fill="rgba(107,219,143,0.08)" />

        <line x1="70" y1={Y(-tol)} x2="830" y2={Y(-tol)} stroke={C.green} strokeWidth="0.8" strokeDasharray="4 4" />
        <text x="76" y={Y(tol) - 5} fill={C.green} fontSize="9.5" fontFamily="var(--mono)">waveform tolerance ±{tol} kHz (illustrative)</text>

      <Info label="Rel-17 vs Rel-18 vs Rel-19 — are they the same thing?">
        No — they're successive versions of the global cellular standard (3GPP numbers its releases like software), each
        frozen roughly two years apart, and they do different jobs here. <strong>Rel-17 (2022) is the foundation:</strong>
        the first release where phones learn satellites exist at all. It puts the satellite's orbital position (ephemeris)
        into the broadcast channel, lets a GPS-equipped phone pre-correct its own timing and Doppler, stretches protocol
        timers to survive orbital delays, and adapts the connection procedures. Everything the flat blue line above shows
        is Rel-17 machinery. <strong>Rel-18 (2024) refines:</strong> smoother handover between satellite and ground
        networks, network-verified device location, coverage tweaks. <strong>Rel-19 (2025–26) is the maturity release
        SpaceX built its 5G system around:</strong> support for regenerative payloads (the base station lives on the
        satellite — Starlink's architecture), uplink capacity enhancements aimed at exactly the starved direction, and the
        band/feature package that makes n252 practical in a consumer modem. Qualcomm's X105 is the first Rel-19 NTN
        modem — which is why that part number keeps appearing. Shorthand: Rel-17 makes the phone satellite-aware;
        Rel-19 makes satellite service worth building a business on.
      </Info>
      <Info label="what actually goes wrong past the tolerance line?">
        Modern cellular carries data on hundreds of narrow sub-channels spaced 15 kHz apart, packed so tightly they only
        avoid interfering because each is read at the exact instant its neighbors cancel to zero — a property that exists
        only at precisely the right frequency. Drift off, and failure arrives as a ladder. <em>Small offset:</em> the
        sub-channels leak into each other, raising the noise floor; the link quietly downshifts to slower, more protected
        transmission — throughput sags before anything visibly breaks. <em>Larger offset:</em> the phone's channel
        tracking loses lock, errors spike, and the airtime fills with retransmissions — a trickle of repeats instead of
        data. <em>The uplink catastrophe:</em> many phones share each received uplink symbol, so one off-frequency phone
        smears across its <strong>neighbors'</strong> sub-channels — it degrades everyone in the beam, not just itself.
        That's why the standard demands a phone transmit within ±0.1 ppm of the downlink it hears (~±200 Hz at 2 GHz) —
        and the cruel twist for satellites: the phone <em>copies</em> its transmit frequency from what it receives, so any
        residual Doppler the satellite didn't cancel gets inherited by the uplink and then Doppler-shifted again on the
        way up, roughly doubling. <em>Beyond sync range:</em> the phone's connection attempts miss their detection windows
        entirely — bars on screen, no service. Timing has a parallel ladder: each symbol carries only ~4.7 µs of guard
        time; residual delay error beyond it makes symbols smear into each other with the same collapse.
      </Info>
      <Info label="unpack 'efficiency' — where does the capacity actually come from?">
        Serving satellite-unaware phones forces the network into permanent defensive posture, and every defense costs
        capacity. <em>Retransmission stalls:</em> LTE expects acknowledgment of each packet within ~4 ms; the orbital
        round trip is several times that, so the pipeline stalls — or the network resorts to blind repetition,
        transmitting everything 2–4× preemptively, which is pure spectral waste. NTN phones support stretched scheduling
        and more parallel processes, keeping the pipeline full without insurance copies. <em>Access waste:</em> a phone
        with unknown timing misses the connection window and retries at escalating power — battery drain, interference,
        delay; an NTN phone using GPS + ephemeris nails it first try. <em>Permanent margins:</em> when the scheduler can't
        trust each phone's frequency and timing, it pads guard periods and backs off data rates for the entire cell, all
        the time; removing the residuals lets it run near the channel's true limit. Add those up across a beam and
        "efficiency" stops being abstract: the same satellite, same spectrum, same power carries meaningfully more
        traffic — because the endpoints stopped requiring insurance.
      </Info>

          ~43–48 beams rest on two converging secondary sources (AIAA; payload teardown reporting) — no SpaceX primary
          discloses either generation's count, so the ~700-class 2027 figure is honest arithmetic on claims, not a spec. The V3 tab is deliberate context: swap the fingernail
          phone antenna for a powered, steered dish and the same physics yields thousands of times more throughput —
          which is why V3 carries no phone radio and doesn't need one; it backhauls the femtocell layer while phone
          capacity scales on the dedicated D2C line. D2C is a payload and a product line — not a V-number.
        </p>
      </div>

      <div className="card">
        <div className="eyebrow">How big is a spot beam? — the 60-second version</div>
        <p className="body">
          A phased array's beamwidth follows one rule: <span style={{ fontFamily: "var(--mono)", color: C.amber }}>beam angle ≈ wavelength ÷ antenna width</span>.
          At ~2 GHz the wavelength is ~15 cm, and today's ~25 m² array (~5 m across) yields a ~2° beam — a footprint of
          roughly <strong>20–50 km</strong> on the ground from 550 km, wider toward the edges of coverage. The 2027 dedicated D2C
          satellites shrink that two ways at once: arrays ~5× the area (~2.2× wider, so a ~2.2× narrower beam) flying at
          lower altitude (326–335 km), landing footprints around <strong style={{ color: C.amber }}>5–10 km at nadir</strong> — a ~25×
          smaller patch of ground per beam. That shrink <em>is</em> the capacity gain: ~25× fewer people share each 20 MHz
          channel, and 16× more beams can tile the same region re-using the same 65 MHz. (These are physics-derived
          estimates, not published specs — and the λ/D rule is also why nobody gets sub-km phone beams at 2 GHz from
          orbit without a hundred-meter antenna. AST's ~223 m² arrays buy beams only ~2× tighter than SpaceX's next-gen.)
          One more layer: digital arrays don't hold fixed beams — they <strong>hop</strong>, re-pointing hundreds of simultaneous
          beams among thousands of possible positions so capacity dwells where phones actually are and skips empty land.
          Beam counts you see quoted anywhere are derived assumptions; SpaceX discloses power envelopes, not beam inventories.
        </p>
      </div>

      <div className="card">
        <div className="eyebrow">The engineering artifacts under management — every one must hold at scale</div>

}

        .infoBtn { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; color: ${C.blue};
          background: none; border: none; border-bottom: 1px dashed rgba(91,168,255,0.5); padding: 2px 0; cursor: pointer; }
        .infoBtn:hover { border-bottom-style: solid; }
        .infoBtn.on { color: ${C.dim}; }
        .infoBox { display: block; margin-top: 8px; background: ${C.panel2}; border-left: 2px solid ${C.blue};
          border-radius: 0 6px 6px 0; padding: 12px 16px; font-size: 13px; line-height: 1.65; color: #C7D1E2; }
        .infoBox strong { color: ${C.text}; }
        .srcWrap { display: inline-block; margin-left: 10px; vertical-align: middle; }
        .srcChip { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; color: #C79BFF;
          background: rgba(199,155,255,0.08); border: 1px solid rgba(199,155,255,0.35); border-radius: 4px;
          padding: 2px 7px; cursor: pointer; }
        .srcChip:hover { border-color: #C79BFF; }
        .srcChip.on { color: ${C.dim}; border-color: ${C.line}; background: none; }
        .srcPop { display: block; margin-top: 8px; background: ${C.panel2}; border-left: 2px solid #C79BFF;
          border-radius: 0 6px 6px 0; padding: 8px 12px; font-family: var(--disp); }
        .srcItem { display: block; font-size: 12px; color: #C7D1E2; text-decoration: none; padding: 4px 0;
          border-bottom: 1px solid ${C.line}; }
        .srcItem:last-of-type { border-bottom: none; }
        .srcItem:hover { color: ${C.text}; }
        .sb { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; }
        .sb.primary { background: #C79BFF; }
        .sb.claim { background: ${C.amber}; }
        .sb.derived { background: ${C.blue}; }
        .sk { font-family: var(--mono); font-size: 9px; color: ${C.dim}; margin-left: 8px; font-style: normal; }
        .srcAllLink { display: block; margin-top: 6px; font-family: var(--mono); font-size: 10.5px; color: #C79BFF; text-decoration: none; }
        .feasBox { background: ${C.panel2}; border: 1px solid ${C.line}; border-left: 2px solid ${C.green};
          border-radius: 0 6px 6px 0; padding: 8px 14px; margin-bottom: 12px; }
        .feasYear { display: block; font-family: var(--mono); font-size: 12px; color: ${C.green}; margin-bottom: 4px; }
        .feasGate { display: block; font-size: 11.5px; color: ${C.dim}; line-height: 1.55; padding: 1px 0; }
        .feasGate em { font-family: var(--mono); font-style: normal; color: #C7D1E2; margin-right: 6px; }
        @media (max-width: 900px) { .genGrid { grid-template-columns: 1fr; } }
        .specRow { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
          border-bottom: 1px solid ${C.line}; font-size: 12.5px; }
        .specRow:last-of-type { border-bottom: none; }
        .specL { color: ${C.dim}; font-family: var(--mono); font-size: 11px; flex: none; padding-top: 1px; }
        .specV { color: #C7D1E2; text-align: right; line-height: 1.45; }
        .benchGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 700px) { .benchGrid { grid-template-columns: 1fr; } }
        .bench { background: ${C.panel2}; border: 1px solid ${C.line}; border-radius: 6px; padding: 13px; }
        .benchT { font-size: 13.5px; font-weight: 600; margin-bottom: 5px; }
        .benchW { font-size: 12.5px; color: ${C.dim}; line-height: 1.55; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
      `}</style>

      <header className="hdr">
        <div className="kicker">Starlink Mobile · Interactive Roadmap · Data as of Aug 2026</div>
        <h1 className="title">From texts in a field to a <em>fourth carrier</em></h1>
        <p className="sub">
          How SpaceX plans to turn 65 MHz of EchoStar spectrum, a 5G constellation, and millions of rooftop dishes
          into a phone service — phase by phase, with the physics, the mode-switch, the configuration lab, and the
          skeptics included.
        </p>
        <a className="srcA" href="sources.html">Sources &amp; citations →</a>
        <span className="buildTag">build v50 · fixed cell-sites, sliding lit subset</span>
      </header>

      <nav className="tabs wrap" role="tablist">
        {TABS.map((t) => (
          <button key={t.id} role="tab" aria-selected={tab === t.id}
            className={"tab" + (tab === t.id ? " on" : "")} onClick={() => setTab(t.id)}>
            {t.label}
          </button>
        ))}
      </nav>

      <main className="wrap">
        {tab === "story" && <StoryTab phase={phase} setPhase={setPhase} />}
        {tab === "spectrum" && <SpectrumTab cfg={cfg} setCfg={setCfg} />}
        {tab === "physics" && <PhysicsTab cfg={cfg} setCfg={setCfg} />}
        {tab === "coverage" && <CoverageTab />}
        {tab === "tech" && <TechTab />}
        {tab === "network" && <NetworkTab />}
        {tab === "reg" && <RegTab />}
        {tab === "verdict" && <VerdictTab />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<StarlinkMobileRoadmap />);
</script>
