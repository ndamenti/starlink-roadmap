const DENS_CELLS = (() => {
  const cells = [];
  for (let i = 0; i < US_DENS.w * US_DENS.h; i++) {
    const v = parseInt(US_DENS.hex.slice(i * 2, i * 2 + 2), 16);
    if (v === 255) continue;
    const d = Math.pow(10, (v / 254) * 6.5 - 2); // people per km²
    const si = parseInt(US_SIDX.slice(i * 2, i * 2 + 2), 16);
    const mi = parseInt(US_MIDX.slice(i * 2, i * 2 + 2), 16);
    cells.push({ gx: i % US_DENS.w, gy: Math.floor(i / US_DENS.w), d, si: si === 255 ? -1 : si, mi: mi === 255 ? -1 : mi });
  }
  return cells;
})();


/* ============================================================
   TIER MODEL (v93) — canonical density segmentation + demand
   Boundaries are area-density brackets measured on US_DENS (40 km raster).
   Two densities per tier, deliberately:
     dArea  = raster area-mean (drives land + population totals)
     dLocal = built-up/local density (drives demand per km² and equipment counts)
   Their ratio is the clustering factor: a 1,600 km² raster square holding a
   suburb plus its farmland reads ~106/km² while the suburb itself is ~500/km².
   dLocal + take are inherited from the v91 SETTLE array (unchanged defaults).
   Every field here is a DEFAULT — the Tier Lab panel edits all of them live.
   ============================================================ */
const TIERS = [
  { k: "vrural", n: "Very rural",     lo: 0,    hi: 5,     dLocal: 2,      take: 0.25 },
  { k: "rural",  n: "Rural",          lo: 5,    hi: 50,    dLocal: 10,     take: 0.20 },
  { k: "sub",    n: "Suburban",       lo: 50,   hi: 200,   dLocal: 500,    take: 0.05 },
  { k: "dsub",   n: "Dense suburban", lo: 200,  hi: 800,   dLocal: 1500,   take: 0.03 },
  { k: "urban",  n: "Urban",          lo: 800,  hi: 3000,  dLocal: 4000,   take: 0.02 },
  { k: "durban", n: "Dense urban",    lo: 3000, hi: 1e9,   dLocal: 10000,  take: 0.01 },
];

// Land + population per tier, measured from the raster at load (not hardcoded).
const TIER_GEO = (() => {
  const A = US_DENS.cell * US_DENS.cell;
  return TIERS.map((t) => {
    const sel = DENS_CELLS.filter((c) => c.d >= t.lo && c.d < t.hi);
    const land = sel.length * A;
    const pop = sel.reduce((a, c) => a + c.d * A, 0);
    return { land, pop, dArea: land > 0 ? pop / land : 0 };
  });
})();

// Global demand assumptions (defaults; all editable in the Tier Lab).
const DEMAND0 = {
  act: 10,      // % of subscribers simultaneously active in the busy hour
  dlU: 3.0,     // Mbps per active user, downlink
  ulU: 0.4,     // Mbps per active user, uplink (~8:1 consumer mobile asymmetry)
  ulEff: 0.8,   // bps/Hz uplink — derived-from-design: 40/15 MHz split matches 8:1
};                //   traffic only if UL runs ~1/3 of DL's 2.48. Bracket 0.6–1.0.

const TIER_SCEN = {
  canonical: { lbl: "Canonical", take: 1.0, act: 1.0 },
  bull:      { lbl: "Bull — 1.5× take", take: 1.5, act: 1.0 },
  bear:      { lbl: "Bear — 0.5× take", take: 0.5, act: 1.0 },
  peak:      { lbl: "Peak hour — 2× active", take: 1.0, act: 2.0 },
};

function TierLab({ rows, setRows, g, setG, scen, setScen }) {

  const applyScen = (key) => {
    const s = TIER_SCEN[key];
    setScen(key);
    setRows(TIERS.map((t) => ({ dLocal: t.dLocal, take: Math.min(100, t.take * 100 * s.take) })));
    setG({ ...DEMAND0, act: DEMAND0.act * s.act });
  };
  const setRow = (i, field, v) => {
    setRows((r) => r.map((x, j) => (j === i ? { ...x, [field]: v } : x)));
    setScen("custom");
  };

  const calc = TIERS.map((t, i) => {
    const r = rows[i], geo = TIER_GEO[i];
    const take = r.take / 100;
    const subsKm2 = r.dLocal * take;
    const actKm2 = subsKm2 * (g.act / 100);
    const dl = actKm2 * g.dlU, ul = actKm2 * g.ulU;
    const subs = geo.pop * take;
    return { ...t, ...geo, take, subsKm2, actKm2, dl, ul, subs,
      gdl: (subs * (g.act / 100) * g.dlU) / 1000, gul: (subs * (g.act / 100) * g.ulU) / 1000 };
  });
  const tot = calc.reduce((a, c) => ({ subs: a.subs + c.subs, gdl: a.gdl + c.gdl, gul: a.gul + c.gul,
    pop: a.pop + c.pop, land: a.land + c.land }), { subs: 0, gdl: 0, gul: 0, pop: 0, land: 0 });

  const beamDL = 40 * 2.48, beamUL = 15 * g.ulEff;
  const num = (v, d = 0) => v.toLocaleString(undefined, { maximumFractionDigits: d });
  const cellS = { padding: "3px 6px", borderBottom: `1px solid ${C.line}`, fontFamily: "var(--mono)", fontSize: 11 };
  const inS = { width: 62, background: "transparent", color: C.text, border: `1px solid ${C.line}`,
    borderRadius: 3, padding: "1px 4px", fontFamily: "var(--mono)", fontSize: 11 };

  return (
    <div className="card" style={{ borderTop: `2px solid ${C.blue}` }}>
      <div className="eyebrow" style={{ color: C.blue }}>
        Tier Lab — density segmentation and demand, every input adjustable <Src k="serve" topic="derived" />
      </div>
      <p className="body" style={{ fontSize: 13 }}>
        Six density tiers, boundaries measured on the same 40 km census raster the Serviceability map uses.
        Each tier carries <em>two</em> densities on purpose: the raster's area-mean sets how much land and how many
        people the tier holds; the local built-up density sets what a beam or a base station actually sees. Their
        ratio — the clustering factor — runs {(TIER_GEO[2].dArea > 0 ? TIERS[2].dLocal / TIER_GEO[2].dArea : 0).toFixed(1)}× through the middle tiers, and conflating the two is the
        commonest way this kind of model goes wrong. Demand = local density × take × busy-hour activity × per-user rate,
        uplink and downlink kept separate throughout.
      </p>

      <div className="tglRow" style={{ gap: 5, flexWrap: "wrap", marginBottom: 8 }}>
        {Object.entries(TIER_SCEN).map(([k, s]) => (
          <button key={k} className={"genBtn" + (scen === k ? " on" : "")} onClick={() => applyScen(k)}>{s.lbl}</button>
        ))}
        {scen === "custom" && <span style={{ fontFamily: "var(--mono)", fontSize: 10, color: C.amber, alignSelf: "center" }}>CUSTOM — edited</span>}
      </div>

      <div className="split2" style={{ gap: 12 }}>
        <label className="sliderL">
          Busy-hour active: <strong>{g.act.toFixed(0)}%</strong> <span style={{ color: C.dim }}>({(100 / g.act).toFixed(0)}:1 oversubscription)</span>
          <input type="range" min="2" max="40" step="1" value={g.act} onChange={(e) => { setG({ ...g, act: +e.target.value }); setScen("custom"); }} />
        </label>
        <label className="sliderL">
          Per-user DL: <strong>{g.dlU.toFixed(1)}</strong> Mbps · UL: <strong>{g.ulU.toFixed(2)}</strong>{" "}
          <span style={{ color: C.dim }}>({(g.dlU / g.ulU).toFixed(1)}:1 traffic asymmetry)</span>
          <input type="range" min="0.5" max="15" step="0.5" value={g.dlU}
            onChange={(e) => { const d = +e.target.value; setG({ ...g, dlU: d, ulU: +(d / (DEMAND0.dlU / DEMAND0.ulU)).toFixed(2) }); setScen("custom"); }} />
        </label>
      </div>

      <div style={{ overflowX: "auto", marginTop: 8 }}>
        <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 640 }}>
          <thead>
            <tr style={{ color: C.dim, fontFamily: "var(--mono)", fontSize: 10, textAlign: "right" }}>
              <th style={{ ...cellS, textAlign: "left" }}>TIER</th>
              <th style={cellS}>ppl/km² RANGE</th>
              <th style={cellS}>AREA MEAN</th>
              <th style={cellS}>LOCAL ✎</th>
              <th style={cellS}>TAKE % ✎</th>
              <th style={cellS}>SUBS/km²</th>
              <th style={{ ...cellS, color: C.amber }}>DL Mbps/km²</th>
              <th style={{ ...cellS, color: C.green }}>UL Mbps/km²</th>
              <th style={cellS}>SUBS</th>
            </tr>
          </thead>
          <tbody>
            {calc.map((c, i) => (
              <tr key={c.k} style={{ textAlign: "right" }}>
                <td style={{ ...cellS, textAlign: "left", color: C.text }}>{c.n}</td>
                <td style={{ ...cellS, color: C.dim }}>{c.lo}–{c.hi > 1e8 ? "∞" : c.hi}</td>
                <td style={{ ...cellS, color: C.dim }}>{num(c.dArea, 1)}</td>
                <td style={cellS}><input type="number" style={inS} value={rows[i].dLocal}
                  onChange={(e) => setRow(i, "dLocal", Math.max(0, +e.target.value))} /></td>
                <td style={cellS}><input type="number" style={inS} step="0.5" value={rows[i].take}
                  onChange={(e) => setRow(i, "take", Math.max(0, Math.min(100, +e.target.value)))} /></td>
                <td style={cellS}>{num(c.subsKm2, 1)}</td>
                <td style={{ ...cellS, color: C.amber }}>{num(c.dl, 2)}</td>
                <td style={{ ...cellS, color: C.green }}>{num(c.ul, 2)}</td>
                <td style={cellS}>{(c.subs / 1e6).toFixed(2)}M</td>
              </tr>
            ))}
            <tr style={{ textAlign: "right", fontWeight: 700 }}>
              <td style={{ ...cellS, textAlign: "left" }}>TOTAL</td>
              <td style={cellS} colSpan={4}></td>
              <td style={cellS}></td>
              <td style={{ ...cellS, color: C.amber }}>{num(tot.gdl, 0)} Gbps</td>
              <td style={{ ...cellS, color: C.green }}>{num(tot.gul, 0)} Gbps</td>
              <td style={cellS}>{(tot.subs / 1e6).toFixed(1)}M</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div className="statGrid" style={{ marginTop: 8 }}>
        <div className="stat" style={{ borderColor: C.amber }}>
          <div className="statL">Where the subscribers are</div>
          <div className="statV" style={{ fontSize: 20, color: C.amber }}>
            {((calc[0].subs + calc[1].subs) / tot.subs * 100).toFixed(0)}%<span style={{ fontSize: 12, color: C.dim }}> rural + very rural</span>
          </div>
          <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>
            vs {((calc[4].subs + calc[5].subs) / tot.subs * 100).toFixed(1)}% urban + dense urban. Population spans{" "}
            {num(calc[5].dArea / Math.max(calc[0].dArea, 0.01), 0)}× across tiers; subscribers only{" "}
            {num(calc[5].subsKm2 / Math.max(calc[0].subsKm2, 0.01), 0)}× — the take-rate curve is doing that work,
            and it is the single most consequential assumption here.
          </div>
        </div>
        <div className="stat" style={{ borderColor: C.green }}>
          <div className="statL" style={{ color: C.green }}>Uplink spectral efficiency — derived from the spectrum split</div>
          <label className="sliderL" style={{ margin: "2px 0 0" }}>
            <strong>{g.ulEff.toFixed(2)}</strong> bps/Hz
            <input type="range" min="0.4" max="1.4" step="0.05" value={g.ulEff}
              onChange={(e) => { setG({ ...g, ulEff: +e.target.value }); setScen("custom"); }} />
          </label>
          <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>
            40 MHz DL × 2.48 = {beamDL.toFixed(0)} Mbps vs 15 MHz UL × {g.ulEff.toFixed(2)} = {beamUL.toFixed(0)} Mbps
            → <strong style={{ color: beamDL / beamUL > 10 ? C.amber : C.green }}>{(beamDL / beamUL).toFixed(1)}:1</strong> capacity
            against {(g.dlU / g.ulU).toFixed(1)}:1 traffic demand.{" "}
            {Math.abs(beamDL / beamUL - g.dlU / g.ulU) < 1.2
              ? "Balanced — which is why 0.8 is the canonical estimate: SpaceX sized 40/15 for it."
              : beamDL / beamUL > g.dlU / g.ulU ? "Uplink-starved at this efficiency." : "Uplink-rich at this efficiency."}
          </div>
        </div>
      </div>

      <p className="body" style={{ fontSize: 12.5, color: C.dim, marginTop: 8 }}>
        <strong style={{ color: C.text }}>Provenance.</strong> Boundaries: log-spaced, measured on US_DENS — the tiers
        hold {(TIER_GEO[0].land + TIER_GEO[1].land) / (tot.land) * 100 > 0 ? (((TIER_GEO[0].land + TIER_GEO[1].land) / tot.land) * 100).toFixed(0) : 0}% of
        land at the bottom two and {(((TIER_GEO[4].pop + TIER_GEO[5].pop) / tot.pop) * 100).toFixed(0)}% of people at the top two.
        Local densities and take rates inherit the v91 SETTLE defaults. Per-user rates are consumption, not the 3 Mbps
        <em> served</em> threshold the map uses — they are separate inputs on purpose. <strong style={{ color: C.amber }}>Resolution
        limit:</strong> the 40 km raster averages Manhattan with its harbour — only {DENS_CELLS.filter((c) => c.d > 2000).length} squares
        in CONUS exceed 2,000/km², so tiers 1–4 are measured while Urban and Dense urban are sub-grid archetypes
        anchored to their local densities, not painted regions. Their population totals are real; their densities are
        assumptions you can edit above.
      </p>
    </div>
  );
}


/* ============================================================
   GAP LAB (v94) — satellite supply vs tier demand, by environment
   Supply is NOT per-tier: a satellite delivers capacity per unit area and has
   no idea what is underneath it. So there is ONE supply number per environment,
   compared against six demand numbers. Environments change supply, not demand:
   penetration loss lands on a link that only just closes outdoors.
   Derating is first-principles Shannon on a power-limited link. The site's
   2.48 bps/Hz outdoor convention implies SNR = 2^2.48 - 1 = 4.58 -> 6.6 dB.
   Subtract penetration loss in dB, recompute log2(1+SNR); below the decode
   floor the link does not close at all and capacity is zero, not merely small.
   ============================================================ */
const GAP_ENVS = [
  { k: "out", n: "Outdoor",    loss: 0,  note: "clear sky" },
  { k: "veh", n: "In-vehicle", loss: 10, note: "glass + body" },
  { k: "in",  n: "Indoor",     loss: 15, note: "exterior wall" },
];
const SNR0_DB = 10 * Math.log10(Math.pow(2, 2.48) - 1); // 6.6 dB, calibrated to the site's DL efficiency

function GapLab({ rows, g }) {
  const [fleet, setFleet] = useState(15000);
  const [loss, setLoss] = useState(GAP_ENVS.map((e) => e.loss));
  const [floorDb, setFloorDb] = useState(-6);

  const ps = patchStats(fleet);
  const duty = Math.min(1, ps.duty);
  const effFor = (lossDb) => {
    const snrDb = SNR0_DB - lossDb;
    if (snrDb < floorDb) return 0;
    return Math.log2(1 + Math.pow(10, snrDb / 10));
  };
  // per-beam capacity: 20 MHz DL (site convention); UL scaled by SpaceX's own 40/15 split
  const ulMhz = 20 * (15 / 40);
  const supply = GAP_ENVS.map((e, i) => {
    const eff = effFor(loss[i]);
    const effUl = eff * (g.ulEff / 2.48); // uplink runs ~1/3 of downlink efficiency, same derating
    return { dl: 20 * eff * duty, ul: ulMhz * effUl * duty, eff, snr: SNR0_DB - loss[i] };
  });

  const demand = TIERS.map((t, i) => {
    const r = rows[i];
    const act = r.dLocal * (r.take / 100) * (g.act / 100);
    return { n: t.n, k: t.k, dl: act * g.dlU, ul: act * g.ulU };
  });

  const verdict = (dRatio, uRatio) => {
    const w = Math.max(dRatio, uRatio);
    if (!isFinite(w)) return { lbl: "NO LINK", c: "#7A1F2B", t: "#FFB4BE" };
    if (w <= 1) return { lbl: "SERVED", c: "#12351F", t: C.green };
    if (w <= 2) return { lbl: "MARGINAL", c: "#3A3210", t: C.amber };
    return { lbl: "\u00d7" + (w < 10 ? w.toFixed(1) : Math.round(w)), c: "#3A1520", t: "#FF8FA0" };
  };
  const cellS = { padding: "4px 6px", borderBottom: `1px solid ${C.line}`, fontFamily: "var(--mono)", fontSize: 11 };

  return (
    <div className="card" style={{ borderTop: `2px solid ${C.amber}` }}>
      <div className="eyebrow" style={{ color: C.amber }}>
        Gap Lab — one beam vs the demand under it, by tier and environment <Src k="serve" topic="derived" />
      </div>
      <p className="body" style={{ fontSize: 13 }}>
        Supply is not per-tier. A satellite pours capacity onto ground area and has no idea what is underneath, so
        there is <em>one</em> supply number per environment tested against six demand numbers. The unit of the test is a
        single beam \u2014 {(Math.PI * (BEAM_KM / 2) * (BEAM_KM / 2)).toFixed(0)} km\u00b2 at nadir \u2014 and whatever demand sits
        under it. Environments do not change demand; they change supply, because 10\u201315 dB of penetration lands on a link
        that only just closes outdoors. Derating is Shannon on a power-limited link, calibrated so outdoor returns the
        site's 2.48 bps/Hz (SNR {SNR0_DB.toFixed(1)} dB); below the decode floor the link does not close at all.
        Inputs come live from the Tier Lab above \u2014 edit a take rate there and every box here moves.
      </p>

      <div className="split2" style={{ gap: 12 }}>
        <label className="sliderL">
          D2C fleet: <strong>{fleet.toLocaleString()}</strong>{" "}
          <span style={{ color: C.dim }}>\u2014 duty {(duty * 100).toFixed(0)}% \u00b7 {Math.round(ps.N).toLocaleString()} cells/patch</span>
          <input type="range" min="650" max="46000" step="50" value={fleet} onChange={(e) => setFleet(+e.target.value)} />
        </label>
        <label className="sliderL">
          Decode floor: <strong>{floorDb}</strong> dB SNR <span style={{ color: C.dim }}>(below this the link does not close)</span>
          <input type="range" min="-12" max="0" step="0.5" value={floorDb} onChange={(e) => setFloorDb(+e.target.value)} />
        </label>
      </div>

      <div className="tglRow" style={{ gap: 10, flexWrap: "wrap", margin: "6px 0 8px" }}>
        {GAP_ENVS.map((e, i) => (
          <label key={e.k} className="sliderL" style={{ flex: "1 1 150px", margin: 0 }}>
            {e.n} loss: <strong>{loss[i]}</strong> dB <span style={{ color: C.dim }}>({e.note})</span>
            <input type="range" min="0" max="30" step="1" value={loss[i]}
              onChange={(ev) => setLoss(loss.map((x, j) => (j === i ? +ev.target.value : x)))} />
          </label>
        ))}
      </div>

      <div style={{ overflowX: "auto" }}>
        <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 560 }}>
          <thead>
            <tr style={{ color: C.dim, fontFamily: "var(--mono)", fontSize: 10 }}>
              <th style={{ ...cellS, textAlign: "left" }}>TIER</th>
              <th style={{ ...cellS, textAlign: "right" }}>DL NEED</th>
              <th style={{ ...cellS, textAlign: "right" }}>UL NEED</th>
              {GAP_ENVS.map((e, i) => (
                <th key={e.k} style={{ ...cellS, textAlign: "center" }}>
                  {e.n.toUpperCase()}<br />
                  <span style={{ color: supply[i].dl > 0 ? C.dim : "#FF8FA0", fontSize: 9 }}>
                    {supply[i].dl > 0 ? `${supply[i].dl.toFixed(0)}/${supply[i].ul.toFixed(1)} Mbps` : "no link"}
                  </span>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {demand.map((d, ti) => {
              const A = Math.PI * (BEAM_KM / 2) * (BEAM_KM / 2);
              return (
                <tr key={d.k}>
                  <td style={{ ...cellS, color: C.text }}>{d.n}</td>
                  <td style={{ ...cellS, textAlign: "right", color: C.amber }}>{(d.dl * A).toFixed(0)}</td>
                  <td style={{ ...cellS, textAlign: "right", color: C.green }}>{(d.ul * A).toFixed(0)}</td>
                  {GAP_ENVS.map((e, ei) => {
                    const s = supply[ei];
                    const rd = s.dl > 0 ? (d.dl * A) / s.dl : Infinity;
                    const ru = s.ul > 0 ? (d.ul * A) / s.ul : Infinity;
                    const v = verdict(rd, ru);
                    return (
                      <td key={e.k} style={{ ...cellS, textAlign: "center", background: v.c, color: v.t, fontWeight: 700 }}>
                        {v.lbl}
                        {isFinite(rd) && Math.max(rd, ru) > 1 && (
                          <div style={{ fontSize: 8.5, fontWeight: 400, opacity: 0.75 }}>{ru > rd ? "UL-bound" : "DL-bound"}</div>
                        )}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="statGrid" style={{ marginTop: 8 }}>
        <div className="stat" style={{ borderColor: C.green }}>
          <div className="statL">Where the satellite layer holds</div>
          <div className="statV" style={{ fontSize: 18, color: C.green }}>
            {(() => {
              const A = Math.PI * (BEAM_KM / 2) * (BEAM_KM / 2);
              const ok = demand.filter((d) => supply[0].dl > 0 && Math.max((d.dl * A) / supply[0].dl, (d.ul * A) / supply[0].ul) <= 1);
              return ok.length ? ok.map((o) => o.n).join(" \u00b7 ") : "no tier, outdoors";
            })()}
          </div>
          <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>
            Outdoors only. The break falls between rural and suburban and it is a cliff, not a slope \u2014 demand jumps
            ~12\u00d7 across that boundary while supply is flat.
          </div>
        </div>
        <div className="stat" style={{ borderColor: C.amber }}>
          <div className="statL" style={{ color: C.amber }}>Which link binds</div>
          <div className="statV" style={{ fontSize: 18, color: C.amber }}>Uplink, everywhere it fails</div>
          <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>
            Traffic asymmetry is {(g.dlU / g.ulU).toFixed(1)}:1 but delivered capacity is{" "}
            {(supply[0].ul > 0 ? supply[0].dl / supply[0].ul : 0).toFixed(1)}:1, so uplink runs out first in every failing
            tier. Fill-in equipment must be sized on uplink, not downlink \u2014 the usual instinct is backwards here.
          </div>
        </div>
      </div>

      <p className="body" style={{ fontSize: 12.5, color: C.dim, marginTop: 8 }}>
        <strong style={{ color: C.text }}>Read the indoor column first.</strong> At {loss[2]} dB the SNR is{" "}
        {(SNR0_DB - loss[2]).toFixed(1)} dB \u2014 {SNR0_DB - loss[2] < floorDb ? "below the decode floor, so the satellite delivers nothing indoors in any tier, rural included" : "still decoding, but at a fraction of outdoor capacity"}.
        That is the single most consequential result here: the satellite layer is an <em>outdoor</em> network everywhere,
        and the indoor question is identical in all six tiers \u2014 only the economics of the answer change.
        <strong style={{ color: C.text }}> Caveats:</strong> the beam is {BEAM_KM} km at nadir and stretches off-nadir, so
        this is the best-case footprint; duty cycle is applied but scheduler concentration is not, so a satellite that
        aims beams at towns does better than this in sparse tiers and no better in dense ones.
      </p>
    </div>
  );
}

function TierSystem() {

function StitchPanel() {
  const [fleet, setFleet] = useState(2000);
  const [spd, setSpd] = useState(60);
  const [zspd, setZspd] = useState(60);
  const [nb, setNb] = useState(19);
  const [nph, setNph] = useState(1);
  const [nstr, setNstr] = useState(3);
  const [t, setT] = useState(0);
  useEffect(() => {
    if (spd === 0 && zspd === 0) return;
    const id = setInterval(() => setT((x) => x + 0.1), 100);
    return () => clearInterval(id);
  }, [spd, zspd]);
  const h = 330, Re = 6371, EARTH = 510e6, US = 8.1e6;
  const areaPer = EARTH / fleet;
  const spacing = 1.075 * Math.sqrt(areaPer);
  const rServe = spacing / Math.sqrt(3);
  const lamD = rServe / Re;
  const eEdge = (Math.atan2(Math.cos(lamD) - Re / (Re + h), Math.sin(lamD)) * 180) / Math.PI;
  const regime = eEdge >= 60 ? 1 : eEdge >= 42 ? 2 : 3;
  const tone = regime === 1 ? C.green : regime === 2 ? C.amber : "#C79BFF";
  const beamArea = BEAM_AREA; // ~8.9 km ⌀ canonical center (v92) — Panel 1b bracket, unified site-wide
  const beamsNeeded = patchStats(fleet).N; // area-weighted: cells grow toward the patch rim (Panel 3b)
  const duty = Math.min(700 / beamsNeeded, 1) * 100;
  const satsUS = fleet * (US / EARTH) * 1.3;
  // guaranteed floor: invert Panel 1's calibrated model (3.3× Walker overlap) — largest mask this fleet guarantees everywhere, always
  const capf = (e) => { const er = (e * Math.PI) / 180; return (1 - Math.cos(Math.acos((Re / (Re + h)) * Math.cos(er)) - er)) / 2; };
  let gLo = 25, gHi = 89;
  for (let i = 0; i < 40; i++) { const mid = (gLo + gHi) / 2; if (3.3 / capf(mid) > fleet) gHi = mid; else gLo = mid; }
  const guarE = gLo;
  const usCapGbps = satsUS * Math.min(700, beamsNeeded) * 0.05;
  const CONUS = CONUS_PATH;
  const MW = 5140, MH = 2760;
  const kpx = 880 / MW, ox = 10, oy = 8;
  // Two complete interleaved families, both spanning the whole map: NE-bound (ascending) and SE-bound (descending)
  const Sf = spacing * 1.414; // per-family lattice spacing; interleaved they net ~`spacing`
  const off = (t * 7.3 * spd) % Sf;
  const diag = Math.hypot(MW, MH) / 2 + Sf * 2;
  const FAMS = [
    { d: [0.766, -0.643], col: C.blue },  // NE-bound: east + north (screen up)
    { d: [0.766, 0.643], col: C.green },  // SE-bound: east + south
  ];
  const sats = [];
  FAMS.forEach((f, fi) => {
    const [dx, dy] = f.d, px = -dy, py = dx;
    for (let a = -diag; a <= diag; a += Sf) {
      for (let c = -diag; c <= diag; c += Sf) {
        const along = a + off + (fi ? Sf / 2 : 0);
        const cross = c + (fi ? Sf / 2 : 0);
        const x = MW / 2 + along * dx + cross * px;
        const y = MH / 2 + along * dy + cross * py;
        if (x > -150 && x < MW + 150 && y > -150 && y < MH + 150) sats.push([x, y, fi]);
      }
    }
  });
  // ZOOM: three adjacent SE-bound strips, satellites streaming with their spot-beam clusters over an Earth-fixed cell grid
  const zw = 560, zh = 340;
  const zSpanKm = (nstr + 0.2) * spacing;
  const trks = Array.from({ length: nstr }, (_, i) => i - (nstr - 1) / 2);
  const zk = zw / zSpanKm;
  const zHKm = zh / zk;
  const beamR = Math.max(2.2 * zk, 1.1);
  const patchPx = rServe * zk;
  const zoff = (t * 7.3 * zspd) % spacing;
  const PAL = ["#FFB04C", "#5BA8FF", "#C79BFF", "#6BDB8F", "#FF9ECF", "#4DD0E1"];
  const zsats = [];
  trks.forEach((tr, ti) => {
    const phase = ti % 2 ? spacing / 2 : 0;
    for (let n = -1; n * spacing <= zHKm + 2 * spacing; n++) {
      const yKm = ((n * spacing + phase + zoff) % (zHKm + 2 * spacing)) - spacing;
      zsats.push([zw / 2 + tr * spacing * zk, yKm * zk]);
    }
  });
  const beams = [];
  const hopN = Math.floor(t * 1.5); // discrete dwell intervals
  // Fixed sunflower lattice of cell sites tiles each patch evenly; hopping = a sliding subset of sites is lit.
  // Consecutive sunflower indices are themselves evenly spread, so the lit set stays uniform at every instant,
  // and shifting the window a few steps per hop swaps only a few beams — churn without chaos.
  // Hexagonal cell grid — the layout a cellular network actually uses: a center beam plus concentric hex rings
  // (1 + 6 + 12 + 18 ...), contiguous and even, sized so the requested beam count fills the patch. Any partial
  // outer ring is spread evenly around its circumference. The cluster rides with its satellite; the schedule
  // re-points as a subtle half-cell lattice shift every few dwell intervals.
  // Triangular (hex-packed) lattice, taking the n sites nearest the centre: every beam lands on a real
  // lattice site, so the cluster stays round and evenly spaced at ANY count — no partial-ring artefacts.
  const hexPts = (n, R) => {
    const cnt = Math.max(1, n);
    const a = R * Math.sqrt((2 * Math.PI) / (cnt * Math.sqrt(3))); // spacing that makes n sites fill radius R
    const rows = Math.ceil(R / (a * (Math.sqrt(3) / 2))) + 2;
    const cols = Math.ceil(R / a) + 2;
    const pts = [];
    for (let j = -rows; j <= rows; j++) {
      for (let i = -cols; i <= cols; i++) {
        const x = (i + (j & 1 ? 0.5 : 0)) * a;
        const y = j * a * (Math.sqrt(3) / 2);
        pts.push([x, y, x * x + y * y]);
      }
    }
    pts.sort((p, q) => p[2] - q[2]);
    return pts.slice(0, cnt).map(([x, y]) => [x, y, a]);
  };
  zsats.forEach(([zx, zy], si) => {
    const grid = hexPts(nb, patchPx * 0.82);
    const cellA = grid.length ? grid[0][2] : 1;                     // lattice spacing for this beam count
    const shift = (Math.floor(hopN / 4) + si) % 2;                  // re-point = half-cell lattice shift
    const sx = shift ? cellA * 0.5 : 0, sy = shift ? cellA * (Math.sqrt(3) / 6) : 0;
    grid.forEach(([gx, gy]) => beams.push([zx + gx + sx, zy + gy + sy, si]));
  });
  // phones live in the GAPS between strips (guaranteed off-centerline at every strip count) — where handoffs are contested
  const gapXs = nstr > 1
    ? trks.slice(0, -1).map((tr) => zw / 2 + (tr + 0.5) * spacing * zk)
    : [zw / 2 - 0.38 * spacing * zk, zw / 2 + 0.38 * spacing * zk];
  const phones = Array.from({ length: nph }, (_, pi) => {
    const gx = gapXs[pi % gapXs.length];
    const wob = ((((pi * 47) % 5) - 2) * 0.07) * spacing * zk; // fixed wobble, stays well clear of tracks
    const pxy = [gx + wob, zh * (0.12 + 0.76 * ((pi * 0.618) % 1))];
    let bsat = 0, bd = 1e9;
    zsats.forEach(([zx, zy], si) => { const dd = Math.hypot(zx - pxy[0], zy - pxy[1]); if (dd < bd) { bd = dd; bsat = si; } });
    const sched = ((pi * 53 + hopN * 29 + bsat * 7) % 10) < 7; // scheduled dwell ~70% of hop intervals
    const jx = (((pi * 31 + hopN * 13) % 9) - 4) * 3.2, jy = (((pi * 17 + hopN * 19) % 9) - 4) * 3.2;
    return { pxy, serving: bsat, lit: sched, hitPos: sched ? [pxy[0] + jx, pxy[1] + jy] : null, pi };
  });
  const litCount = phones.filter((p) => p.lit).length;
  return (
    <div className="card" style={{ borderTop: `2px solid ${C.green}` }}>
      <div className="eyebrow" style={{ color: C.green }}>Panel 6 · The stitching — satellite adjacency over the US as the fleet grows <Src k="fleet" topic="derived" /></div>
      <p className="body" style={{ marginBottom: 10 }}>
        Every cell is served by whichever satellite sees it steepest, so the ground is partitioned into per-satellite
        service patches whose size is set purely by fleet count. At US latitudes two families of ~53°-inclined tracks
        cross everywhere — ascending passes heading northeast, descending passes heading southeast, interleaved across
        the whole map — at ~7.3 km/s ground speed. Grow the fleet and each patch shrinks, retiring the low-elevation
        elliptical beams from service: the channel path narrows.
      </p>
      <div className="tglRow" style={{ alignItems: "center", marginBottom: 6 }}>
        <label className="sliderL" style={{ flex: 2, minWidth: 260 }}>
          D2C fleet (global): <strong>{fleet.toLocaleString()}</strong> — ~{satsUS.toFixed(0)} over CONUS at any instant
          <input type="range" min="650" max="15000" step="50" value={fleet} onChange={(e) => setFleet(+e.target.value)} />
        </label>
        <label className="sliderL" style={{ flex: 1, minWidth: 180 }}>
          Time speed: <strong>{spd === 0 ? "paused" : "×" + spd}</strong> <span style={{ color: C.dim, fontSize: 11 }}>(0 = pause · 5 = near-real motion · 100 = max)</span>
          <input type="range" min="0" max="100" step="5" value={spd} onChange={(e) => setSpd(+e.target.value)} />
        </label>
      </div>
      <svg viewBox="0 0 900 505" style={{ width: "100%", display: "block" }} role="img" aria-label="Continental US with two interleaved families of moving serving satellites and their service patches">
        <defs><clipPath id="usClip"><path d={CONUS} transform={`translate(${ox},${oy}) scale(${kpx})`} /></clipPath></defs>
        <path d={CONUS} transform={`translate(${ox},${oy}) scale(${kpx})`} fill="rgba(91,168,255,0.05)" stroke={C.line} strokeWidth="1.2" vectorEffect="non-scaling-stroke" />
        <g clipPath="url(#usClip)">
          {US_STATES.map((st, i) => (
            <path key={"st" + i} d={st.d} transform={`translate(${ox},${oy}) scale(${kpx})`} fill="none" stroke="#8A98B0" strokeWidth="0.55" vectorEffect="non-scaling-stroke" opacity="0.35" />
          ))}
          {sats.map(([sx, sy, fi], i) => (
            <g key={i} transform={`translate(${ox + sx * kpx},${oy + sy * kpx})`}>
              <circle r={rServe * kpx} fill="none" stroke={FAMS[fi].col} strokeWidth="0.7" opacity="0.35" />
              <circle r="2" fill={FAMS[fi].col} opacity="0.9" />
            </g>
          ))}
        </g>
        <text x="450" y="498" textAnchor="middle" fill={C.dim} fontSize="9.5" fontFamily="var(--mono)">
          Natural Earth CONUS boundary · blue = NE-bound (ascending) · green = SE-bound (descending) · both families cover the whole map · patches ~{Math.round(2 * rServe).toLocaleString()} km
        </text>
      </svg>
      <p className="body" style={{ fontSize: 13, marginTop: 14, marginBottom: 6 }}>
        <strong style={{ color: C.green }}>Zoom — the strip machine:</strong> {nstr} adjacent descending {nstr > 1 ? "strips" : "strip"}, face-on.
        Each satellite streams down its strip carrying its spot-beam cluster (beams to scale, a slider-set sample of the
        ~700 — slide it up and watch the patch saturate); each satellite's beams wear its color, so a phone's link
        visibly changes color at handover. The dotted grid is Earth-fixed cells; the scheduler assigns one of the
        serving satellite's beams to each active phone's cell most cycles — that beam is shown <em>highlighted</em>
        (double ring, off-centerline, wherever the phone is), the solid line links phone → assigned beam, and a thin tie
        runs beam → its satellite so the center stays trackable; between dwells the phone idles on the paging schedule —
        continuous coverage stitched from moving parts.
      </p>
      <div className="tglRow" style={{ alignItems: "center", marginBottom: 6 }}>

          <div className="stat"><div className="statL">Satellite spacing</div><div className="statV">~{Math.round(spacing).toLocaleString()} km</div></div>
          <div className="stat" style={{ marginTop: 8 }}><div className="statL">Serving elevation — typical vs guaranteed</div>
            <div className="statV" style={{ color: tone }}>typical ~{Math.max(eEdge, 25).toFixed(0)}° <span style={{ color: C.dim, fontSize: 11 }}>(ideal lattice, patch edge)</span></div>
            <div className="statV" style={{ fontSize: 13, marginTop: 2 }}>guaranteed ~{Math.max(guarE, 25).toFixed(0)}° <span style={{ color: C.dim, fontSize: 11 }}>(Panel 1's calibrated floor — everywhere, always)</span></div>
          </div>
          <div className="stat" style={{ marginTop: 8 }}>
            <div className="statL">Beam positions per patch vs ~700 available <span style={{ color: C.dim }}>— how thinly beams spread, not a coverage gap</span></div>
            <div className="statV">~{Math.round(beamsNeeded).toLocaleString()} → duty ~{duty < 10 ? duty.toFixed(1) : duty.toFixed(0)}%</div>
          </div>
          <div className="stat" style={{ marginTop: 8 }}>
            <div className="statL">Reuse regime at the typical cell <span style={{ color: C.dim }}>— Panel 3's model at this fleet's elevation</span></div>
            <div className="statV" style={{ color: eEdge >= 60 ? C.green : eEdge >= 42 ? C.amber : C.red }}>
              {eEdge >= 60 ? "Reuse-1 · full 20 MHz" : eEdge >= 42 ? "Transitional · ~13 MHz" : "Reuse-3 · ~6.7 MHz"}
              <span style={{ color: C.dim, fontSize: 11 }}> → ~{((eEdge >= 60 ? 20 : eEdge >= 42 ? 40 / 3 : 20 / 3) * 2.48 * Math.sin((Math.max(eEdge, 25) * Math.PI) / 180)).toFixed(0)} Mbps per cell</span>
            </div>
          </div>
          <div className="stat" style={{ marginTop: 8 }}><div className="statL">US aggregate (claim-anchored ceiling)</div><div className="statV" style={{ color: C.amber }}>~{usCapGbps >= 1000 ? (usCapGbps / 1000).toFixed(1) + " Tbps" : Math.round(usCapGbps) + " Gbps"}</div></div>

      </div>
      <Info label="why this panel and Panel 1 quote different elevations for the same fleet">
        They answer different questions, and together they bracket reality. Panel 1 asks: how many satellites
        <em> guarantee</em> that every point, at every instant, has a satellite above the mask — using a 3.3× overlap
        factor calibrated to the real fleet (650 satellites ≈ continuous 25°), which bakes in genuine constellation
        waste: inclination bunching, imperfect phasing, the bad moments. This panel asks: in an idealized perfect hex
        lattice (with 1.3× mid-latitude crowding), how steep is the <em>typical</em> patch edge — zero waste assumed.
        Divide the two models' implied service areas and the entire gap is ~3.3 ÷ 1.3: at 5,000 satellites, typical
        serving elevation ≈ 57° while the guaranteed-everywhere floor ≈ 43°. Your phone usually lives near the first
        number and occasionally visits the second — which is exactly the variance story Panel 5's sawtooth animates.
        Neither number is wrong; quoting either alone would be.
      </Info>
      <Info label="duty cycle vs frequency reuse — two different things, don't fuse them">
        These two stats answer different questions and it's easy to mistake one for the other.
        <strong> Frequency reuse</strong> (Panel 3) asks <em>how much of the 20 MHz your cell may use</em>, and the answer
        is set by elevation: high in the sky, beams land compact and circular, isolated from their neighbours — reuse-1,
        the full pool, ~47–50 Mbps in that cell. Low toward the horizon, beams smear into ellipses that spill onto
        neighbours — reuse-3, one lane, ~10 Mbps. Fleet size drives this <em>through elevation</em>: at 650 satellites the
        typical cell sees the satellite at ~28° (reuse-3); at ~6,000 the typical cell crosses 60° into reuse-1; and by
        ~15,000 even the <em>guaranteed</em> floor reaches it — full menu everywhere, always.
        <strong> Duty cycle</strong> (this panel) asks something else entirely: <em>how thinly must one satellite's ~700
        beams spread across the cells in its patch?</em> It is <strong>not</strong> a claim that your phone has service
        31% of the time. Hopping runs on millisecond scheduling, and schedulers chase demand — most ~9 km cells in a
        patch are empty land, so beams park where users actually are. Duty is a way of stating <em>capacity per unit
        area</em>: 700 beams × the per-cell rate, divided across the patch, which is exactly the arithmetic the
        Serviceability tab runs. Reuse sets your cell's speed; duty sets how much total capacity exists to share.
      </Info>
      <Info label="what exactly am I looking at in the strip view?">
        A face-on window of ground about three satellite-spacings wide. The dashed vertical lines are adjacent orbital
        strips (descending family, face-on). Each large faint circle is a passing satellite's <strong>assigned service
        share</strong> — <em>not</em> its total reach: the satellite's physical footprint is ~1,200 km across (Panel 1's amber circle — its <em>reach</em>), but with
        neighbors present it only serves the patch where it is the steepest option, and the fleet slider sets that
        share's size. The colored dots inside a share are a <strong>sample of the spot beams that satellite is pointing
        this instant</strong> (beams drawn to scale; the count slider sets the sample). Beam sites form a hexagonal
        cell grid — a triangular lattice, the same contiguous layout terrestrial cellular uses — sized to the beam-count slider so the cluster fills the patch at any count, riding along with its satellite, and re-pointing as a subtle half-cell
        lattice shift every few dwell intervals rather than shimmering frame-to-frame. The dotted grid
        is Earth-fixed cells. Phones sit in the gaps between strips — the genuinely contested ground. Beams come to phones, not the other way
        around: most cycles the scheduler assigns one of the serving satellite's beams to the phone's own cell — drawn
        highlighted with a double ring, off-centerline wherever the phone sits — with the solid line linking phone to
        that beam and a thin tie linking the beam back to its satellite; between dwells a dim dashed line marks the
        satellite responsible while the phone idles on the paging schedule. Handover = the colors change.
      </Info>
      <p className="body" style={{ fontSize: 12, color: C.dim, marginTop: 10 }}>
        Model (derived, schematic): CONUS boundary from Natural Earth (public domain), equirectangular at 38°N; two
        interleaved hex lattices (ascending + descending families) netting the fleet's density, ×1.3 mid-latitude
        crowding for 53° planes; patch-edge elevation from spherical geometry at 330 km; duty = ~700 available beams ÷
        cells in the patch, area-weighted across the patch (a beam is an ~8.9 km circle only at nadir and stretches into
        an ellipse toward the rim — see Panel 3b); the older nadir-sized approximation understated duty. Note the crossover this implies: up to ~48,000
        satellites, crowding is absorbed by duty cycle (all 700 beams stay busy inside their shrinking patch — the
        Voronoi assignment prevents neighbor overlap); beyond that — Gen3's 100,000-satellite scale — a patch physically
        can't hold 700 beams, and active beams per satellite must fall to patch ÷ beam-area (~330 at 100k). Even at
        15,000 satellites it's ~3:1, which is why the zoom's phones blink between lit and
        between-dwells: Earth-fixed cells and hopping schedules exist at every fleet size. Handover cadence at real
        speed: every ~1–2 minutes at 15,000 satellites, ~2–3 at 650. US capacity = satellites over CONUS × beams ×
        50 Mbps claim-anchored — a ceiling, not a forecast. Fleet growth doesn't just add capacity — it deletes the bad
        geometry.
      </p>
    </div>
  );
}

        <text x="76" y={Y(tol) - 5} fill={C.green} fontSize="9.5" fontFamily="var(--mono)">waveform tolerance ±{tol} kHz (illustrative)</text>
        {/* residual line */}
        <line x1={X(-100)} y1={Y(ntn ? -0.12 : -maxRes)} x2={X(100)} y2={Y(ntn ? 0.12 : maxRes)}
          stroke={ntn ? C.blue : C.amber} strokeWidth="2" style={{ transition: "all 400ms" }} />
        {/* axis */}
        <line x1="70" y1="130" x2="830" y2="130" stroke={C.line} />
        <text x="70" y="192" fill={C.dim} fontSize="9.5" fontFamily="var(--mono)">beam edge</text>
        <text x="450" y="192" textAnchor="middle" fill={C.dim} fontSize="9.5" fontFamily="var(--mono)">beam center (correction exact here)</text>
        <text x="830" y="192" textAnchor="end" fill={C.dim} fontSize="9.5" fontFamily="var(--mono)">beam edge</text>
        {/* phone marker */}
        <circle cx={X(pos)} cy={Y(res)} r="7" fill={ok ? C.green : C.red} />

      </label>
      <div className="benchGrid" style={{ marginTop: 14 }}>
        <div className="bench"><div className="benchT">Full-beam usability</div><div className="benchW">Beam-edge users work at full rate instead of degrading — effectively more capacity from identical satellites, and freedom to run larger beams or tighter waveforms.</div></div>
        <div className="bench"><div className="benchT">The phone shares the burden</div><div className="benchW">Ephemeris broadcast in system information + GNSS position lets the handset pre-compensate its own uplink timing and Doppler — the satellite stops carrying the whole problem alone.</div></div>

          <div className="bench" style={{ borderLeft: `2px solid ${C.amber}` }}>
            <div className="benchT" style={{ color: C.amber }}>Adapted-LTE via SCS · from ~2027</div>
            <div className="benchW">

              The permanent taxes: blind HARQ repeats, whole-cell conservative margins, beam-edge degradation, wasteful
              random access — the Panel-4 penalties, paid forever.
            </div>
          </div>
          <div className="bench" style={{ borderLeft: `2px solid ${C.blue}` }}>
            <div className="benchT" style={{ color: C.blue }}>NR-NTN (Rel-19) · ~2029+ (work item unfiled)</div>
            <div className="benchW">
              <strong>2.48 Mbps/MHz</strong> (claim-anchored ≈ 4×) → the same 5 MHz carries <strong>~12 Mbps, ~20+ with
              MIMO</strong>; uplink ~0.30 Mbps/MHz (2–3× — the biggest gainer, since unaware phones waste most on the
              uplink). Requires Rel-19/X105-class handsets <em>and</em> a 3GPP band-addition work item nobody has filed.
            </div>
          </div>
        </div>
        <p className="body" style={{ fontSize: 12.5, marginTop: 10 }}>
          <strong style={{ color: C.green }}>The value ramp: ~4× downlink, ~3× uplink from the same MHz</strong> — the
          economic case for eventually filing the 3GPP work item, and the FCC's milestone ladder encodes the same
          expectation (DL spectral efficiency 300 → 600 kbps/MHz over nine years, largely from NTN-capable devices).
          The regimes aren't either/or: the 2027 satellites run both simultaneously — adapted-LTE on G+H for hundreds of
          millions of legacy phones, NR-NTN on n252 for the growing Rel-19 fleet — so service value ratchets up as
          spectrum and handsets migrate from the first bucket to the second.
        </p>
        <p className="body" style={{ fontSize: 12, color: C.dim }}>
          Verified (Aug 2026): the 2027 H-block story is <strong>downlink-only</strong>. No shipping phone transmits
          1915–1920 — Band 25's uplink ends at exactly 1915, and n70's designers deliberately paired the H-block DL with
          the AWS-3 uplink (1695–1710) instead. The FCC said it plainly in the EchoStar assignment order: 3GPP NTN
          standards don't support 1915–1920, and SpaceX "must pursue standards and equipment support or seek additional
          regulatory relief." SpaceX's application requests the uplink anyway (as future "ordinary handsets" under Part
          27) — a filing about intent, not existing devices. So: +5 MHz DL is real and near-term; the uplink half needs
          new standards <em>and</em> new phone RF hardware regardless of protocol path. Legacy-phone uplink comes from the
          G-block and (waivers pending) AWS-3's 1695–1710, which n70 phones genuinely transmit.
        </p>
      </div>
      <p className="body" style={{ fontSize: 12, color: C.dim, marginTop: 10 }}>kHz values are illustrative — chosen to show the mechanism, not measured figures (the real uplink requirement is far stricter: ±0.1 ppm ≈ ±200 Hz at 2 GHz). The structural point is real: legacy beams are usability-capped at the edges; NTN handsets remove the cap.</p>
      <Info label="Rel-17 vs Rel-18 vs Rel-19 — are they the same thing?">
        No — they're successive versions of the global cellular standard (3GPP numbers its releases like software), each
        frozen roughly two years apart, and they do different jobs here. <strong>Rel-17 (2022) is the foundation:</strong>
        the first release where phones learn satellites exist at all. It puts the satellite's orbital position (ephemeris)
        into the broadcast channel, lets a GPS-equipped phone pre-correct its own timing and Doppler, stretches protocol
        timers to survive orbital delays, and adapts the connection procedures. Everything the flat blue line above shows
        is Rel-17 machinery. <strong>Rel-18 (2024) refines:</strong> smoother handover between satellite and ground
        networks, network-verified device location, coverage tweaks. <strong>Rel-19 (2025–26) is the maturity release
        SpaceX built its 5G system around:</strong> support for regenerative payloads (the base station lives on the
        satellite — Starlink's architecture), uplink capacity enhancements aimed at exactly the starved direction, and the
        band/feature package that makes n252 practical in a consumer modem. Qualcomm's X105 is the first Rel-19 NTN
        modem — which is why that part number keeps appearing. Shorthand: Rel-17 makes the phone satellite-aware;
        Rel-19 makes satellite service worth building a business on.
      </Info>
      <Info label="what actually goes wrong past the tolerance line?">
        Modern cellular carries data on hundreds of narrow sub-channels spaced 15 kHz apart, packed so tightly they only
        avoid interfering because each is read at the exact instant its neighbors cancel to zero — a property that exists
        only at precisely the right frequency. Drift off, and failure arrives as a ladder. <em>Small offset:</em> the
        sub-channels leak into each other, raising the noise floor; the link quietly downshifts to slower, more protected
        transmission — throughput sags before anything visibly breaks. <em>Larger offset:</em> the phone's channel
        tracking loses lock, errors spike, and the airtime fills with retransmissions — a trickle of repeats instead of
        data. <em>The uplink catastrophe:</em> many phones share each received uplink symbol, so one off-frequency phone
        smears across its <strong>neighbors'</strong> sub-channels — it degrades everyone in the beam, not just itself.
        That's why the standard demands a phone transmit within ±0.1 ppm of the downlink it hears (~±200 Hz at 2 GHz) —
        and the cruel twist for satellites: the phone <em>copies</em> its transmit frequency from what it receives, so any
        residual Doppler the satellite didn't cancel gets inherited by the uplink and then Doppler-shifted again on the
        way up, roughly doubling. <em>Beyond sync range:</em> the phone's connection attempts miss their detection windows
        entirely — bars on screen, no service. Timing has a parallel ladder: each symbol carries only ~4.7 µs of guard
        time; residual delay error beyond it makes symbols smear into each other with the same collapse.
      </Info>
      <Info label="unpack 'efficiency' — where does the capacity actually come from?">
        Serving satellite-unaware phones forces the network into permanent defensive posture, and every defense costs
        capacity. <em>Retransmission stalls:</em> LTE expects acknowledgment of each packet within ~4 ms; the orbital
        round trip is several times that, so the pipeline stalls — or the network resorts to blind repetition,
        transmitting everything 2–4× preemptively, which is pure spectral waste. NTN phones support stretched scheduling
        and more parallel processes, keeping the pipeline full without insurance copies. <em>Access waste:</em> a phone
        with unknown timing misses the connection window and retries at escalating power — battery drain, interference,
        delay; an NTN phone using GPS + ephemeris nails it first try. <em>Permanent margins:</em> when the scheduler can't
        trust each phone's frequency and timing, it pads guard periods and backs off data rates for the entire cell, all
        the time; removing the residuals lets it run near the channel's true limit. Add those up across a beam and
        "efficiency" stops being abstract: the same satellite, same spectrum, same power carries meaningfully more
        traffic — because the endpoints stopped requiring insurance.
      </Info>
    </div>
  );
}

function SubNav({ items }) {
  const [cur, setCur] = useState(items[0].id);
  useEffect(() => {
    const onScroll = () => {
      let best = items[0].id, bestY = -1e9;
      for (const it of items) {
        const el = document.getElementById(it.id);
        if (!el) continue;
        const y = el.getBoundingClientRect().top;
        if (y < 120 && y > bestY) { bestY = y; best = it.id; }
      }
      setCur(best);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, [items]);
  const go = (id) => {

/* ---------- shared patch geometry: one place, used everywhere duty is quoted ---------- */
const PG_RE = 6371, PG_H = 330, PG_TB = BEAM_KM / 330;
function pgCell(d) {
  const lam = d / PG_RE;
  const S = Math.sqrt(PG_RE * PG_RE + (PG_RE + PG_H) * (PG_RE + PG_H) - 2 * PG_RE * (PG_RE + PG_H) * Math.cos(lam));
  const eps = Math.atan2(Math.cos(lam) - PG_RE / (PG_RE + PG_H), Math.sin(lam));
  const across = PG_TB * S;
  const along = across / Math.max(Math.sin(eps), 1e-6);
  return { epsDeg: (eps * 180) / Math.PI, across, along, area: (Math.PI / 4) * along * across };
}
const PG_CACHE = {};
function patchStats(fleet) {
  const key = Math.round(fleet);
  if (PG_CACHE[key]) return PG_CACHE[key];
  const A = 510e6 / fleet, R = Math.sqrt(A / Math.PI);
  let N = 0; const steps = 400;
  for (let i = 0; i < steps; i++) {
    const d = (R * (i + 0.5)) / steps;
    N += ((2 * Math.PI * d) * (R / steps)) / pgCell(d).area;
  }
  const edge = pgCell(R), nadir = pgCell(0.001);
  const out = { A, R, N, avgCell: A / N, duty: Math.min(1, 700 / N), edge, nadir, naiveN: A / BEAM_AREA };
  PG_CACHE[key] = out;
  return out;
}
const PG_PITCH = PG_TB * Math.sqrt((Math.PI / 4) / (Math.sqrt(3) / 2)); // hex pitch ⇒ hex-cell area = ellipse area
const PG_THMAX = Math.asin(PG_RE / (PG_RE + PG_H));
function pgGroundFromTheta(th) {
  if (th >= PG_THMAX) return null;
  const sv = (Math.sin(th) * (PG_RE + PG_H)) / PG_RE;
  if (sv >= 1) return null;
  const eps = Math.acos(Math.min(1, Math.max(-1, sv)));
  const lam = Math.PI / 2 - th - eps;
  if (lam <= 0) return null;
  return { d: PG_RE * lam, epsDeg: (eps * 180) / Math.PI };
}
/* Real arrays lay beams on a hex lattice in pointing-angle space; projected onto the ground that is
   hexagonal at nadir and progressively stretched outward. mStep sub-samples the lattice by taking a
   coarser hex lattice, so the drawn pattern stays hexagonal and evenly spaced. */
function pgLattice(R, mStep) {
  const out = [];
  const rings = Math.ceil((1.35 * R) / (PG_PITCH * PG_H)) + 24;
  for (let j = -rings; j <= rings; j += mStep) {
    for (let i = -rings; i <= rings; i += mStep) {
      const tx = (i + j / 2) * PG_PITCH, ty = j * PG_PITCH * (Math.sqrt(3) / 2);
      const th = Math.hypot(tx, ty);
      const g = pgGroundFromTheta(th);
      if (!g || g.d > R) continue;
      const c = pgCell(Math.max(g.d, 0.001));
      out.push({ d: g.d, ang: Math.atan2(ty, tx), along: c.along, across: c.across, epsDeg: c.epsDeg });
    }
  }
  return out;
}

function patchZones(fleet, mhz, eff) {
  const A = 510e6 / fleet, R = Math.sqrt(A / Math.PI), steps = 600;
  const Z = { r1: [0, 0, 0], tr: [0, 0, 0], r3: [0, 0, 0] }; // cells, Σ(cells×Mbps), maxMbps
  for (let i = 0; i < steps; i++) {
    const d = (R * (i + 0.5)) / steps, dr = R / steps;
    const c = pgCell(d);
    const n = ((2 * Math.PI * d) * dr) / c.area;
    const uf = c.epsDeg >= 60 ? 1 : c.epsDeg >= 42 ? 2 / 3 : 1 / 3;
    const T = uf * mhz * eff * Math.sin((c.epsDeg * Math.PI) / 180);
    const k = c.epsDeg >= 60 ? "r1" : c.epsDeg >= 42 ? "tr" : "r3";
    Z[k][0] += n; Z[k][1] += n * T; Z[k][2] = Math.max(Z[k][2], T);
  }
  const tot = Z.r1[0] + Z.tr[0] + Z.r3[0], sumT = Z.r1[1] + Z.tr[1] + Z.r3[1];
  const row = (k, name, usable) => ({
    name, usable, cells: Z[k][0], share: Z[k][0] / tot,
    avg: Z[k][0] > 0.5 ? Z[k][1] / Z[k][0] : 0, max: Z[k][2],
    se: Z[k][0] > 0.5 ? Z[k][1] / Z[k][0] / mhz : 0,
  });
  return {
    rows: [row("r1", "Reuse-1", mhz), row("tr", "Transitional", (mhz * 2) / 3), row("r3", "Reuse-3", mhz / 3)],
    total: { cells: tot, avg: sumT / tot, max: Math.max(Z.r1[2], Z.tr[2], Z.r3[2]), se: sumT / tot / mhz },
  };
}

/* radius where elevation crosses a given threshold (for the reuse rings) */
function pgRadiusForElev(deg) {
  let lo = 0, hi = 2500;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    if (pgCell(mid).epsDeg > deg) lo = mid; else hi = mid;
  }
  return lo;
}

      <Info label="does it matter how demand is spread out? — yes, but only in one regime">
        Users are not sprinkled evenly over the ground, so the panel offers three spatial patterns, the demand-side
        analogue of the femtocell deployment models on the Serviceability tab.
        <br /><br />
        <strong>Dispersed</strong> puts every active user in a cell of their own — the worst case for beam demand, and
        roughly what very sparse rural traffic looks like. <strong>Organic (Poisson)</strong> scatters users randomly, so
        some cells hold several and many hold none: occupied cells = N × (1 − e<sup>−μ</sup>), where μ is the mean users
        per cell. <strong>Clustered in settlements</strong> confines users to about {(HABITABLE * 100).toFixed(0)}% of
        cells — villages, towns, a highway — leaving most of the patch genuinely empty.
        <br /><br />
        <strong>The regime that matters.</strong> When demand is light enough that occupied cells fit inside 700 beams,
        clustering is a real advantage: fewer distinct cells need a beam, so more of them — often all — can be held
        continuously with no hopping at all. This is the rural case, and it is where the satellite layer is at its best.
        <br /><br />
        <strong>The regime where it stops mattering.</strong> Once occupied cells exceed 700, every beam is busy every
        instant, so the satellite delivers a fixed total of 700 × the per-cell rate no matter how the users are
        arranged. Clustering then changes only <em>who</em> shares with whom, not how much there is: per-user throughput
        comes out the same for all three patterns. Try it — set Suburban and switch between the three; the last row of
        the table doesn't move.
        <br /><br />
        That is the useful lesson. Spatial distribution decides whether you are beam-limited; total demand decides
        whether you are capacity-limited. Rural demand can be beam-limited and fixed by clever scheduling. Urban demand
        is capacity-limited, and no scheduler, clustering assumption, or beam count rescues it — which is precisely the
        density dilemma the rest of this site quantifies.
      </Info>
      <Info label="the whole machine, in order — patch, tiling, hopping, reuse">
        <strong>1 · The patch.</strong> Every point on the ground is served by whichever satellite sees it at the
        steepest angle. That partitions the surface into one patch per satellite, and patch size depends on nothing but
        fleet count: 510 million km² ÷ fleet. At 650 satellites a patch spans a ~500 km radius; at 15,000 it is ~104 km;
        at ~48,000 it is ~58 km.
        <br /><br />
        <strong>2 · The tiling — and why cells are not all the same size.</strong> A satellite steers each beam by a
        fixed angular width. Pointed straight down it lands as an ~8.9 km circle covering ~62 km² (bracket 4.4–19.9 — Panel 1b receipts). Pointed anywhere else
        it strikes the ground obliquely and smears into an ellipse: longer along the look direction by 1/sin ε, and
        wider overall because the slant range is greater. So a patch is <em>not</em> tiled with identical circles — it
        has one circular cell at nadir and progressively larger, more eccentric ellipses toward the rim. At a 500 km
        patch radius the edge cell covers about 100 km², nearly seven times the nadir cell.
        <br /><br />
        <strong>3 · How many cells, really.</strong> Counting cells as if all were nadir-sized overstates the count
        badly. The correct figure integrates the varying cell area across the patch — and it is what this panel now
        uses everywhere, replacing the old nadir-only convention. The difference is large at small fleets and vanishes
        at large ones, because a small patch never strays far from nadir.
        <br /><br />
        <strong>4 · Hopping.</strong> With ~700 beams and more cells than that, the satellite illuminates a subset at a
        time and cycles. Duty = 700 ÷ cells. This is not lost capacity — all 700 beams are working every instant — and
        it is not intermittent service, since hopping runs far faster than anything a user perceives. It is a statement
        about how thinly capacity spreads across ground area. And it is <em>uniform-demand</em> arithmetic: real
        schedulers chase demand, and since most cells over land are empty, a cell with actual users is served far more
        often than its uniform share.
        <br /><br />
        <strong>5 · Reuse varies across the same patch.</strong> Elevation falls as you move from nadir to rim, so the
        reuse regime changes <em>within</em> a single satellite's patch: cells near the centre are steep enough for
        reuse-1 and get the full pool; cells past ~42° are rationed to a third. The coloured bands above show how the
        patch divides. Grow the fleet and the whole patch shrinks inside the steep zone — which is why fleet size buys
        both duty <em>and</em> spectrum reuse at once.
        <br /><br />
        <strong>6 · What the scheduler can actually promise.</strong> Hopping only happens when more cells want
        service than there are beams. A satellite can hold <strong>700 cells continuously</strong> — so if the number of
        cells containing an active user is under 700, every one of them can be served without interruption and duty
        cycle stops mattering entirely. Above that, active cells share beams and each is served 700 ÷ active-cells of
        the time. The break-even share is shown above: at 15,000 satellites roughly a third of all cells can be busy
        before anyone has to share, while at 650 it is under 4%. This is the honest answer to "how many places can get

    if (v) { v.currentTime = t; v.play(); }
  };
  useEffect(() => {
    const v = document.getElementById("roadmap-video");
    if (!v) return;
    let hit = {};
    const onPlay = () => { if (!hit.play) { hit.play = 1; track("video/play", "video:play"); } };
    const onTime = () => {
      if (!v.duration) return;
      const pct = (v.currentTime / v.duration) * 100;
      [25, 50, 75, 95].forEach((m) => {
        if (pct >= m && !hit[m]) { hit[m] = 1; track("video/" + (m === 95 ? "complete" : m + "pct"), "video:" + m); }
      });
    };
    v.addEventListener("play", onPlay);
    v.addEventListener("timeupdate", onTime);
    return () => { v.removeEventListener("play", onPlay); v.removeEventListener("timeupdate", onTime); };

function ServiceabilityTab() {
  /* anchor for deep links */
  const [mhz, setMhz] = useState(20);
  const [fleet, setFleet] = useState(5000);
  const [minMbps, setMinMbps] = useState(3);
  const [activePct, setActivePct] = useState(10);
  const [effMode, setEffMode] = useState("claim");
  const [layer, setLayer] = useState("serve");
  const [stSel, setStSel] = useState(-1);
  const [nMetros, setNMetros] = useState(10);
  const [band, setBand] = useState("2ghz");
  const [femMhz, setFemMhz] = useState(5);
  const [femEff, setFemEff] = useState(3);
  const [covT, setCovT] = useState(90);
  const [depMode, setDepMode] = useState("organic");
  const [hostile, setHostile] = useState(40);
  const [strategy, setStrategy] = useState("sidewalk");
  const [popMode, setPopMode] = useState("uniform");
  const [beamMode, setBeamMode] = useState("ceiling"); // "ceiling" = nadir-class · "elev" = elevation-adjusted
  const eff = effMode === "claim" ? 2.48 : 0.62;
  const areaPer = 510e6 / fleet;
  // ---- serving geometry first: elevation sets the reuse regime, which sets usable MHz ----
  const H_KM = 330, RE_KM = 6371;
  const cellSpacing = 1.075 * Math.sqrt(areaPer);
  const lamCell = cellSpacing / Math.sqrt(3) / RE_KM;
  const cellElev = (Math.atan2(Math.cos(lamCell) - RE_KM / (RE_KM + H_KM), Math.sin(lamCell)) * 180) / Math.PI;
  const sinE = Math.sin((Math.max(cellElev, 8) * Math.PI) / 180);
  const usableMHz = cellElev >= 60 ? mhz : cellElev >= 42 ? (mhz * 2) / 3 : mhz / 3; // Panel 3's reuse thirds
  const perBeamNadir = eff * mhz;                       // ceiling: beam straight overhead, full pool
  const perBeamElev = usableMHz * eff * sinE;           // Panel 3's model at this fleet's elevation
  const perBeam = beamMode === "elev" ? perBeamElev : perBeamNadir;
  const beamsUsable = Math.min(700, areaPer / BEAM_AREA); // beyond ~11.7k satellites a patch can’t hold 700 beams of this size (v92)
  const satCapMbps = beamsUsable * perBeam;
  const satsUS = fleet * (8.1 / 510) * 1.3;
  const servDens = satCapMbps / areaPer / minMbps / (activePct / 100); // servable subscribers per km²
  const feederFlag = satCapMbps > 100000;
  // ---- the typical cell ----
  const beamAlong = BEAM_KM / (sinE * sinE);      // stretch along the look direction
  const beamAcross = BEAM_KM / sinE;              // slant widening
  const cellAreaKm2 = (Math.PI / 4) * beamAlong * beamAcross;
  const dutyFrac = patchStats(fleet).duty;   // area-weighted cell count (Panel 3b), not nadir-sized
  const cellAvgMbps = perBeam * dutyFrac;     // averaged over the hop schedule
  const cellSubs = servDens * cellAreaKm2;    // subscribers this cell can carry
  const cellActive = cellSubs * (activePct / 100);
  const cellReuse = (cellElev >= 60 ? "Reuse-1 · full pool" : cellElev >= 42 ? "Transitional · 2 of 3 lanes" : "Reuse-3 · rationed")
    + " — " + usableMHz.toFixed(1) + " of " + mhz + " MHz usable";
  // Subscriber placement. People are NOT distributed about the beam centre — the beam is a
  // geometric footprint that lands wherever the satellite points, with no relation to settlement.
  // Default is uniform by area; "settlement" clusters them around a town placed off-centre.
  const cellPts = (() => {
    const n = Math.max(1, Math.min(900, Math.round(cellSubs)));
    const out = []; let seed = 20260825;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
    if (popMode === "uniform") {
      for (let i = 0; i < n; i++) {
        const th = 2 * Math.PI * rnd(), rr = Math.sqrt(rnd());   // sqrt => equal area, no centre bias
        out.push([rr * Math.cos(th), rr * Math.sin(th)]);
      }
    } else {
      const tx = -0.34, ty = 0.28;                               // the town sits off-centre, as towns do
      let guard = 0;
      while (out.length < n && guard++ < n * 40) {
        const town = rnd() < 0.72;
        if (town) {
          const u1 = Math.max(1e-9, rnd()), u2 = rnd();
          const r = Math.sqrt(-2 * Math.log(u1)) * 0.16;
          const gx = tx + r * Math.cos(2 * Math.PI * u2), gy = ty + r * Math.sin(2 * Math.PI * u2);
          if (gx * gx + gy * gy <= 1) out.push([gx, gy]);
        } else {
          const th = 2 * Math.PI * rnd(), rr = Math.sqrt(rnd());
          out.push([rr * Math.cos(th), rr * Math.sin(th)]);
        }
      }
    }
    return out;
  })();
  // national aggregation over the census raster
  const satVacatesMetros = band === "2ghz" && (femMhz === 25 || femMhz === 45); // split modes: satellite DL leaves town
  const CELLA = US_DENS.cell * US_DENS.cell;
  const cellsIn = stSel < 0 ? DENS_CELLS : DENS_CELLS.filter((c) => c.si === stSel);
  let popTot = 0, popServ = 0, landFull = 0;
  for (const c of cellsIn) {
    const p = c.d * CELLA;
    popTot += p;
    const inSelMetro = c.mi >= 0 && c.mi < nMetros;
    const fr = satVacatesMetros && inSelMetro ? 0 : Math.min(1, servDens / c.d);
    popServ += p * fr;
    if (fr >= 0.999) landFull++;
  }
  const natPct = (popServ / popTot) * 100;
  const landPct = (landFull / Math.max(1, cellsIn.length)) * 100;
  const scopeName = stSel < 0 ? "the continental US" : US_STATES[stSel].n;
  // ---- femtocell overlay model ----
  const rOut = band === "2ghz" ? 0.18 : 0.11, rIn = band === "2ghz" ? 0.05 : 0.035; // km, calibrated per link-budget scrub
  const rFem = strategy === "blanket" ? rIn : rOut;
  const Cf = covT / 100, cellAf = Math.PI * rFem * rFem;
  const lamOrg = -Math.log(1 - Cf) / cellAf;
  const lam = depMode === "planned" ? (1.05 * Cf) / cellAf : depMode === "organic" ? lamOrg : 1.4 * lamOrg;
  const metroSel = US_METROS.slice(0, nMetros);
  const popM = metroSel.reduce((a, m) => a + m.p, 0);
  const areaM = metroSel.reduce((a, m) => a + m.k, 0);
  const femtos = areaM * lam;
  const perFemMbps = femMhz * femEff;
  const subsPerFem = (perFemMbps / minMbps) / (activePct / 100);
  const femSubCap = femtos * subsPerFem;
  const servedFrac = strategy === "blanket"
    ? Cf * (1 - 0.8 * (hostile / 100)) // pure-cellular: indoor usage (80%) served only in penetrable stock — no WiFi crutch; that's this strategy's premise
    : 0.9 * 0.8 + Cf * 0.2; // WiFi indoors (90% home-internet × 80% indoor share) + sidewalk femto × 20% outdoor share
  const peopleFem = Math.min(popM * servedFrac, femSubCap);
  // hybrid: femto-served metros + satellite everywhere else
  let hybServ = 0, hybTot = 0;
  for (const c of DENS_CELLS) {
    const p = c.d * CELLA; hybTot += p;
    hybServ += (c.mi >= 0 && c.mi < nMetros) ? p * servedFrac : p * Math.min(1, servDens / c.d);
  }
  // map geometry: same frame as Panel 6
  const MW = 5140, kpx = 880 / MW, ox = 10, oy = 8;
  const cpx = US_DENS.cell * kpx;
  let vb = "0 0 900 505";
  if (stSel >= 0) {
    const [x0, y0, x1, y1] = US_STATES[stSel].bb;
    const pad = 30;
    const vx = ox + x0 * kpx - pad, vy = oy + y0 * kpx - pad;
    const vw = (x1 - x0) * kpx + 2 * pad, vh = (y1 - y0) * kpx + 2 * pad;
    vb = `${vx.toFixed(0)} ${vy.toFixed(0)} ${vw.toFixed(0)} ${Math.max(vh, vw * 0.5).toFixed(0)}`;
  }
  const densColor = (d) => {
    const mi = d * 2.59; // people per sq mile
    return mi < 1 ? "#142A45" : mi < 10 ? "#1F4B7A" : mi < 50 ? "#3D7AB5" : mi < 250 ? "#E6B357" : mi < 1000 ? "#E67E4C" : "#D64545";
  };
  const servColor = (fr) => (fr >= 0.999 ? "#2FBF71" : fr >= 0.5 ? "#A8C94C" : fr >= 0.2 ? "#E6B357" : fr >= 0.05 ? "#E67E4C" : "#D64545");
  const DLEG = [["<1", "#142A45"], ["1–10", "#1F4B7A"], ["10–50", "#3D7AB5"], ["50–250", "#E6B357"], ["250–1k", "#E67E4C"], ["≥1k", "#D64545"]];
  const SLEG = [["100%", "#2FBF71"], ["50–99%", "#A8C94C"], ["20–50%", "#E6B357"], ["5–20%", "#E67E4C"], ["<5%", "#D64545"]];
  return (
    <div id="svc-top">
      <div className="card" style={{ borderTop: `2px solid ${C.amber}` }}>
        <div className="eyebrow" style={{ color: C.amber }}>Serviceability — what share of America can this network actually carry? <Src k="serve" topic="derived" /></div>
        <p className="body" style={{ marginBottom: 12 }}>
          The satellite layer's capacity is finite and spreads over each satellite's whole service patch — so the honest
          question is not "is there signal?" but <strong>"what population density saturates the network?"</strong> This
          panel divides per-satellite capacity by patch area to get a servable subscriber density, then holds it against
          the real population of every 40 km cell of the continental US (Census 2024, county-level). Every input is a
          slider; every number inherits the site's measured-vs-claimed bracket.
        </p>
        <div className="tglRow" style={{ marginBottom: 4 }}>
          <button className={"genBtn" + (effMode === "measured" ? " on" : "")} onClick={() => setEffMode("measured")}>Measured efficiency · 0.62 bps/Hz</button>
          <button className={"genBtn" + (effMode === "claim" ? " on" : "")} onClick={() => setEffMode("claim")}>Claim-anchored · 2.48 bps/Hz (4×)</button>
        </div>
        <Info label="what these two efficiencies are, and why they differ 4×">
          Spectral efficiency (bits/second per Hz) is the exchange rate between spectrum and throughput — every capacity
          number here is just MHz × this value. <strong>0.62 is measured</strong>: crowdsourced measurement of the live
          D2C service (UPM) found ~0.52–0.62 bps/Hz — 5 MHz × 0.62 ≈ the ~3 Mbps users actually see. It's low because
          efficiency is bought with signal-to-noise, and a 0.2 W phone with a fingernail antenna 360+ km from its tower
          yields SINR near 0–5 dB: the modem can only run its lowest gears. <strong>2.48 is a construction</strong> —
