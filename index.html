          Each preset is a decision about <em>where the satellite transmits downlink</em>, and it moves numbers on both
          sides of this page. <strong>5 · coexist:</strong> satellite operates n252 everywhere, metros included; femtos
          get only the H-block's 5 MHz; the orbit-alone number still credits the satellite its (tiny) metro service.
          <strong>25 · metro handoff:</strong> the satellite stops transmitting DL over the selected metros — so the
          orbit-alone hero and the satellite map now show those metros as unserved-by-orbit — and the vacancy frees
          2000–2020 to run as terrestrial n70 DL inside them (25 MHz total). Rural satellite capacity is unchanged:
          leaving town costs the countryside nothing, because geography partitions the same MHz — that's the split-mode
          doctrine from the Spectrum tab. <strong>45 · max handoff:</strong> the same, plus 2180–2200 itself repurposed
          as extra terrestrial DL inside metros while remaining satellite DL everywhere else, guard zones at the seams.
          The 3.5 GHz path sidesteps the whole coupling — acquired spectrum owes the satellite nothing — but pays the
          propagation tax (~2.7× the boxes). And at 5 MHz, watch the capacity stat: the binding constraint can flip
          from coverage to spectrum; the panel tells you which is binding at your settings.
        </Info>
        <Info label="the cold-start problem — why handoff is an end-state and roaming is the bridge">
          The handoff presets skip a hard middle: femto coverage needs millions of boxes, boxes come from subscribers,
          and subscribers need non-spotty coverage — a two-sided cold start. The obvious escape — seed femtos on the
          existing dish base, so boxes precede mobile subscribers — is weaker than it looks: Starlink broadband is
          rural-skewed by its own value proposition, so the metro dish base is thin exactly where femtos are needed.
          The realistic sequencing: <strong>near-term femto spectrum is the 5 MHz H-block coexist or acquired C-band
          (5–20 MHz, clean of any satellite coupling)</strong>, with metro capacity bridged by an <strong>urban roaming
          agreement</strong> while density builds. The plumbing exists — SpaceX already provides T-Mobile rural satellite
          coverage under the G-block lease, and urban roaming is that trade's natural reciprocal leg — and the precedent
          is pointed: DISH/Boost ran on AT&T roaming while building its own network, the classic attacker's playbook,
          and SpaceX bought its spectrum from that very company. Every attacker carrier starts on someone else's towers;
          the question is only sequencing. The tell to watch: the July 2027 Upper C-band auction — bidding means buying
          the clean femto band; sitting out means betting the bridge carries them to the 2 GHz handoff end-state.
        </Info>
        <Info label="is 3 bps/Hz the right small-cell efficiency?">
          It's the defensible middle of a documented bracket. 3GPP's own LTE-Advanced urban targets: 2.4 bps/Hz/cell
          average with 2×2 MIMO, 2.6 with 4×2, 3.7 with 4×4 — our 3 is "a good 4×2 box." Below it, reality: measured
          macro networks run ~1.5–2.2, but small cells beat macro because short links mean high SINR and high-order
          modulation. Above it, the ceiling: ITU's 9 bps/Hz indoor-hotspot figure assumes 32-antenna massive-MIMO base
          stations, not consumer hardware — and a dense reuse-1 femto grid pays a self-interference tax that caps
          consumer boxes near ~4.5. Honest bracket: 2 (interference-limited 2×2) to ~4.5 (coordinated 4×4); the slider's
          top end is for stress-testing. Note the symmetry with the satellite layer: the femto 3 sits <em>above</em> its
          measured baseline (conservative), while the satellite 2.48 sits 4× above its measured baseline (aggressive) —
          same currency, opposite epistemic postures.
        </Info>
        {strategy === "blanket" && <Info label="the hostile-construction slider — buildings no outdoor signal enters">
          This slider exists only in the blanket strategy, because only here does the outdoor femto have to reach phones
          <em> inside</em> buildings (in the sidewalk strategy, indoor phones use WiFi calling on the home router, so
          walls are irrelevant). Building entry loss is bimodal, not smooth. Penetrable stock (wood-frame, ordinary glass) costs ~8–15 dB — an
          outdoor femto's signal survives. Hostile stock — concrete block, metal mesh screens, foil-backed sheathing,
          low-E metallized glass — costs 25–40+ dB, a wall no consumer-power outdoor network climbs at any density
          (recovering 30 dB would take ~1,000× the power). The slider is the hostile share of the building stock
          (default 40% for urban America's mix; Phoenix ≠ Seattle, so it's exposed). It caps the <em>blanket</em>
          strategy, which is modeled as <strong>pure cellular</strong> — no WiFi crutch, because native indoor service
          without WiFi dependency is the only reason to pay the blanket's 10×+ box count: served = coverage ×
          (1 − 0.8 × hostile), the 0.8 being the indoor share of usage. Drag it right and watch served-people fall while the box count holds still —
          you can't buy through walls with more boxes; hostile stock is a ceiling, not a densification problem. The
          escape hatch is the other strategy: hand indoors to WiFi and the wall problem disappears (along with the need
          for 10× the boxes).
        </Info>}
        <div className="tglRow" style={{ marginBottom: 8 }}>
          <button className={"genBtn" + (depMode === "planned" ? " on" : "")} onClick={() => setDepMode("planned")}>Planned grid ×1.0</button>
          <button className={"genBtn" + (depMode === "organic" ? " on" : "")} onClick={() => setDepMode("organic")}>Organic (Poisson) ×{(-Math.log(1 - covT / 100) / (covT / 100)).toFixed(1)}</button>
          <button className={"genBtn" + (depMode === "clustered" ? " on" : "")} onClick={() => setDepMode("clustered")}>Clustered organic ×{(1.4 * -Math.log(1 - covT / 100) / (covT / 100)).toFixed(1)}</button>
        </div>
        <Info label="the three deployment buttons — the price of disorder">
          Same radio, same radius, same coverage target — the multiplier is purely <em>where the boxes end up</em>.
          <strong> Planned ×1.0</strong>: engineered placement, minimal overlap, the theoretical minimum (and mostly a
          fiction for consumer hardware — SpaceX doesn't choose which rooftops exist). <strong>Organic (Poisson)</strong>:
          boxes appear wherever subscribers sign up; random placement double-covers some streets while leaving holes, and
          drowning the holes means overbuilding everywhere — covered fraction = 1 − e^(−density·πr²), so 90% costs ×2.6,
          and the penalty is nonlinear in the target (80% → ×2.0, 95% → ×3.7): the last few percent are brutally
          expensive. <strong>Clustered organic</strong>: adoption isn't even random — it clumps by neighborhood and
          demographics, clumps redundantly cover each other while gaps persist; ×1.4 over Poisson is a planning-grade
          estimate, the softest number of the three. The strategic read: the 3× spread between the buttons means
          placement discipline is worth more boxes than most radio parameters — a company that can steer the femto to
          map holes (or ship it with targeted dishes) moves from ×3.6 toward ×1.0 and saves millions of units. Placement
          policy is a hardware-budget lever.
        </Info>
        <div className="statGrid">
          <div className="stat" style={{ borderColor: C.blue }}>
            <div className="statL">Femtocells required — top {nMetros} metros, {covT}% outdoor, {depMode}</div>
            <div className="statV" style={{ color: C.blue, fontSize: 30, fontWeight: 700 }}>{femtos >= 995e3 ? (femtos / 1e6).toFixed(1) + "M" : Math.round(femtos / 1e3) + "k"}
              <span style={{ fontSize: 12, color: C.dim, fontWeight: 400 }}> boxes · ~{Math.round(lam)} per km² · {Math.round(rFem * 1000)} m cells</span></div>
          </div>
          <div className="stat"><div className="statL">People served in overlay metros</div><div className="statV" style={{ fontSize: 22 }}>{(peopleFem / 1e6).toFixed(0)}M <span style={{ fontSize: 12, color: C.dim }}>of {(popM / 1e6).toFixed(0)}M ({(servedFrac * 100).toFixed(0)}% — {strategy === "sidewalk" ? "WiFi carries indoors" : "pure-cellular blanket: hostile stock goes unserved indoors"})</span></div></div>
          <div className="stat"><div className="statL">Capacity headroom per femto</div><div className="statV" style={{ fontSize: 22 }}>{perFemMbps.toFixed(0)} Mbps → ~{Math.round(subsPerFem)} subs <span style={{ fontSize: 12, color: femSubCap < popM * servedFrac ? C.red : C.dim }}>· network cap ~{(femSubCap / 1e6).toFixed(0)}M ({(femSubCap / Math.max(popM, 1) * 100).toFixed(0)}% of metro pop) — {femSubCap < popM * servedFrac ? "CAPACITY BINDS at this spectrum" : "coverage binds, not capacity"}</span></div></div>
        </div>
        <div style={{ overflowX: "auto", marginTop: 10 }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "var(--mono)", fontSize: 11.5 }}>
            <thead><tr style={{ color: C.dim, textAlign: "left" }}><th style={{ padding: "4px 8px" }}>METRO CLUSTER</th><th>POP ≥250/mi²</th><th>AREA</th><th>FEMTOS</th></tr></thead>
            <tbody>
              {metroSel.slice(0, 8).map((m, i) => (
                <tr key={i} style={{ borderTop: `1px solid ${C.line}`, color: C.text }}>
                  <td style={{ padding: "4px 8px" }}>{m.n}</td><td>{(m.p / 1e6).toFixed(1)}M</td><td>{(m.k / 1000).toFixed(1)}k km²</td><td style={{ color: C.blue }}>{(m.k * lam / 1e6) >= 0.95 ? (m.k * lam / 1e6).toFixed(1) + "M" : Math.round(m.k * lam / 1e3) + "k"}</td>
                </tr>
              ))}
              {nMetros > 8 && <tr style={{ borderTop: `1px solid ${C.line}`, color: C.dim }}><td style={{ padding: "4px 8px" }}>… +{nMetros - 8} more</td><td>{((popM - metroSel.slice(0, 8).reduce((a, m) => a + m.p, 0)) / 1e6).toFixed(0)}M</td><td>{((areaM - metroSel.slice(0, 8).reduce((a, m) => a + m.k, 0)) / 1000).toFixed(0)}k km²</td><td></td></tr>}
            </tbody>
          </table>
        </div>
        <p className="body" style={{ fontSize: 12, color: C.dim, marginTop: 10 }}>
          Model (derived): radii from a scrubbed consumer-class link budget calibrated against field WiFi-deployment
          experience — outdoor/sidewalk ~180 m at 2 GHz (~110 m at 3.5), indoor-grade ~50 m (~35 m), the ConfigLab's
          original anchor; count = qualifying area × density, density = coverage factor ÷ π r² (organic Poisson pays
          ×{(-Math.log(1 - covT / 100) / (covT / 100)).toFixed(1)} over planned at {covT}%; clustered adoption ×1.4 more). The 3.5 GHz toggle shows the strategic
          sting: cheaper spectrum ≈ {(Math.pow(0.18 / 0.11, 2)).toFixed(1)}× more boxes — cheap spectrum is expensive in hardware. Sidewalk + WiFi
          serves ~{(0.9 * 0.8 * 100).toFixed(0)}% of people indoors via home broadband (90% home-internet × 80% indoor usage) at zero licensed
          spectrum cost, which is why it's the SpaceX-likely strategy: the dish is already the backhaul, and hostile
          construction — the buildings no outdoor signal enters — becomes the customer's WiFi problem, already solved.
        </p>
      </div>
      <TierSystem />
      <div className="card">
        <div className="eyebrow">Model, provenance, and honest limits</div>
        <p className="body" style={{ fontSize: 13 }}>
          Servable density = per-satellite capacity (700 beams × MHz × bps/Hz, the Panel 1b / budget-card chain) ÷ service
          patch area (510M km² ÷ fleet) ÷ minimum busy-hour rate ÷ active fraction — the per-<em>patch</em> constraint, not
          per-beam: a beam's 17 concurrent users only exist where it dwells, and duty cycles run 5–35%. The uniform-spread
          assumption is conservative for rural cells (real schedulers chase demand) and roughly right where demand exceeds
          supply. Busy-hour active share defaults to 10% (~10:1 oversubscription; industry dimensioning runs ~17:1 at
          comparable rate targets). Population: Census 2024 county estimates on the site's 40 km grid — deliberately
          coarser than census blocks because service patches span 200–900 km; block-level precision would be false. The
          verdict this map renders at almost any setting: <strong>the satellite layer is a rural-coverage machine — the
          green is real and vast in area, the red is where the femtocell layer earns its place in the hybrid
          architecture.</strong>
        </p>
      </div>
    </div>
  );
}

// Analytics: emit a virtual pageview for SPA navigation. Cloudflare's beacon tracks
// history changes, so a pushState here registers as a distinct page. Provider-agnostic:
// if a custom-event tool (umami/plausible) is ever added, it fires there too.
function track(path, label) {
  try {
    if (typeof window === "undefined") return;
    const url = window.location.pathname + "?p=" + encodeURIComponent(path);
    window.history.pushState({ p: path }, "", url);
    if (window.umami && window.umami.track) window.umami.track(label || path);
    if (window.plausible) window.plausible(label || path);
  } catch (e) {}
}

      <header className="hdr">
