/* ------------------------- CONFIGURATION LAB ------------------------- */
/* Each block is assigned SAT, TERR, SPLIT (geographic partition: counts in
   both zones, in different places), or OFF. Rules encode reality:
   G-block is satellite-only (lease). Sat use of H/AWS-3 is standards-gated. */

const BLOCKS = [
  { id: "aws3", label: "1695–1710", sub: "AWS-3 · UL only · 15 MHz", ulMHz: 15, dlMHz: 0, allowed: ["terr", "sat", "split", "off"], satGate: "satellite SUL pending 3GPP NTN + FCC Earth-to-space treatment" },

  { id: "h", label: "H-block", sub: "1915/1995 · 2×5 · owned", ulMHz: 5, dlMHz: 5, allowed: ["terr", "sat", "split", "off"], satGate: "satellite use pending 3GPP NTN standardization" },
  { id: "a4main", label: "2000–2020", sub: "AWS-4 · the switch-hitter · 20 MHz", ulMHz: 20, dlMHz: 20, allowed: ["sat", "terr", "split", "off"], satGate: null, switcher: true },
  { id: "a4dl", label: "2180–2200", sub: "AWS-4 DL / n66 SDL · 20 MHz", ulMHz: 0, dlMHz: 20, allowed: ["sat", "terr", "split", "off"], satGate: null },
];

/* Spectral efficiency anchors (Mbps per MHz):
   SAT DL gen1 0.62 = UPM measurement (≈ FCC's 9-yr 600 kbps/MHz/beam DL milestone);
   SAT DL v2 2.48 = company-claimed 4× bandwidth-per-beam uplift (claim);
   SAT UL gen1 0.10 = FCC 2-yr milestone floor; v2 0.30 = 9-yr milestone / claims;
   TERR: user-set 2–6 bps/Hz small-cell efficiency. */
const SAT_EFF = { gen1: { dl: 0.62, ul: 0.10 }, v2: { dl: 2.48, ul: 0.30 } };

function calcZones(cfg) {
  const inSat = (a) => a === "sat" || a === "split";
  const inTerr = (a) => a === "terr" || a === "split";
  let satDL = 0, satUL = 0, terrDL = 0, terrUL = 0;
  const gates = [];
  for (const b of BLOCKS) {
    const a = cfg[b.id];
    if (inSat(a)) {
      // a4main in sat mode contributes UL only (n252 uplink); its DL twin is a4dl
      satUL += b.id === "a4main" ? 20 : b.ulMHz;
      satDL += b.id === "a4main" ? 0 : b.dlMHz;
      if (b.satGate) gates.push(`${b.label}: ${b.satGate}`);
    }
    if (inTerr(a)) {
      // a4main in terr mode contributes DL only (n70 downlink)
      terrDL += b.id === "a4main" ? 20 : b.dlMHz;
      terrUL += b.id === "a4main" ? 0 : b.ulMHz;
    }
  }
  const eff = SAT_EFF[cfg.gen];
  return {
    satDLMHz: satDL, satULMHz: satUL, terrDLMHz: terrDL, terrULMHz: terrUL,
    satDLMbps: satDL * eff.dl, satULMbps: satUL * eff.ul,
    terrDLMbps: terrDL * cfg.terrEff, terrULMbps: terrUL * cfg.terrEff * 0.6,
    gates,
    boundary: cfg.a4main === "split",
  };
}

const ASSIGN_LABEL = { sat: "SAT", terr: "TERR", split: "SPLIT", off: "OFF" };
const ASSIGN_COLOR = { sat: C.amber, terr: C.blue, split: "url(#splitGrad)", off: C.line };

function ConfigLab({ cfg, setCfg, compact }) {
  const z = calcZones(cfg);
  const activeScen = SCENARIOS.find((s) =>
    Object.entries(s.cfg).every(([k, v]) => cfg[k] === v)
  );

  const cycle = (b) => {
    const cur = cfg[b.id];
    const i = b.allowed.indexOf(cur);
    const next = b.allowed[(i + 1) % b.allowed.length];
    setCfg({ ...cfg, [b.id]: next });
  };

  const totMHz = BLOCKS.reduce((s, b) => s + Math.max(b.ulMHz + b.dlMHz, 15), 0); // strip widths
  let acc = 0;
  const stripW = 900, stripH = 66;

  return (
    <div className="card" style={{ borderTop: `2px solid ${C.green}` }}>
      <div className="eyebrow" style={{ color: C.green }}>
        Configuration lab · assign every block, read the throughput{compact ? " · configured here or in the Spectrum tab" : ""}
      </div>
      {!compact && (
        <p className="body" style={{ marginBottom: 12 }}>
          SpaceX's 75 MHz isn't one network — it's a decision space. Click any block to cycle its assignment:{" "}
          <strong style={{ color: C.amber }}>SAT</strong> (satellite zone),{" "}
          <strong style={{ color: C.blue }}>TERR</strong> (femtocell zone),{" "}
          <strong>SPLIT</strong> (geographic partition — both, in different places), or OFF. Presets below are the
          strategies actually on the table. Zones are disjoint geographies, so SAT and TERR numbers coexist nationally.
        </p>
      )}

      <div className="tglRow" style={{ marginBottom: 14 }}>
        {SCENARIOS.map((s) => (
          <button key={s.id} onClick={() => setCfg({ ...s.cfg, terrEff: cfg.terrEff })}
            className={"scenBtn" + (activeScen && activeScen.id === s.id ? " on" : "")}>{s.name}</button>
        ))}
      </div>
      {activeScen && <p className="body" style={{ fontSize: 13, color: C.dim, marginBottom: 12 }}>{activeScen.d}</p>}

      {/* allocation strip */}
      <svg viewBox={`0 0 ${stripW} ${stripH + 34}`} style={{ width: "100%", display: "block" }} role="img" aria-label="Spectrum block allocation strip">
        <defs>
          <linearGradient id="splitGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stopColor={C.amber} /><stop offset="49%" stopColor={C.amber} />
            <stop offset="51%" stopColor={C.blue} /><stop offset="100%" stopColor={C.blue} />
          </linearGradient>
        </defs>
        {BLOCKS.map((b) => {
          const w = (Math.max(b.ulMHz + b.dlMHz, 15) / totMHz) * (stripW - 8 * (BLOCKS.length - 1));
          const x = acc; acc += w + 8;
          const a = cfg[b.id];
          return (
            <g key={b.id} onClick={() => cycle(b)} style={{ cursor: "pointer" }}>
              <rect x={x} y="8" width={w} height={stripH - 16} rx="4"
                fill={a === "off" ? "transparent" : ASSIGN_COLOR[a]}
                fillOpacity={a === "split" ? 1 : a === "off" ? 0 : 0.28}
                stroke={a === "sat" ? C.amber : a === "terr" ? C.blue : a === "split" ? C.text : C.line}
                strokeWidth="1.3" strokeDasharray={a === "off" ? "4 3" : "0"} />
              <text x={x + w / 2} y={stripH / 2 - 3} textAnchor="middle" fill={C.text} fontSize="12" fontWeight="600" fontFamily="var(--disp)">{b.label}</text>

/* ------------------------- TRAJECTORY ------------------------- */

function Trajectory({ phase, setPhase }) {
  const W = 900, H = 190;
  const pathD = `M 40 ${H - 34} C ${W * 0.3} ${H - 40}, ${W * 0.55} 66, ${W - 40} 38`;
  const pts = PHASES.map((p) => {
    const t = 0.08 + p.orbit * 0.9;
    const x0 = 40, y0 = H - 34, x1 = W * 0.3, y1 = H - 40, x2 = W * 0.55, y2 = 66, x3 = W - 40, y3 = 38;
    const mt = 1 - t;
    const x = mt*mt*mt*x0 + 3*mt*mt*t*x1 + 3*mt*t*t*x2 + t*t*t*x3;
    const y = mt*mt*mt*y0 + 3*mt*mt*t*y1 + 3*mt*t*t*y2 + t*t*t*y3;
    return { x, y };
  });
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block" }} role="img"
      aria-label="Trajectory from today's texting service to a scaled carrier">
      <line x1="0" y1={H - 18} x2={W} y2={H - 18} stroke={C.line} strokeWidth="1" />
      <text x="42" y={H - 4} fill={C.dim} fontSize="10" fontFamily="var(--mono)" letterSpacing="0.1em">GROUND · AUG 2026</text>
      <text x={W - 42} y="22" fill={C.dim} fontSize="10" fontFamily="var(--mono)" letterSpacing="0.1em" textAnchor="end">SCALED SERVICE · 2030+</text>
      <path d={pathD} fill="none" stroke={C.line} strokeWidth="1.5" strokeDasharray="1 5" />
      <path d={pathD} fill="none" stroke={C.amber} strokeWidth="2"
        strokeDasharray="1200" strokeDashoffset={1200 - (200 + PHASES[phase].orbit * 1000)}
        style={{ transition: "stroke-dashoffset 700ms cubic-bezier(.4,0,.2,1)" }} opacity="0.85" />
      {pts.map((pt, i) => (
        <g key={i} onClick={() => setPhase(i)} style={{ cursor: "pointer" }}>
          <circle cx={pt.x} cy={pt.y} r="16" fill="transparent" />
          <circle cx={pt.x} cy={pt.y} r={i === phase ? 7 : 4.5}
            fill={i === phase ? C.amber : C.panel}
            stroke={i <= phase ? C.amber : C.dim} strokeWidth="1.5"
            style={{ transition: "all 300ms" }} />
          <text x={pt.x} y={pt.y - 14} textAnchor="middle" fill={i === phase ? C.text : C.dim}
            fontSize="10" fontFamily="var(--mono)" letterSpacing="0.08em">P{i}</text>
        </g>
      ))}
    </svg>
  );
}

function PhysicsTab({ cfg, setCfg }) {
  const [env, setEnv] = useState("rural");
  const [users, setUsers] = useState(ENVS.rural.users);
  const [indoor, setIndoor] = useState(ENVS.rural.indoor);

  const pickEnv = (k) => { setEnv(k); setUsers(ENVS[k].users); setIndoor(ENVS[k].indoor); };

  const z = calcZones(cfg);
  const outdoorUsers = Math.max(1, Math.round(users * (1 - indoor / 100)));
  const indoorUsers = users - outdoorUsers;
  const perOutdoor = z.satDLMbps / outdoorUsers;
  const e = ENVS[env];
  const femtoLive = z.terrDLMbps > 0;

  const satDensity = z.satDLMbps / 2000;
  const femtoDensity = femtoLive ? z.terrDLMbps / 0.008 : 0;
  const logMax = Math.log10(Math.max(femtoDensity, 1000) * 2);
  const bar = (v) => Math.max(2, (Math.log10(Math.max(v, 0.001)) + 3) / (logMax + 3) * 100);

  return (
    <div>
      <ConfigLab cfg={cfg} setCfg={setCfg} compact />

      <div className="card">
        <div className="eyebrow">Pick the terrain — everything below responds</div>
        <div className="tglRow">

          ))}
        </div>
        <p className="body" style={{ marginTop: 12 }}>{e.blurb}</p>
      </div>

      <div className="split">
        <div className="card">
          <div className="eyebrow">Why this is hard: the 50–60 dB problem</div>
          <p className="body">A cell tower is a few hundred meters away pushing 20–40 W. A Starlink satellite is ~550 km away listening to a &lt;0.25 W phone with a fingernail-sized antenna.</p>
          {[
            { l: "Terrestrial path loss", v: 45, t: "~100–120 dB", c: C.blue },
            { l: "LEO path loss (550 km)", v: 100, t: "~160–170 dB", c: C.amber },
            { l: `+ building penetration (${e.label})`, v: env === "rural" ? 12 : env === "suburban" ? 22 : 32, t: env === "rural" ? "mostly avoidable" : "~20–30 dB more — satellite can't follow", c: C.red },
          ].map((r, i) => (
            <div key={i} style={{ marginTop: 14 }}>
              <div className="barHead"><span>{r.l}</span><span style={{ color: r.c }}>{r.t}</span></div>
              <div className="meter big"><div className="meterFill" style={{ width: r.v + "%", background: r.c }} /></div>
            </div>
          ))}
          <p className="body" style={{ marginTop: 16 }}>
            The fixes: ~25 m² phased arrays today (5× larger next-gen; AST's BlueBirds go to ~223 m²), satellite-side Doppler
            pre-compensation at 7.5 km/s, 3GPP NTN timing (Rel-17 → Rel-19), laser ISLs to hand off between ~3-minute passes,
            and dropping shells to 340–360 km for ~2.5 dB back. Physics you can't fix: steel and concrete — measured median
            RSRP −121 dBm vs −97 dBm terrestrial, and indoors the satellite simply isn't there. That's the femtocell's job.
          </p>
        </div>

        <div className="card">
          <div className="eyebrow">What the configured network delivers here</div>
          <div className="capOut">
            <div>
              <div className="capNum" style={{ color: C.amber }}>{z.satDLMbps.toFixed(1)}<span className="capUnit"> Mbps</span></div>
              <div className="capL">satellite, per beam ({z.satDLMHz} MHz DL{cfg.gen === "v2" ? ", claim-anchored" : ""})</div>
            </div>
            <div>
              <div className="capNum" style={{ color: C.blue }}>{perOutdoor.toFixed(2)}<span className="capUnit"> Mbps</span></div>
              <div className="capL">per outdoor satellite user ({outdoorUsers} of {users} active)</div>
            </div>
          </div>

          <label className="sliderL">Active users in the beam footprint: <strong>{users}</strong>
            <input type="range" min="1" max="300" value={users} onChange={(ev) => setUsers(+ev.target.value)} />
          </label>
          <label className="sliderL" style={{ marginTop: 10 }}>Share of usage indoors: <strong>{indoor}%</strong>
            <input type="range" min="0" max="95" value={indoor} onChange={(ev) => setIndoor(+ev.target.value)} />
          </label>

          <div className="indoorNote" style={{ borderColor: femtoLive && e.femto ? C.blue : C.red }}>

              ? femtoLive && e.femto
                ? <><strong style={{ color: C.blue }}>{indoorUsers} indoor user{indoorUsers > 1 ? "s" : ""}</strong> are invisible to the satellite — served only where an n70 femtocell happens to be, at up to <strong style={{ color: C.blue }}>{z.terrDLMbps.toFixed(0)} Mbps ↓ / {z.terrULMbps.toFixed(0)} ↑ per cell</strong> ({z.terrDLMHz}+{z.terrULMHz} MHz), shared within ~50 m islands.</>
                : e.femto
                  ? <><strong style={{ color: C.red }}>{indoorUsers} indoor user{indoorUsers > 1 ? "s" : ""}</strong> have no terrestrial layer in this configuration — assign blocks to TERR in the lab above to serve them.</>
                  : <><strong style={{ color: C.red }}>{indoorUsers} indoor user{indoorUsers > 1 ? "s" : ""}</strong> are unreachable: no femtocell layer here, and the satellite can't penetrate. In rural terrain this mostly means "step outside."</>
              : <>Everyone's outdoors — the satellite's best case.</>}
          </div>
        </div>
      </div>

      <div className="card">
        <div className="eyebrow">Capacity density — why neither layer can do the other's job (log scale, illustrative)</div>
        {[
          { l: `Configured satellite beam spread over ~2,000 km²`, v: satDensity, c: C.amber, t: `${satDensity < 0.01 ? satDensity.toFixed(4) : satDensity.toFixed(2)} Mbps/km²` },
          { l: femtoLive ? `Configured n70 femtocell (${z.terrDLMbps.toFixed(0)} Mbps over ~50 m radius)` : "Femtocell layer — no blocks assigned TERR", v: femtoDensity, c: C.blue, t: femtoLive ? `~${Math.round(femtoDensity).toLocaleString()} Mbps/km²` : "—" },
        ].map((r, i) => (
          <div key={i} style={{ marginTop: 12 }}>
            <div className="barHead"><span>{r.l}</span><span style={{ color: r.c, fontFamily: "var(--mono)" }}>{r.t}</span></div>
            <div className="meter big"><div className="meterFill" style={{ width: bar(r.v) + "%", background: r.c }} /></div>
          </div>
        ))}
        <p className="body" style={{ marginTop: 14, color: C.dim, fontSize: 13 }}>
          Six-plus orders of magnitude apart in the hybrid configurations — and that's the whole strategy in one chart. The
          satellite layer buys ubiquity (every km² gets <em>something</em>); the femtocell layer buys intensity (huge Mbps/km²,
          in dots tens of meters wide). Incumbents solve the pairing with ~250k macro towers and &gt;1M small cells; SpaceX's
          bet is satellites + dish-mounted femtocells approximate it without the tower capex. The V2 150 Mbps headline is a
          peak, single-user, best-case claim.
        </p>
      </div>

      <DeployClock compact />
    </div>
  );
}

/* Fleet scale is the capacity story: total D2C capacity ≈ per-beam ×
   beams/sat × satellites overhead. This models how fast the authorized
   15,000 can actually exist — and what it costs to keep it existing. */

const CADENCE_PRESETS = [
  { id: "f9", name: "Falcon 9 only", per: 15, pm: 4, note: "~15 next-gen D2C birds per F9 (5× arrays are heavy), 4 dedicated launches/mo" },
  { id: "ship2", name: "Starship · 2/mo", per: 55, pm: 2, note: "Starship flying, cadence lagging" },
  { id: "ship4", name: "Starship · 4/mo (target)", per: 55, pm: 4, note: "The filing math: ~1,200 sats in six months" },
  { id: "ship8", name: "Starship · 8/mo", per: 60, pm: 8, note: "The bull-case cadence" },
];

function DeployClock({ compact }) {
  const [per, setPer] = useState(55);
  const [pm, setPm] = useState(4);
  const FLEET = 15000, LIFE = 5, SERVICE = 2000;
  const monthly = per * pm;
  const yearsToFleet = FLEET / (monthly * 12);
  const monthsToService = SERVICE / monthly;
  const sustainPerMonth = FLEET / LIFE / 12 / per; // launches/mo to replace 3,000/yr
  const steadyState = Math.round(per * pm * 12 * LIFE); // fleet this cadence can sustain
  const starved = steadyState < FLEET;
  const preset = CADENCE_PRESETS.find((p) => p.per === per && p.pm === pm);
  return (
    <div className="card" style={{ borderTop: `2px solid ${C.red}` }}>
      <div className="eyebrow" style={{ color: C.red }}>
        The deployment clock — how long until 15,000 D2C satellites exist{compact ? " (capacity = per-beam × beams × satellites overhead)" : ""}
      </div>
      {!compact && (
        <p className="body" style={{ marginBottom: 12 }}>
          The 15,000-satellite authorization is a ceiling, not a fleet. Satellites at 226–435 km live ~5 years in measurable
          atmosphere, so the constellation is a treadmill: every cadence below buys both a buildout speed <em>and</em> a maximum
          sustainable fleet. Set a launch tempo and read the consequences.
        </p>
      )}
      <div className="tglRow" style={{ marginBottom: 12 }}>
        {CADENCE_PRESETS.map((p) => (
          <button key={p.id} onClick={() => { setPer(p.per); setPm(p.pm); }}
            className={"genBtn" + (preset && preset.id === p.id ? " on" : "")}>{p.name}</button>
        ))}
      </div>
      {preset && <p className="body" style={{ fontSize: 12.5, color: C.dim, marginBottom: 10 }}>{preset.note}</p>}
      <div className="split" style={{ gap: 12 }}>
        <div>
          <label className="sliderL">D2C satellites per launch: <strong>{per}</strong>
            <input type="range" min="10" max="80" value={per} onChange={(e) => setPer(+e.target.value)} />
          </label>
          <label className="sliderL" style={{ marginTop: 10 }}>Dedicated launches per month: <strong>{pm}</strong>
            <input type="range" min="1" max="10" value={pm} onChange={(e) => setPm(+e.target.value)} />
          </label>
        </div>
        <div className="zoneNums" style={{ alignItems: "flex-start" }}>
          <div>
            <span className="zN" style={{ color: C.amber }}>{monthsToService < 1 ? "<1" : monthsToService.toFixed(0)}</span><span className="zU">mo</span>
            <div className="zM">to a ~2,000-sat continuous-coverage-class fleet (illustrative)</div>
          </div>
          <div>
            <span className="zN" style={{ color: yearsToFleet > 8 ? C.red : C.text }}>{yearsToFleet.toFixed(1)}</span><span className="zU">yrs</span>
            <div className="zM">to 15,000 ({Math.ceil(FLEET / per).toLocaleString()} launches; from 2027 → ~{(2027 + yearsToFleet).toFixed(0)})</div>
          </div>
          <div>
            <span className="zN" style={{ color: sustainPerMonth > pm ? C.red : C.green }}>{sustainPerMonth.toFixed(1)}</span><span className="zU">launches/mo</span>
            <div className="zM">forever, just to replace ~3,000 sats/yr at 5-yr life</div>
          </div>

        .evtHead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
        .evtDate { font-family: var(--mono); font-size: 11.5px; color: ${C.amber}; }
        .evtBody { font-size: 13.5px; line-height: 1.55; color: #C7D1E2; }
        .gate { font-size: 13.5px; line-height: 1.55; color: #C7D1E2; padding: 8px 0 8px 14px; position: relative; }
        .gate::before { content: "▸"; position: absolute; left: 0; color: ${C.red}; }
        .bandDetail { margin-top: 14px; padding: 12px 16px; background: ${C.panel2}; border-radius: 6px; }
        .bandFreq { font-family: var(--mono); font-size: 14px; color: ${C.text}; margin-bottom: 8px; }
        .bandOwn { font-size: 11.5px; color: ${C.dim}; }
        .tallyRow { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid ${C.line};
          font-size: 14px; color: #C7D1E2; }
        .bbGrid { display: flex; flex-direction: column; }
        .bbRow { display: grid; grid-template-columns: 110px 170px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid ${C.line}; }
        .bbRow:last-child { border-bottom: none; }
        @media (max-width: 700px) { .bbRow { grid-template-columns: 1fr; gap: 4px; } }
        .bbBand { font-weight: 600; font-size: 13.5px; }
        .bbFreq { font-family: var(--mono); font-size: 11.5px; color: ${C.amber}; line-height: 1.5; }
        .bbRole { font-size: 13px; color: #C7D1E2; line-height: 1.55; }
        .barHead { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: ${C.dim}; gap: 10px; }
        .tglRow { display: flex; gap: 8px; flex-wrap: wrap; }
        .genBtn, .envBtn, .yearBtn, .scenBtn { font-family: var(--mono); font-size: 11.5px; background: ${C.panel2}; color: ${C.dim};
          border: 1px solid ${C.line}; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
        .genBtn.on, .yearBtn.on { color: ${C.amber}; border-color: ${C.amber}; }
        .envBtn.on { color: ${C.blue}; border-color: ${C.blue}; background: ${C.blueDim}; }
        .scenBtn.on { color: ${C.green}; border-color: ${C.green}; background: rgba(107,219,143,0.10); }
        .capOut { display: flex; gap: 34px; flex-wrap: wrap; margin: 8px 0 14px; }
        .capNum { font-family: var(--mono); font-size: 38px; font-weight: 500; line-height: 1; }
        .capUnit { font-size: 15px; color: ${C.dim}; }
        .capL { font-size: 12px; color: ${C.dim}; margin-top: 6px; font-family: var(--mono); }
        .sliderL { display: block; font-size: 13px; color: #C7D1E2; }
        .sliderL input { width: 100%; margin-top: 8px; accent-color: ${C.amber}; }
        .indoorNote { margin-top: 14px; padding: 11px 14px; background: ${C.panel2}; border-left: 2px solid;
          border-radius: 0 6px 6px 0; font-size: 13px; line-height: 1.55; color: #C7D1E2; }
        .zoneGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
        @media (max-width: 780px) { .zoneGrid { grid-template-columns: 1fr; } }
        .zone { background: ${C.panel2}; border: 1px solid ${C.line}; border-top: 2px solid; border-radius: 6px; padding: 14px; }
        .zoneHead { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; margin-bottom: 10px; }
        .zoneNums { display: flex; gap: 30px; flex-wrap: wrap; }
        .zN { font-family: var(--mono); font-size: 32px; font-weight: 500; }
        .zU { font-size: 13px; color: ${C.dim}; margin-left: 5px; }
        .zM { font-family: var(--mono); font-size: 11px; color: ${C.dim}; margin-top: 3px; }
        .labNotes { margin-top: 12px; }
        .labNote { font-family: var(--mono); font-size: 11.5px; color: ${C.dim}; line-height: 1.7; }
        .mswGrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 16px; }
        @media (max-width: 860px) { .mswGrid { grid-template-columns: 1fr; } }
        .mswNote { background: ${C.panel2}; border: 1px solid ${C.line}; border-top: 2px solid; border-radius: 6px;
          padding: 12px 14px; font-size: 12.5px; line-height: 1.6; color: #C7D1E2; }
        .ledger { border: 1px solid ${C.line}; border-radius: 6px; overflow: hidden; }
        .ledgerRow { display: grid; grid-template-columns: 150px 1fr 1fr; gap: 10px; padding: 10px 14px;
          border-bottom: 1px solid ${C.line}; font-size: 12.5px; line-height: 1.5; color: #C7D1E2; align-items: center; }
        .ledgerRow:last-child { border-bottom: none; }
        .ledgerRow.head { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
          color: ${C.dim}; background: ${C.panel2}; }
        .ledgerRow.hot { background: ${C.amberDim}; }
        .ledgerRow.hot .ledgerF { color: ${C.amber}; font-weight: 600; }
        .ledgerF { font-family: var(--mono); font-size: 12px; }
        @media (max-width: 700px) { .ledgerRow { grid-template-columns: 1fr; gap: 4px; } }
        .dir { display: inline-block; width: 14px; font-family: var(--mono); }
        .dir[data-d="up"]::before { content: "↑"; color: ${C.amber}; }
        .dir[data-d="down"]::before { content: "↓"; color: ${C.blue}; }
        .dir[data-d="off"]::before { content: "·"; color: ${C.dim}; }
        .yearRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
        .readGrid { border: 1px solid ${C.line}; border-radius: 6px; overflow: hidden; }
        .readRow { display: grid; grid-template-columns: 1fr 90px 90px 90px; gap: 8px; padding: 10px 14px; width: 100%;
          border: none; border-bottom: 1px solid ${C.line}; background: transparent; color: #C7D1E2; text-align: left;
          font-size: 13px; cursor: pointer; align-items: center; }
        .readRow:last-child { border-bottom: none; }
        .readRow.head { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
          color: ${C.dim}; background: ${C.panel2}; cursor: default; }
        .readRow.sel { background: rgba(255,255,255,0.035); }
        .readBand { font-weight: 500; }
        @media (max-width: 640px) { .readRow { grid-template-columns: 1fr 50px 50px 50px; font-size: 12px; } }
        .readNote { margin-top: 12px; padding: 11px 14px; background: ${C.panel2}; border-radius: 6px;
          font-size: 13px; line-height: 1.6; color: #C7D1E2; }
        .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: ${C.dim}; }
        .legend span { display: flex; gap: 5px; align-items: center; }
        .stack { display: flex; flex-direction: column; gap: 8px; }
        .layer { display: flex; justify-content: space-between; align-items: center; gap: 10px;
          background: ${C.panel2}; border: 1px solid ${C.line}; border-left: 3px solid var(--tone);
          border-radius: 6px; padding: 14px; cursor: pointer; color: ${C.text}; text-align: left; }
        .layer.on { background: rgba(255,255,255,0.03); border-color: var(--tone); }
        .layerName { font-size: 14px; font-weight: 600; }
        .layerTag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--tone); }
        .freqChips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .chip { font-family: var(--mono); font-size: 10.5px; color: ${C.dim}; border: 1px solid ${C.line};
          border-radius: 4px; padding: 3px 8px; }
        .hop { display: flex; gap: 12px; align-items: baseline; font-size: 13.5px; line-height: 1.55; color: #C7D1E2;
          padding: 8px 0; border-bottom: 1px solid ${C.line}; }
        .hop:last-child { border-bottom: none; }
        .hopN { font-family: var(--mono); font-size: 11px; color: ${C.amber}; border: 1px solid ${C.line};
          border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center;
          justify-content: center; flex: none; }
        .quote { padding: 12px 0; border-bottom: 1px solid ${C.line}; }
        .quote:last-child { border-bottom: none; }
        .quote p { font-size: 14px; line-height: 1.6; color: #C7D1E2; }
        .quoteWho { font-family: var(--mono); font-size: 11px; color: ${C.dim}; margin-top: 7px; }
        .genGrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        @media (max-width: 900px) { .genGrid { grid-template-columns: 1fr; } }
        .specRow { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
          border-bottom: 1px solid ${C.line}; font-size: 12.5px; }
        .specRow:last-of-type { border-bottom: none; }
        .specL { color: ${C.dim}; font-family: var(--mono); font-size: 11px; flex: none; padding-top: 1px; }
        .specV { color: #C7D1E2; text-align: right; line-height: 1.45; }
        .benchGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 700px) { .benchGrid { grid-template-columns: 1fr; } }
        .bench { background: ${C.panel2}; border: 1px solid ${C.line}; border-radius: 6px; padding: 13px; }
        .benchT { font-size: 13.5px; font-weight: 600; margin-bottom: 5px; }
        .benchW { font-size: 12.5px; color: ${C.dim}; line-height: 1.55; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
      `}</style>

      <header className="hdr">
        <div className="kicker">Starlink Mobile · Interactive Roadmap · Data as of Aug 2026</div>
        <h1 className="title">From texts in a field to a <em>fourth carrier</em></h1>
        <p className="sub">
          How SpaceX plans to turn 65 MHz of EchoStar spectrum, a 5G constellation, and millions of rooftop dishes
          into a phone service — phase by phase, with the physics, the mode-switch, the configuration lab, and the
          skeptics included.
        </p>
      </header>

      <nav className="tabs wrap" role="tablist">
        {TABS.map((t) => (
          <button key={t.id} role="tab" aria-selected={tab === t.id}
            className={"tab" + (tab === t.id ? " on" : "")} onClick={() => setTab(t.id)}>
            {t.label}
          </button>
        ))}
      </nav>

      <main className="wrap">
        {tab === "story" && <StoryTab phase={phase} setPhase={setPhase} />}
        {tab === "spectrum" && <SpectrumTab cfg={cfg} setCfg={setCfg} />}
        {tab === "physics" && <PhysicsTab cfg={cfg} setCfg={setCfg} />}
        {tab === "tech" && <TechTab />}
        {tab === "network" && <NetworkTab />}
        {tab === "reg" && <RegTab />}
        {tab === "verdict" && <VerdictTab />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<StarlinkMobileRoadmap />);
</script>
</body>
</html>
